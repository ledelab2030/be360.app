};

// Mismo helper que panel/index.html y equipo/index.html.
function relativeDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const diffH = Math.round((Date.now() - d.getTime()) / 3600000);
  if (diffH < 1) return "hace menos de una hora";
  if (diffH < 24) return "hace " + diffH + "h";
  const diffD = Math.round(diffH / 24);
  return "hace " + diffD + (diffD === 1 ? " día" : " días");
}

const parseEscalar = (text) => {
  const m = text.match(/<escalar>([\s\S]*?)<\/escalar>/);
  const clean = text.replace(/<escalar>[\s\S]*?<\/escalar>/g, "").trim();
  if (!m) return { clean, motivo: null, detalle: null };
  const raw = m[1].trim();
  const i = raw.indexOf("|");
  if (i === -1) return { clean, motivo: raw, detalle: null };
  return { clean, motivo: raw.slice(0, i).trim(), detalle: raw.slice(i + 1).trim() };
};

// ---- PDF: idéntico a plan/index.html — ver ese archivo para las notas
// completas sobre el saneo de caracteres y el agrupado por estilo. ----
const PDF_MARGIN = 40;
const PDF_LINE_HEIGHT = 15;

function sanearTextoPdf(texto) {
  if (!texto) return texto;
  return texto
    .replace(/═+/g, m => "-".repeat(m.length))
    .replace(/[\u{1F000}-\u{1FFFF}]/gu, "")
    .replace(/[←-⯿]/g, "")
    .replace(/[️‍]/g, "");
}

function pdfEscribirParrafo(doc, texto, x, y, maxWidth, fontSize) {
  texto = sanearTextoPdf(texto);
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFontSize(fontSize);
  const segmentos = (texto || "").split(/(\*\*[^*]+\*\*)/g).filter(s => s !== "");
  const palabras = [];
  for (const seg of segmentos) {
    const negrita = seg.startsWith("**") && seg.endsWith("**");
    const contenido = negrita ? seg.slice(2, -2) : seg;
    contenido.split(" ").forEach(w => { if (w !== "") palabras.push({ texto: w, negrita }); });
  }
  let linea = [];
  let anchoLinea = 0;
  const anchoEspacio = doc.getTextWidth(" ");
  const escribirLinea = () => {
    if (linea.length === 0) return;
    let cx = x;
    let i = 0;
    while (i < linea.length) {
      const negrita = linea[i].negrita;
      const grupo = [];
      while (i < linea.length && linea[i].negrita === negrita) { grupo.push(linea[i].texto); i++; }
      const textoGrupo = grupo.join(" ");
      doc.setFont(undefined, negrita ? "bold" : "normal");
      doc.text(textoGrupo, cx, y);
      cx += doc.getTextWidth(textoGrupo) + anchoEspacio;
    }
    y += PDF_LINE_HEIGHT;
    if (y > pageHeight - PDF_MARGIN) { doc.addPage(); y = PDF_MARGIN; }
    linea = []; anchoLinea = 0;
  };
  for (const p of palabras) {
    doc.setFont(undefined, p.negrita ? "bold" : "normal");
    const anchoPalabra = doc.getTextWidth(p.texto);
    if (linea.length && anchoLinea + anchoEspacio + anchoPalabra > maxWidth) escribirLinea();
    linea.push(p);
    anchoLinea += (linea.length > 1 ? anchoEspacio : 0) + anchoPalabra;
  }
  escribirLinea();
  doc.setFont(undefined, "normal");
  return y;
}

function descargarPdf(nombreNino, mensaje, habitos) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const maxWidth = doc.internal.pageSize.getWidth() - PDF_MARGIN * 2;
  let y = PDF_MARGIN;

  doc.setFont(undefined, "bold"); doc.setFontSize(16);
  doc.text("Plan de hábitos de " + sanearTextoPdf(nombreNino || "tu hijo/a"), PDF_MARGIN, y);
  y += 22;
  doc.setFont(undefined, "normal"); doc.setFontSize(10.5);
  doc.setTextColor(140, 132, 115);
  doc.text("Revisado y aprobado por Peter Álvarez — Bienestar 360", PDF_MARGIN, y);
  doc.setTextColor(44, 42, 36);
  y += 26;

  (mensaje || "").split("\n").forEach(parrafo => {
    if (parrafo.trim() === "") { y += PDF_LINE_HEIGHT * 0.6; return; }
    y = pdfEscribirParrafo(doc, parrafo, PDF_MARGIN, y, maxWidth, 11);
  });

  if (habitos.length) {
    y += 10;
    if (y > doc.internal.pageSize.getHeight() - PDF_MARGIN - 30) { doc.addPage(); y = PDF_MARGIN; }
    doc.setFont(undefined, "bold"); doc.setFontSize(13);
    doc.text("Hábitos", PDF_MARGIN, y);
    y += 20;
    habitos.forEach((h, i) => {
      y = pdfEscribirParrafo(doc, "**" + (i + 1) + ". " + (h.titulo || "") + "**", PDF_MARGIN, y, maxWidth, 11.5);
      y = pdfEscribirParrafo(doc, h.texto || "", PDF_MARGIN, y, maxWidth, 10.5);
      y += 8;
    });
  }

  doc.save("plan-" + (nombreNino || "bienestar360").trim().replace(/\s+/g, "-").toLowerCase() + ".pdf");
}

  etapas.sort((a,b) => new Date(a.ts) - new Date(b.ts));
  return etapas;
}

      .then(r => r.json())
      .then(json => {
        if (!json || json.ok !== true) { setStage("no_disponible"); return; }
        setData(json);
        setNovedades(Array.isArray(json.novedades) ? json.novedades : []);
        // Continuidad del chat (27 oct 2026, pedido de Leonardo — "el chat
        // completo también"): si ya hay conversación guardada, se carga tal
        // cual en vez de arrancar en blanco — y se marca "chatIniciado" para
        // que el autoarranque de la pestaña Vita (más abajo) no le agregue
        // un segundo saludo encima.
        if (Array.isArray(json.chatHistory) && json.chatHistory.length) {
          setMessages(json.chatHistory.map(m => ({ role: m.role, content: m.content })));
          setChatIniciado(true);
        }
        try {
          // Mismos keys de localStorage que plan/index.html, a propósito —
          // si una familia usa las dos páginas, los Retos no se duplican.
          setRetosOn(localStorage.getItem("retos_on_" + id) === "1");

        } catch (e) {}
        setStage("ok");
      })
      .catch(() => setStage("no_disponible"));
  }, [id]);

  const toggleRetosOn = () => {
    setRetosOn(prev => {
      const next = !prev;
      try { localStorage.setItem("retos_on_" + id, next ? "1" : "0"); } catch (e) {}
      return next;
    });

    setRetosLog(prev => {

      dias[hoy] = !dias[hoy];
      const next = { ...prev, [retoId]: dias };
      try { localStorage.setItem("retos_log_" + id, JSON.stringify(next)); } catch (e) {}
      return next;
    });

  const notificarEscalar = (motivo, mensajePadre, keepalive) => {
    fetch(WORKER_URL + "/escalar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idPlan: id, nombreNino: data && data.nombreNino, motivo, mensajePadre }),
      ...(keepalive ? { keepalive: true } : {}),
    }).catch(() => {});
  };

  // Guarda el chat completo (27 oct 2026, pedido de Leonardo) — a
  // diferencia de notificarEscalar (solo lo que se escala), esto guarda
  // TODO el turno, se escale o no. Se llama una vez por turno completo
  // (nunca mensaje por mensaje) para no multiplicar llamadas — ver
  // startChat/sendChat más abajo. Igual que notificarEscalar, no bloquea
  // el chat si falla: es persistencia de fondo, no algo que el padre tenga

  const guardarChat = (mensajes) => {

      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idPlan: id, mensajes }),

  };

  const flushDatoNuevoPendiente = (keepalive) => {
    if (datoNuevoTimerRef.current) { clearTimeout(datoNuevoTimerRef.current); datoNuevoTimerRef.current = null; }
    const pendiente = datoNuevoPendienteRef.current;
    if (!pendiente) return;
    datoNuevoPendienteRef.current = null;
    notificarEscalar(pendiente.motivo, pendiente.detalle, keepalive);

  const DATO_NUEVO_ESPERA_MS = 45000;

  const manejarEscalar = (motivo, detalle, mensajeFallback) => {
    if (!motivo) return;
    if (motivo === "dato_nuevo") {
      datoNuevoPendienteRef.current = { motivo, detalle: detalle || mensajeFallback };
      if (datoNuevoTimerRef.current) clearTimeout(datoNuevoTimerRef.current);
      datoNuevoTimerRef.current = setTimeout(flushDatoNuevoPendiente, DATO_NUEVO_ESPERA_MS);
      return;
    }
    notificarEscalar(motivo, detalle || mensajeFallback);
  };

  // Mismo fix de closure vieja que plan/index.html (ver ese archivo para el
  // bug real que lo motivó, caso de Samuel).
  const flushDatoNuevoPendienteRef = React.useRef(flushDatoNuevoPendiente);
  flushDatoNuevoPendienteRef.current = flushDatoNuevoPendiente;

  useEffect(() => {
    const onHide = () => flushDatoNuevoPendienteRef.current(true);
    const onVisibility = () => { if (document.visibilityState === "hidden") onHide(); };
    window.addEventListener("pagehide", onHide);
    document.addEventListener("visibilitychange", onVisibility);
    return () => {
      window.removeEventListener("pagehide", onHide);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  const callVitaSeguimiento = async (msgs) => {
    const res = await fetch(WORKER_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 800, system: buildSeguimientoPrompt(data), messages: msgs.map(m => ({ role: m.role, content: m.content })) }),
    });
    const json = await res.json();
    return (json.content || []).filter(b => b.type === "text").map(b => b.text).join("\n") || "…";
  };

  const startChat = async () => {
    setChatIniciado(true); setChatLoading(true); setChatError(null);
    try {
      const opener = "[Empieza la conversación de seguimiento. Saluda breve, recuerda que su plan ya está aprobado, y pregunta con calidez en qué le puedes ayudar hoy — NO le preguntes directamente cómo le ha ido con los hábitos ni le pidas un reporte, deja que el padre/madre lleve la conversación.]";
      const raw = await callVitaSeguimiento([{ role: "user", content: opener }]);
      const { clean, motivo, detalle } = parseEscalar(raw);
      setMessages([{ role: "assistant", content: clean }]);
      manejarEscalar(motivo, detalle, "(inicio de conversación)");
      // Solo se guarda el saludo de Vita — el "opener" es una instrucción
      // interna al modelo, no algo que el padre/madre haya dicho.
      guardarChat([{ ts: new Date().toISOString(), role: "assistant", content: clean }]);
    } catch (e) { setChatError("No se pudo conectar. Reintenta."); }
    finally { setChatLoading(false); }
  };

  // Autoarranque del chat (27 oct 2026, nuevo acá): en plan/index.html el
  // chat se abría con un clic explícito ("Escribirle a Vita"); acá Vita es
  // una pestaña persistente, así que arranca sola la primera vez que el
  // padre/madre entra a esa pestaña — una sola vez por sesión (chatIniciado).
  useEffect(() => {
    if (tab === "vita" && !chatIniciado && stage === "ok") startChat();
  }, [tab, stage]);

  const sendChat = async (text) => {
    const content = (text ?? input).trim();
    if (!content || chatLoading) return;
    setChatError(null);
    const next = [...messages, { role: "user", content }];
    setMessages(next); setInput(""); setChatLoading(true);
    try {
      const raw = await callVitaSeguimiento(next);
      const { clean, motivo, detalle } = parseEscalar(raw);
      setMessages(m => [...m, { role: "assistant", content: clean }]);
      manejarEscalar(motivo, detalle, content);
      // Se guarda el turno completo — lo que escribió el padre/madre Y la
      // respuesta de Vita, en una sola llamada.
      guardarChat([
        { ts: new Date().toISOString(), role: "user", content },
        { ts: new Date().toISOString(), role: "assistant", content: clean },
      ]);
    } catch (e) { setChatError("No se pudo conectar. Reintenta."); }
    finally { setChatLoading(false); }
  };

  if (stage === "cargando") {
    return (
      <div style={{minHeight:"100vh", background:P.bg, fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", color:P.ink, display:"flex", alignItems:"center", justifyContent:"center"}}>
        <div style={{color:P.muted}}>Cargando tu plan…</div>
      </div>
    );
  }

  if (stage === "no_disponible") {
    const waNum = "37281282920";
    const waMsg = encodeURIComponent("Hola, quería preguntar por el plan de mi hijo/a.");
    return (
      <div style={{minHeight:"100vh", background:P.bg, fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", color:P.ink, display:"flex", alignItems:"center", justifyContent:"center", padding:"32px 14px"}}>
        <div style={{textAlign:"center", padding:"40px 20px", maxWidth:420}}>
          <div style={{fontSize:44, marginBottom:14}}>🌱</div>
          <div style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontSize:22, color:P.sageDeep, marginBottom:10}}>Todavía no está listo</div>
          <p style={{fontSize:14, color:P.muted, lineHeight:1.6, marginBottom:22}}>Este plan aún está en revisión, o el link no es válido. Si crees que es un error, escríbenos.</p>
          <a href={"https://wa.me/"+waNum+"?text="+waMsg} target="_blank" rel="noopener noreferrer" style={{display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8, background:P.sage, color:"#fff", fontWeight:800, fontSize:14.5, borderRadius:999, padding:"13px 24px", textDecoration:"none", boxShadow:"0 10px 24px rgba(74,112,69,.30)"}}>Escribirnos por WhatsApp</a>
        </div>
      </div>
    );
  }

  const habitos = (data.plan && data.plan.habitos) || [];
  const esVita = tab === "vita";

  return (
    <div style={{minHeight:"100vh", background:P.bg, fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", color:P.ink, display:"flex", justifyContent:"center"}}>
      <div style={{width:"100%", maxWidth:900, display:"flex", gap:26, padding: esVita ? "28px 0 0" : "28px 14px 90px", alignItems:"flex-start"}}>
        <div style={{padding: esVita?"0 0 0 14px":0}}>
          <SidebarDesktop tab={tab} onTab={setTab}/>
        </div>

        <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column"}}>
          {tab === "hoy" && (
            <div className="rise" style={{display:"flex", flexDirection:"column", gap:18, padding: esVita?0:"0 0 0", maxWidth:440}}>
              <div>
                <div style={{fontSize:11.5, fontWeight:800, letterSpacing:".09em", textTransform:"uppercase", color:P.sageDeep}}>Hoy</div>
                <h1 style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontWeight:600, fontSize:"clamp(24px,6vw,28px)", lineHeight:1.15, margin:"4px 0 0", color:P.sageDeep}}>Lo que toca hoy</h1>
              </div>
              <div style={{display:"flex", flexDirection:"column", gap:10}}>
                {habitos.map((h,i) => (
                  <div key={i} style={{background:P.panel, border:"1px solid "+P.line, borderRadius:16, padding:"14px 16px"}}>
                    <div style={{fontSize:14, fontWeight:800, color:P.ink, marginBottom:4}}>{h.titulo}</div>
                    <div style={{fontSize:13, color:P.muted, lineHeight:1.5}}>{h.texto}</div>
                  </div>
                ))}
                {habitos.length === 0 && <p style={{fontSize:13, color:P.muted}}>Todavía no hay hábitos registrados en el plan.</p>}
              </div>

              {retosFlag && (
                <div style={{display:"flex", flexDirection:"column", gap:12, background:P.panel, border:"1px solid "+P.line, borderRadius:18, padding:"16px 17px"}}>
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:10}}>
                    <div>
                      <div style={{fontSize:14.5, fontWeight:800, color:P.ink}}>Retos de bienestar</div>
                      <div style={{fontSize:12, color:P.muted, marginTop:2}}>Opcional · solo lo ves tú, no se comparte con el colegio</div>
                    </div>
                    <button onClick={toggleRetosOn} aria-checked={retosOn} style={{flexShrink:0, width:44, height:26, borderRadius:99, border:"1.5px solid "+(retosOn?P.sage:P.line), background: retosOn?P.sage:P.panelRaised, position:"relative", cursor:"pointer"}}>
                      <span style={{position:"absolute", top:2, left: retosOn?20:2, width:19, height:19, borderRadius:"50%", background:"#fff", transition:"left .18s", boxShadow:"0 1px 2px rgba(26,26,26,.25)"}}/>
                    </button>
                  </div>
                  {retosOn && (
                    <div style={{display:"flex", flexDirection:"column", gap:10}}>
                      {RETOS.map(r => {
                        const hoyHecho = !!((retosLog[r.id] || {})[todayKey()]);
                        return (
                          <div key={r.id} style={{display:"flex", gap:12, alignItems:"flex-start", background: hoyHecho?P.sageSoft:P.panelRaised, border:"1px solid "+(hoyHecho?P.sage:P.line), borderRadius:14, padding:"12px 13px"}}>
                            <button onClick={() => toggleRetoHoy(r.id)} aria-checked={hoyHecho} style={{flexShrink:0, width:24, height:24, borderRadius:8, border:"1.5px solid "+(hoyHecho?P.sage:P.line), background: hoyHecho?P.sage:P.panelRaised, color: hoyHecho?"#fff":"transparent", cursor:"pointer", display:"grid", placeItems:"center", marginTop:1}}>
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" width="13" height="13"><path d="M4 12l5 5L20 6"/></svg>
                            </button>
                            <div style={{flex:1, minWidth:0}}>
                              <p style={{fontSize:13.5, fontWeight:800, margin:"0 0 2px", color:P.ink}}>{r.titulo}</p>
                              <p style={{fontSize:12.5, lineHeight:1.5, color:P.muted, margin:0}}>{r.texto}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {tab === "plan" && (
            <div className="rise" style={{display:"flex", flexDirection:"column", gap:18, maxWidth:440}}>
              <div style={{display:"flex", flexDirection:"column", gap:6}}>
                <div style={{fontSize:11.5, fontWeight:800, letterSpacing:".09em", textTransform:"uppercase", color:P.sageDeep}}>Plan de bienestar</div>
                <h1 style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontWeight:600, fontSize:"clamp(26px,7vw,32px)", lineHeight:1.1, margin:0, color:P.sageDeep}}>
                  El plan de {data.nombreNino || "tu hijo/a"}
                </h1>
                <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap"}}>
                  <div style={{fontSize:13, color:P.muted}}>Revisado y aprobado por <b style={{color:P.ink}}>Peter Álvarez</b></div>
                  <button onClick={() => descargarPdf(data.nombreNino, data.mensaje, habitos)} style={{display:"inline-flex", alignItems:"center", gap:6, background:"none", border:"1.5px solid "+P.line, borderRadius:999, padding:"7px 14px", fontSize:12.5, fontWeight:800, color:P.sageDeep, cursor:"pointer", fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"}}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                    Descargar PDF
                  </button>
                </div>
              </div>
              {data.mensaje && (
                <div style={{fontSize:14.5, lineHeight:1.6, background:P.panel, border:"1px solid "+P.line, borderRadius:18, padding:"16px 18px", whiteSpace:"pre-wrap"}}>
                  {renderRich(data.mensaje)}
                </div>
              )}
              <p style={{fontSize:11.5, textAlign:"center", color:P.muted, lineHeight:1.6}}>
                Esto acompaña y suma con su pediatra — no lo reemplaza.
              </p>
            </div>
          )}

          {tab === "seguimiento" && (
            <div className="rise" style={{display:"flex", flexDirection:"column", gap:22, maxWidth:440}}>
              <div>
                <div style={{fontSize:11.5, fontWeight:800, letterSpacing:".09em", textTransform:"uppercase", color:P.sageDeep}}>Seguimiento</div>
                <h1 style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontWeight:600, fontSize:"clamp(24px,6vw,28px)", lineHeight:1.15, margin:"4px 0 0", color:P.sageDeep}}>Cómo les ha ido</h1>
              </div>

              {/* Línea de tiempo de novedades (27 oct 2026, pedido de
                  Leonardo): lo mismo que ya ve el equipo en panel/equipo —
                  fecha + resumen de lo que se compartió o confirmó. No es
                  información nueva: ya se la mandábamos por correo cuando
                  escalaba, y la escribió el propio padre/madre en el chat. */}
              {novedades.length > 0 && (
                <div style={{display:"flex", flexDirection:"column", gap:10}}>
                  <div style={{fontSize:13, fontWeight:800, color:P.sageDeep}}>Lo que le has contado al equipo</div>
                  {novedades.slice().reverse().map((n, i) => (
                    <div key={i} style={{background:P.panel, border:"1px solid "+P.line, borderRadius:14, padding:"13px 15px"}}>
                      <div style={{fontSize:11, color:P.muted, marginBottom:4}}>{relativeDate(n.ts)}</div>
                      <div style={{fontSize:13.5, color:P.ink, lineHeight:1.5}}>{n.resumen || "(sin resumen)"}</div>
                    </div>
                  ))}
                </div>
              )}

              {retosFlag && retosOn && (
                <div style={{display:"flex", flexDirection:"column", gap:10}}>
                  <div style={{fontSize:13, fontWeight:800, color:P.sageDeep}}>Tus retos</div>
                  {RETOS.map(r => {
                    const actual = contarDias(retosLog, r.id, 0, 6);
                    const anterior = contarDias(retosLog, r.id, 7, 13);
                    return (
                      <div key={r.id} style={{background:P.panel, border:"1px solid "+P.line, borderRadius:14, padding:"13px 15px"}}>
                        <p style={{fontSize:13.5, fontWeight:800, margin:"0 0 6px", color:P.ink}}>{r.titulo}</p>
                        <p style={{fontSize:12.5, fontWeight:700, color:P.sageDeep, margin:0}}>Esta semana: {actual} de 7 · Semana pasada: {anterior} de 7</p>
                      </div>
                    );
                  })}
                </div>
              )}

              {novedades.length === 0 && !(retosFlag && retosOn) && (
                <div style={{textAlign:"center", padding:"50px 10px", color:P.muted, background:P.panel, border:"1px solid "+P.line, borderRadius:20}}>
                  <div style={{fontSize:34, marginBottom:10}}>🌱</div>
                  <div style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontSize:17, color:P.sageDeep, marginBottom:8}}>Todavía no hay nada que mostrar</div>
                  <div style={{fontSize:13, maxWidth:280, margin:"0 auto", lineHeight:1.6}}>Cuéntale a Vita cómo les ha ido — cada vez que compartas algo nuevo, va a quedar registrado acá.</div>
                </div>
              )}
            </div>
          )}

          {tab === "progreso" && (() => {
            const etapas = etapasProgreso(data, novedades, data.chatHistory || []);
            return (
              <div className="rise" style={{display:"flex", flexDirection:"column", gap:22, maxWidth:440}}>
                <div>
                  <div style={{fontSize:11.5, fontWeight:800, letterSpacing:".09em", textTransform:"uppercase", color:P.sageDeep}}>Progreso</div>
                  <h1 style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontWeight:600, fontSize:"clamp(24px,6vw,28px)", lineHeight:1.15, margin:"4px 0 0", color:P.sageDeep}}>El camino hasta ahora</h1>
                </div>

                <div style={{display:"flex", flexDirection:"column"}}>
                  {etapas.map((e, i) => (
                    <div key={i} style={{display:"flex", gap:14}}>
                      <div style={{display:"flex", flexDirection:"column", alignItems:"center", flexShrink:0}}>
                        <div style={{width:14, height:14, borderRadius:"50%", background:P.sage, border:"3px solid "+P.panelRaised, boxShadow:"0 0 0 2px "+P.sage, marginTop:3}}/>
                        {(i < etapas.length - 1 || ETAPAS_PROXIMAS.length) && <div style={{width:2, flex:1, background:P.line, minHeight:28}}/>}
                      </div>
                      <div style={{paddingBottom:20}}>
                        <div style={{fontSize:14, fontWeight:800, color:P.ink}}>{e.titulo}</div>
                        <div style={{fontSize:12, color:P.muted, marginTop:2}}>{relativeDate(e.ts)}</div>
                      </div>
                    </div>
                  ))}
                  {ETAPAS_PROXIMAS.map((titulo, i) => (
                    <div key={"prox"+i} style={{display:"flex", gap:14}}>
                      <div style={{display:"flex", flexDirection:"column", alignItems:"center", flexShrink:0}}>
                        <div style={{width:14, height:14, borderRadius:"50%", background:P.panelRaised, border:"2px dashed "+P.line, marginTop:3}}/>
                        {i < ETAPAS_PROXIMAS.length - 1 && <div style={{width:2, flex:1, background:P.line, minHeight:28, opacity:.5}}/>}
                      </div>
                      <div style={{paddingBottom:20}}>
                        <div style={{fontSize:14, fontWeight:700, color:P.muted}}>{titulo}</div>
                        <div style={{fontSize:12, color:P.muted, marginTop:2}}>Próximamente</div>
                      </div>
                    </div>
                  ))}
                </div>

                {etapas.length === 0 && (
                  <div style={{textAlign:"center", padding:"50px 10px", color:P.muted, background:P.panel, border:"1px solid "+P.line, borderRadius:20}}>
                    <div style={{fontSize:34, marginBottom:10}}>🌱</div>
                    <div style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontSize:17, color:P.sageDeep, marginBottom:8}}>Apenas empezando</div>
                    <div style={{fontSize:13, maxWidth:280, margin:"0 auto", lineHeight:1.6}}>Las primeras etapas van a aparecer acá apenas tengan fecha.</div>
                  </div>
                )}
              </div>
            );
          })()}

          {tab === "vita" && (
            <div className="rise" style={{display:"flex", flexDirection:"column", height:"calc(100vh - 28px)", background:P.panel, overflow:"hidden", border:"1px solid "+P.line, borderTopLeftRadius:26}}>
              <div style={{background:"linear-gradient(135deg,"+P.sageDeep+","+P.sage+")", padding:"14px 16px", display:"flex", alignItems:"center", gap:11}}>
                <div style={{width:40, height:40, borderRadius:"50%", background:P.panel, display:"grid", placeItems:"center", fontSize:20}}>🌱</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", fontWeight:600, fontSize:19, color:"#fff", lineHeight:1}}>Vita</div>
                  <div style={{fontSize:11.5, color:P.sageSoft, marginTop:3}}>{chatLoading ? "escribiendo…" : "Acompañamiento · " + (data.nombreNino || "")}</div>
                </div>
              </div>
              <div ref={scrollRef} className="scroll" style={{flex:1, overflowY:"auto", padding:"16px 13px", display:"flex", flexDirection:"column", gap:10, background:"radial-gradient("+P.sageSoft+"55 1px,transparent 1px)", backgroundSize:"22px 22px"}}>
                {messages.map((m,i) => (
                  <div key={i} className="rise" style={{alignSelf: m.role==="user"?"flex-end":"flex-start", maxWidth:"84%"}}>
                    <div style={{background: m.role==="user"?P.user:"#fff", color:P.ink, padding:"10px 13px", borderRadius: m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px", fontSize:14.5, lineHeight:1.5, boxShadow:"0 1px 2px rgba(26,26,26,.10)", whiteSpace:"pre-wrap", border: m.role==="user"?"none":"1px solid "+P.line}}>{renderRich(m.content)}</div>
                  </div>
                ))}
                {chatLoading && (<div style={{alignSelf:"flex-start", background:"#fff", padding:"12px 15px", borderRadius:"16px 16px 16px 4px", border:"1px solid "+P.line}}><span className="dot"/> <span className="dot"/> <span className="dot"/></div>)}
                {chatError && !chatLoading && (
                  <div style={{alignSelf:"center", textAlign:"center", color:P.clay, fontSize:12.5, background:"#fff", padding:"10px 14px", borderRadius:12, border:"1px solid "+P.line, maxWidth:"92%"}}>
                    {chatError}
                    <div style={{marginTop:8}}><button onClick={() => messages.length===0 ? startChat() : sendChat(messages[messages.length-1].role==="user"?messages[messages.length-1].content:"")} style={{background:P.sage, border:"none", color:"#fff", borderRadius:999, padding:"7px 18px", fontSize:12.5, fontWeight:700, cursor:"pointer", fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"}}>Reintentar</button></div>
                  </div>
                )}
              </div>
              <div style={{padding:"10px 12px", background:P.panel, borderTop:"1px solid "+P.line, display:"flex", gap:8, alignItems:"flex-end"}}>
                <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}}} placeholder="Escribe aquí…" rows={1} style={{flex:1, resize:"none", border:"1px solid "+P.line, borderRadius:20, padding:"11px 15px", fontSize:14.5, fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif", maxHeight:110, background:"#fff", color:P.ink, outline:"none"}}/>
                <button onClick={()=>sendChat()} disabled={chatLoading||!input.trim()} style={{width:46, height:46, borderRadius:"50%", border:"none", background: input.trim()?P.sage:P.line, color:"#fff", fontSize:19, cursor: input.trim()?"pointer":"default", flexShrink:0}}>➤</button>
              </div>
            </div>
          )}
        </div>
      </div>
      <TabBarMobile tab={tab} onTab={setTab}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
