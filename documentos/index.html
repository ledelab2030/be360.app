<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>Documentos · be360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Vanilla JS a propósito, mismo criterio que verificar/index.html: página
     de una sola lista, no necesita React/Babel. Pública a propósito (10 nov
     2026, pedido de Leonardo) — sin PIN, porque no expone ningún dato de
     ningún niño, solo metadata de documentos clínicos (nombre, versión,
     estado, link de Drive) que vive en la pestaña "Documentos" del Sheet. */
  html,body{margin:0;min-height:100%}
  *{box-sizing:border-box}
  body{background:#ECE5D8;font-family:'Nunito',sans-serif;color:#2C2A24;padding:28px 16px 60px;}
  .shell{width:100%;max-width:720px;margin:0 auto}
  h1{font-family:'Fraunces',serif;font-size:28px;color:#3E5A40;margin:0 0 6px;line-height:1.2}
  .subt{font-size:14px;color:#8A8473;margin:0 0 28px;line-height:1.6}
  .lista{display:flex;flex-direction:column;gap:12px}
  .doc{background:#FBF8F1;border:1px solid #D8CFBE;border-radius:16px;padding:18px 20px;box-shadow:0 10px 26px rgba(40,42,36,.08);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
  .doc .nombre{font-family:'Fraunces',serif;font-size:17px;color:#2C2A24;flex:1 1 260px}
  .doc .version{font-size:12.5px;color:#8A8473;font-weight:700}
  .badge{font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.firmado{background:#E3EEDF;color:#3E5A40}
  .badge.pendiente{background:#F7E9D7;color:#8A5A2B}
  .badge.borrador{background:#EDEAE3;color:#6B6557}
  .doc .fecha{font-size:12.5px;color:#8A8473}
  .doc a.abrir{margin-left:auto;background:#5A7A5C;color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:9px 18px;border-radius:999px;white-space:nowrap}
  .vacio,.error{background:#FBF8F1;border:1px solid #D8CFBE;border-radius:16px;padding:22px 20px;font-size:14px;color:#6B6557;text-align:center}
  .error{color:#B5764A}
  .muted{font-size:12.5px;color:#8A8473;margin-top:24px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <h1>Documentos</h1>
  <p class="subt">Sistema de Reversión Biológica, reglas duras y sus versiones — historial para consulta de Peter y el equipo.</p>
  <div id="lista" class="lista"></div>
  <p class="muted">¿Falta un documento o un link no abre? Escríbele a <a href="mailto:leonardo@ledelab.group" style="color:#5A7A5C">leonardo@ledelab.group</a>.</p>
</div>
<script>
const WORKER_URL = "https://vita-proxy.leonardo-751.workers.dev";
const lista = document.getElementById("lista");

function badgeClase(estado) {
  const e = (estado || "").toLowerCase();
  if (e.indexOf("firma") !== -1 && e.indexOf("pendiente") === -1) return "firmado";
  if (e.indexOf("pendiente") !== -1) return "pendiente";
  return "borrador";
}

function render(documentos) {
  if (!documentos.length) {
    lista.innerHTML = '<div class="vacio">Todavía no hay documentos cargados en la lista.</div>';
    return;
  }
  lista.innerHTML = documentos.map(function (d) {
    const link = (d.link || "").trim();
    return (
      '<div class="doc">' +
        '<div class="nombre">' + escapeHtml(d.nombre) + (d.version ? ' <span class="version">· ' + escapeHtml(d.version) + '</span>' : '') + '</div>' +
        (d.estado ? '<span class="badge ' + badgeClase(d.estado) + '">' + escapeHtml(d.estado) + '</span>' : '') +
        (d.fecha ? '<span class="fecha">' + escapeHtml(d.fecha) + '</span>' : '') +
        (link ? '<a class="abrir" href="' + escapeAttr(link) + '" target="_blank" rel="noopener">Abrir →</a>' : '') +
      '</div>'
    );
  }).join("");
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function escapeAttr(s) { return escapeHtml(s); }

async function cargar() {
  try {
    const res = await fetch(WORKER_URL + "/documentos-data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    const data = await res.json().catch(() => ({}));
    if (data && data.ok) { render(data.documentos || []); return; }
    lista.innerHTML = '<div class="error">No se pudo cargar la lista. Intenta de nuevo en un momento.</div>';
  } catch (e) {
    lista.innerHTML = '<div class="error">No se pudo conectar. Revisa tu conexión e intenta de nuevo.</div>';
  }
}

cargar();
</script>
</body>
</html>
