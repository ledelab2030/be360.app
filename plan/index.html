// Bandera invisible: los Retos de bienestar no existen para nadie que no

// ============================================================

//    que no hay pregunta de consentimiento nueva ni riesgo de reidentificación

// ============================================================
const RETOS = [
  { id: "bebidas", titulo: "Menos bebidas azucaradas", texto: "Marca los días en que no tomó gaseosa, jugo de caja ni bebidas con azúcar añadida." },
  { id: "ultraprocesados", titulo: "Menos ultraprocesados", texto: "Ultraprocesado no es lo mismo que \"procesado\": son productos con ingredientes que no usarías en tu cocina (colorantes, saborizantes, conservantes) — snacks empacados, cereales azucarados, embutidos. Marca los días con menos de esto en su plato." },
  { id: "movimiento", titulo: "Movimiento", texto: "Marca los días en que jugó, caminó o se movió activamente al menos 30 minutos." },
  { id: "pantallas_noche", titulo: "Sin pantallas antes de dormir", texto: "Marca los días en que se desconectó de tablet, celular o TV al menos 30 minutos antes de acostarse." },
];

const todayKey = () => new Date().toISOString().slice(0, 10);
const dateKeyDaysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

// Cuenta días marcados en una ventana [desde..hasta] días atrás — se usa
// SOLO para comparar contra la propia semana anterior, nunca contra otra
// familia. desde=0,hasta=6 = últimos 7 días; desde=7,hasta=13 = los 7 antes.
const contarDias = (log, retoId, desde, hasta) => {
  const dias = (log && log[retoId]) || {};
  let n = 0;
  for (let i = desde; i <= hasta; i++) { if (dias[dateKeyDaysAgo(i)]) n++; }
  return n;
};

// ============================================================
// PROMPT del chat de seguimiento — Vita acompaña un plan YA APROBADO por
// Peter. No propone hábitos nuevos, no cambia el plan, no diagnostica.
// Sigue la voz/reglas de design-sprint/docs/tono_identidad_bot.txt (loop de
// sostenimiento + escalamiento). Cuando hace falta escalar a Peter, el
// modelo agrega <escalar>motivo</escalar> al final — el frontend lo detecta,
// lo oculta del chat, y avisa por correo real (ver /escalar en el Worker).
// ============================================================
const buildSeguimientoPrompt = (data) => {
  const nombreNino = data.nombreNino || "tu hijo/a";
  const habitos = (data.plan && data.plan.habitos) || [];
  const habitosTexto = habitos.map((h, i) => (i + 1) + ". " + h.titulo + ": " + h.texto).join("\n") || "(sin hábitos registrados)";
  return `Eres Vita, el acompañante de bienestar de Bienestar 360. Hablas con el padre/madre de ${nombreNino} para acompañar el plan de hábitos YA APROBADO por Peter Álvarez.

# EL PLAN APROBADO DE ${nombreNino.toUpperCase()} (tu única fuente — no inventes nada fuera de esto, no propongas hábitos nuevos, no cambies el plan)
${habitosTexto}

# QUÉ HACES
Acompañas el sostenimiento de ESTOS hábitos ya aprobados. NO diagnosticas, NO prescribes, NO das ninguna recomendación nueva. Hablas SIEMPRE con el padre/madre, nunca con ${nombreNino}.

# TONO
Tuteo, cercano. CERO emojis. 2 a 4 líneas por mensaje. Una pregunta a la vez. Sin listas ni viñetas. Sin juicio, nunca culpar. No evalúas ("¿cumpliste?"), preguntas abierto ("¿cómo les fue con...?"). Si cuentan que no lograron nada esta semana: NUNCA señales la falla — ofrece una versión más pequeña del hábito ("¿y si esta semana solo martes y jueves?"). Celebra lo pequeño. Cierra con algo concreto. Nunca menciones IA, tecnología, "sin medicamentos", "revertir", "curar" ni "epigenética".

CONSULTIVA, NO PROACTIVA (26 oct 2026, pedido de Peter — minuta "Tono de acompañamiento temprano"): no abras preguntando directamente por el cumplimiento de los hábitos ni pidiendo un reporte de tareas — eso se siente invasivo. Deja que el padre/madre lleve la conversación: salúdalo y pregúntale en qué le puedes ayudar hoy. Si él mismo trae el tema de cómo les fue con algún hábito, ahí sí acompañas esa conversación con calidez, siguiendo las reglas de arriba.

# ESCALAMIENTO (agrega el marcador AL FINAL de tu respuesta, en su propia línea — nunca lo menciones ni lo expliques al padre, es invisible para el sistema)
- Señal de riesgo real (algo médico agudo, salud mental grave, mención de hacerse daño): responde con calidez, dile con claridad que contacte a su médico o a urgencias YA, y agrega: <escalar>urgencia</escalar>
- Pregunta puntual sobre el plan que no debas resolver tú, que cuestione/contradiga lo que dice el plan, o sobre medicación (ej. contenido clínico nuevo, "¿le puedo dar X en vez de Y?", "esto no es lo que dice el SRB"): NO lo justifiques, NO defiendas el plan con argumentos propios, NO prometas que alguien lo va a revisar ni que te van a contactar — responde con honestidad que no tienes esa información en este momento (ej. "Esa información no la tengo en este momento"). NO agregues ningún marcador: esto todavía no se registra en ningún lado (pendiente de una sección de solicitudes — 29 oct 2026, decisión de Leonardo y Peter).
- Pide hablar con una persona directamente: responde con honestidad que por ahora no tienes una forma de conectarlo directamente con el equipo, sin prometer que le vas a avisar a nadie ni que alguien lo va a contactar. NO agregues ningún marcador (mismo motivo que arriba: todavía no hay dónde registrarlo).
- El padre/madre comparte un dato nuevo relevante para el plan (ej. la hora real de dormir, una excepción recurrente de horario, una restricción nueva — lo que haga falta para ajustar el plan más adelante): agradece el dato con calidez y pregúntale si hay algo más que quiera agregar o actualizar antes de pasárselo al equipo — NO agregues el marcador todavía en este turno, falta confirmar que no hay más.
- El padre/madre confirma que eso es todo (dice algo como "no", "eso es todo", "nada más", "ya", o responde a tu pregunta de arriba sin agregar nada nuevo): dile que lo registras para que el equipo lo tenga en cuenta, y agrega, en la misma línea: <escalar>dato_nuevo|RESUMEN</escalar> — donde RESUMEN junta TODO lo que compartió sobre el tema en la conversación (no solo este último mensaje), completo por sí solo (no asumas que quien lo lea vio el resto de la conversación).
- Si preguntan quién está detrás: "Bienestar 360 lo lidera Peter Álvarez, con un equipo de bienestar."
- Para todo lo demás (check-ins normales, contar cómo les fue, dudas que sí puedes responder con el plan de arriba): NO agregues ningún marcador.`;
};

// parseEscalar (27 oct 2026): el marcador <escalar> ahora puede traer un
// resumen propio separado por "|" (dato_nuevo|RESUMEN) — antes todas las
// categorías eran una sola palabra fija y el mensaje que se reenviaba al
// equipo era siempre el último mensaje del padre, aunque el dato real se
// hubiera construido en varios turnos (encontrado en vivo: el padre dio la
// hora de dormir en un mensaje y la excepción de martes/viernes en el
// siguiente — reenviar solo el último habría perdido la mitad del dato).
// Las categorías de una sola palabra (urgencia, duda, solicitud_humano)
// siguen funcionando igual — "detalle" sale null y el llamador usa el
// mensaje del padre como antes.
const parseEscalar = (text) => {
  const m = text.match(/<escalar>([\s\S]*?)<\/escalar>/);
  const clean = text.replace(/<escalar>[\s\S]*?<\/escalar>/g, "").trim();
  if (!m) return { clean, motivo: null, detalle: null };
  const raw = m[1].trim();
  const i = raw.indexOf("|");
  if (i === -1) return { clean, motivo: raw, detalle: null };
  return { clean, motivo: raw.slice(0, i).trim(), detalle: raw.slice(i + 1).trim() };
};

// Links clicables (30 oct 2026, pedido de Leonardo: el cierre fijo del plan
// trae un link real a la pestaña Vita, "para que haga click el papá").
const renderConLink = (texto, keyBase) => texto.split(/(https?:\/\/[^\s]+)/g).map((seg,j) =>
  /^https?:\/\//.test(seg)
    ? <a key={keyBase+"-u"+j} href={seg} target="_blank" rel="noopener noreferrer" style={{color:P.sageDeep, fontWeight:700, wordBreak:"break-all"}}>{seg}</a>
    : seg
);

// Renderiza **negrita** como <strong>.
const renderRichLine = (line) => line.split(/(\*\*[^*]+\*\*)/g).map((part,i)=>
  part.startsWith("**")&&part.endsWith("**")
    ? <strong key={i} style={{fontWeight:800}}>{part.slice(2,-2)}</strong>
    : <React.Fragment key={i}>{renderConLink(part, i)}</React.Fragment>
);

// Una línea hecha solo de "═" es el separador de bloques que manda el modelo
// (ver sanearTextoPdf) — como texto literal es una sola "palabra" sin espacios,
// así que el navegador no la puede partir y se sale de la tarjeta. Se dibuja
// como <hr> real en vez de imprimir el carácter.
const renderRich = (text) => {
  const lines = (text||"").split("\n");
  return lines.map((line,li) => {
    if (/^═{3,}$/.test(line.trim())) {
      return <hr key={li} style={{border:"none", borderTop:"1px solid "+P.line, margin:"8px 0"}} />;
    }
    return <React.Fragment key={li}>{renderRichLine(line)}{li < lines.length-1 ? "\n" : null}</React.Fragment>;
  });
};

// ============================================================
// PDF (27 oct 2026, pedido de Leonardo) — "todo lo que se ve en pantalla":
// el mensaje completo (con negrita, igual que renderRich) + el checklist de
// hábitos, en un PDF descargable. Se genera en el navegador con jsPDF, sin
// tocar el Worker ni agregar infraestructura nueva — encaja con el resto del
// repo (páginas estáticas, sin build). Reusa el mismo parser de **negrita**
// que renderRich, pero dibujando texto en vez de JSX: jsPDF no tiene wrap de
// texto con negrita inline, así que se arma a mano palabra por palabra.
const PDF_MARGIN = 40;
const PDF_LINE_HEIGHT = 15;

// jsPDF (fuentes estándar, WinAnsiEncoding de un byte) corrompe el doc.text()
// ENTERO si el string tiene un solo carácter fuera de Windows-1252 — emoji,
// separadores Unicode como "═" — no solo ese carácter: la llamada completa
// sale con huecos o ilegible. Encontrado probando el PDF real en producción
// (27 oct 2026): la línea de corrección de la ventana de alimentación —el
// dato clínico que más costó cerrar hoy— salió corrompida por un emoji que
// el modelo agregó al inicio del párrafo. El contenido es generado por IA,
// así que no se puede predecir ni prohibir cada símbolo; se sanea antes de
// escribir.
function sanearTextoPdf(texto) {
  if (!texto) return texto;
  return texto
    .replace(/═+/g, m => "-".repeat(m.length))
    .replace(/[\u{1F000}-\u{1FFFF}]/gu, "")
    .replace(/[←-⯿]/g, "")
    .replace(/[️‍]/g, "");
}

// Color real de PDF para los encabezados del semáforo (29 oct 2026, Leonardo:
// "no están saliendo los semáforos en colores en el pdf, en el cuerpo
// editable sí"). sanearTextoPdf ya quitaba el emoji 🔴🟡🟢 en silencio — no
// por descuido, sino porque jsPDF con fuentes estándar corrompe la línea
// ENTERA si tiene un carácter fuera de Windows-1252 (ver la nota de arriba) —
// pero eso dejaba el encabezado sin ningún color, solo la palabra. En vez de
// un emoji que la fuente no puede dibujar, se usa el color de texto real de
// jsPDF para esa línea completa — mismos tonos que ya usa el resto del sitio
// (P.clay y P.sage) para que no desentone.
function colorSemaforo(parrafo) {
  const t = (parrafo || "").trim();
  if (/^(?:🔴\s*)?ROJO\b/.test(t)) return [196, 48, 43];
  if (/^(?:🟡\s*)?AMARILLO\b/.test(t)) return [181, 118, 74];
  if (/^(?:🟢\s*)?VERDE\b/.test(t)) return [74, 112, 69];
  return null;
}

// Escribe un párrafo con wrap manual y **negrita** inline, avanzando "y" y
// agregando páginas nuevas cuando hace falta. Devuelve el "y" final.
function pdfEscribirParrafo(doc, texto, x, y, maxWidth, fontSize) {
  texto = sanearTextoPdf(texto);
  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFontSize(fontSize);
  const segmentos = (texto || "").split(/(\*\*[^*]+\*\*)/g).filter(s => s !== "");
  const palabras = [];
  for (const seg of segmentos) {
    const negrita = seg.startsWith("**") && seg.endsWith("**");
    const contenido = negrita ? seg.slice(2, -2) : seg;
    contenido.split(" ").forEach(w => { if (w !== "") palabras.push({ texto: w, negrita }); });
  }
  let linea = [];
  let anchoLinea = 0;
  const anchoEspacio = doc.getTextWidth(" ");
  // FIX (27 oct 2026, encontrado probando esto antes de desplegarlo): escribir
  // CADA palabra con su propio doc.text() (un bloque BT/Tj/ET por palabra)
  // hacía que palabras sueltas desaparecieran en párrafos largos con varias
  // líneas — reproducible con un párrafo real del plan, no con una frase
  // corta de prueba aislada, así que no era obvio hasta probar con el
  // mensaje completo. Ahora se agrupan las palabras consecutivas del MISMO
  // estilo (negrita u normal) en una sola llamada a doc.text() por grupo —
  // mismo resultado visual, menos bloques de texto, y el problema no
  // reaparece en las mismas pruebas que antes lo mostraban.
  const escribirLinea = () => {
    if (linea.length === 0) return;
    let cx = x;
    let i = 0;
    while (i < linea.length) {
      const negrita = linea[i].negrita;
      const grupo = [];
      while (i < linea.length && linea[i].negrita === negrita) { grupo.push(linea[i].texto); i++; }
      const textoGrupo = grupo.join(" ");
      doc.setFont(undefined, negrita ? "bold" : "normal");
      doc.text(textoGrupo, cx, y);
      cx += doc.getTextWidth(textoGrupo) + anchoEspacio;
    }
    y += PDF_LINE_HEIGHT;
    if (y > pageHeight - PDF_MARGIN) { doc.addPage(); y = PDF_MARGIN; }
    linea = []; anchoLinea = 0;
  };
  for (const p of palabras) {
    doc.setFont(undefined, p.negrita ? "bold" : "normal");
    const anchoPalabra = doc.getTextWidth(p.texto);
    if (linea.length && anchoLinea + anchoEspacio + anchoPalabra > maxWidth) escribirLinea();
    linea.push(p);
    anchoLinea += (linea.length > 1 ? anchoEspacio : 0) + anchoPalabra;
  }
  escribirLinea();
  doc.setFont(undefined, "normal");
  return y;
}

function descargarPdf(nombreNino, mensaje) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const maxWidth = doc.internal.pageSize.getWidth() - PDF_MARGIN * 2;
  let y = PDF_MARGIN;

  doc.setFont(undefined, "bold"); doc.setFontSize(16);
  doc.text("Plan de hábitos de " + sanearTextoPdf(nombreNino || "tu hijo/a"), PDF_MARGIN, y);
  y += 22;
  doc.setFont(undefined, "normal"); doc.setFontSize(10.5);
  doc.setTextColor(140, 132, 115);
  doc.text("Revisado y aprobado por Peter Álvarez — Bienestar 360", PDF_MARGIN, y);
  doc.setTextColor(44, 42, 36);
  y += 26;

  // SIN sección "Hábitos" aparte (28 oct 2026, Leonardo: "sigue apareciendo
  // el checklist al generar el pdf") — el mensaje YA termina con "Hábitos y
  // ventana nutricional propuesta", la misma información en forma de agenda
  // por momento del día. Repetir los mismos 4-5 hábitos como lista numerada
  // acá abajo era exactamente la misma redundancia que se corrigió en el
  // mensaje del modelo, pero reintroducida por el propio generador de PDF.
  (mensaje || "").split("\n").forEach(parrafo => {
    if (parrafo.trim() === "") { y += PDF_LINE_HEIGHT * 0.6; return; }
    const color = colorSemaforo(parrafo);
    if (color) doc.setTextColor(color[0], color[1], color[2]);
    y = pdfEscribirParrafo(doc, parrafo, PDF_MARGIN, y, maxWidth, 11);
    if (color) doc.setTextColor(44, 42, 36);
  });

  doc.save("plan-" + (nombreNino || "bienestar360").trim().replace(/\s+/g, "-").toLowerCase() + ".pdf");
}

function App() {
  const [stage, setStage] = useState("cargando"); // cargando | ok | no_disponible | chat
  const [data, setData] = useState(null);
  const [retosOn, setRetosOn] = useState(false);
  const [retosLog, setRetosLog] = useState({});
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [chatError, setChatError] = useState(null);
  const scrollRef = React.useRef(null);
  const id = getIdFromUrl();
  const retosFlag = getRetosFlag();

  // Consolidación de "dato_nuevo" (27 oct 2026, encontrado probando esto en
  // vivo con un caso real): cada turno donde Vita detecta que el padre
  // compartió o confirmó un dato manda un RESUMEN COMPLETO de lo compartido
  // hasta ese punto (no incremental — necesario porque el dato puede armarse
  // en varios mensajes, ver buildSeguimientoPrompt). Pero eso significa que
  // escalar de inmediato en cada turno manda varios correos casi iguales por
  // la misma conversación — se probó en vivo y mandó 5 correos reales por
  // una sola negociación de horario. Un chat web no tiene una señal real de
  // "la conversación terminó", así que se aproxima con un período de calma:
  // se espera sin nuevos "dato_nuevo" antes de mandar, y solo se manda el
  // último resumen (el más completo). Si el padre cierra la pestaña antes de
  // que pase ese tiempo, se manda de inmediato al salir, para no perder el
  // dato por esperar una señal que nunca llega.
  const datoNuevoPendienteRef = React.useRef(null);
  const datoNuevoTimerRef = React.useRef(null);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, chatLoading]);

  useEffect(() => {
    if (!id) { setStage("no_disponible"); return; }
    fetch(WORKER_URL + "/plan?id=" + encodeURIComponent(id))
      .then(r => r.json())
      .then(json => {
        if (!json || json.ok !== true) { setStage("no_disponible"); return; }
        setData(json);
        try {
          setRetosOn(localStorage.getItem("retos_on_" + id) === "1");
          setRetosLog(JSON.parse(localStorage.getItem("retos_log_" + id) || "{}"));
        } catch (e) {}
        setStage("ok");
      })
      .catch(() => setStage("no_disponible"));
  }, [id]);

  const toggleRetosOn = () => {
    setRetosOn(prev => {
      const next = !prev;
      try { localStorage.setItem("retos_on_" + id, next ? "1" : "0"); } catch (e) {}
      return next;
    });
  };

  const toggleRetoHoy = (retoId) => {
    const hoy = todayKey();
    setRetosLog(prev => {
      const dias = { ...(prev[retoId] || {}) };
      dias[hoy] = !dias[hoy];
      const next = { ...prev, [retoId]: dias };
      try { localStorage.setItem("retos_log_" + id, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  // Notifica una señal real al equipo — sin bloquear el chat si falla.
  // keepalive=true (al cerrar la pestaña, ver flushDatoNuevoPendiente): el
  // navegador puede matar peticiones fetch normales apenas la página se
  // descarga; keepalive deja que esta termine de todas formas, igual que
  // navigator.sendBeacon pero reusando el mismo fetch de siempre.
  const notificarEscalar = (motivo, mensajePadre, keepalive) => {
    fetch(WORKER_URL + "/escalar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idPlan: id, nombreNino: data && data.nombreNino, motivo, mensajePadre }),
      ...(keepalive ? { keepalive: true } : {}),
    }).catch(() => {});
  };

  // Dispara el "dato_nuevo" pendiente ya mismo — por el período de calma que
  // se cumplió solo, o porque el padre está cerrando la pestaña antes de eso.
  const flushDatoNuevoPendiente = (keepalive) => {
    if (datoNuevoTimerRef.current) { clearTimeout(datoNuevoTimerRef.current); datoNuevoTimerRef.current = null; }
    const pendiente = datoNuevoPendienteRef.current;
    if (!pendiente) return;
    datoNuevoPendienteRef.current = null;
    notificarEscalar(pendiente.motivo, pendiente.detalle, keepalive);
  };

  // Período de calma antes de mandar un "dato_nuevo" consolidado — largo
  // para dar tiempo a que una negociación de horario termine (como la de
  // Samuel: hora de dormir → excepción de fútbol → hora de salida, 3 turnos
  // reales), corto para no quedarse esperando si el padre ya se fue.
  const DATO_NUEVO_ESPERA_MS = 45000;

  // Único punto de entrada para reaccionar al <escalar> del modelo (ambos
  // call sites, abrir chat y enviar mensaje, pasan por acá). "dato_nuevo" se
  // consolida (ver arriba); el resto de categorías (urgencia, duda,
  // solicitud_humano) se mandan de inmediato, como siempre — demorar una
  // urgencia real para "consolidarla" sería peor que el problema que se
  // arregló arriba.
  const manejarEscalar = (motivo, detalle, mensajeFallback) => {
    if (!motivo) return;
    if (motivo === "dato_nuevo") {
      datoNuevoPendienteRef.current = { motivo, detalle: detalle || mensajeFallback };
      if (datoNuevoTimerRef.current) clearTimeout(datoNuevoTimerRef.current);
      datoNuevoTimerRef.current = setTimeout(flushDatoNuevoPendiente, DATO_NUEVO_ESPERA_MS);
      return;
    }
    notificarEscalar(motivo, detalle || mensajeFallback);
  };

  // BUG REAL encontrado en vivo (27 oct 2026, caso real de Samuel): el
  // correo de escalamiento llegó con "Niño/a: (sin dato)" en vez de
  // "Samuel". Causa: el useEffect de abajo tenía deps "[]" — se registra UNA
  // vez al montar, y en ese momento "data" todavía es null (el fetch a
  // /plan?id= es async y no ha resuelto). El cierre que queda guardado en el
  // listener apunta para siempre a ESA versión de flushDatoNuevoPendiente,
  // con nombreNino congelado en null — aunque React vuelva a renderizar con
  // los datos reales después, el listener sigue llamando a la función vieja.
  // Fix: un ref que SIEMPRE apunta a la versión más reciente de
  // flushDatoNuevoPendiente (se actualiza en cada render), y el listener
  // llama a través del ref en vez de cerrar sobre la función directamente —
  // así el listener se registra una sola vez pero nunca queda desactualizado.
  const flushDatoNuevoPendienteRef = React.useRef(flushDatoNuevoPendiente);
  flushDatoNuevoPendienteRef.current = flushDatoNuevoPendiente;

  // Red de seguridad: si el padre cierra o cambia de pestaña con un
  // "dato_nuevo" todavía esperando su período de calma, se manda de
  // inmediato en vez de perderlo. pagehide cubre cerrar la pestaña y
  // navegar afuera; visibilitychange cubre minimizar o cambiar de pestaña
  // sin cerrar (en iOS Safari, pagehide no siempre llega a tiempo).
  useEffect(() => {
    const onHide = () => flushDatoNuevoPendienteRef.current(true);
    const onVisibility = () => { if (document.visibilityState === "hidden") onHide(); };
    window.addEventListener("pagehide", onHide);
    document.addEventListener("visibilitychange", onVisibility);
    return () => {
      window.removeEventListener("pagehide", onHide);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  const callVitaSeguimiento = async (msgs) => {
    const res = await fetch(WORKER_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 800, system: buildSeguimientoPrompt(data), messages: msgs.map(m => ({ role: m.role, content: m.content })) }),
    });
    const json = await res.json();
    return (json.content || []).filter(b => b.type === "text").map(b => b.text).join("\n") || "…";
  };

  const startChat = async () => {
    setStage("chat"); setChatLoading(true); setChatError(null);
    try {
      // CORREGIDO (26 oct 2026, pedido de Peter — minuta "Tono de acompañamiento
      // temprano"): antes este opener hacía que Vita abriera preguntando
      // directamente por el cumplimiento ("cómo les ha ido con alguno de los
      // hábitos") — exactamente el tono "excesivamente proactivo e invasivo"
      // que Peter pidió evitar. Ahora abre consultiva, tipo "¿en qué te puedo
      // ayudar?", y deja que el padre decida si quiere hablar de los hábitos.
      const opener = "[Empieza la conversación de seguimiento. Saluda breve, recuerda que su plan ya está aprobado, y pregunta con calidez en qué le puedes ayudar hoy — NO le preguntes directamente cómo le ha ido con los hábitos ni le pidas un reporte, deja que el padre/madre lleve la conversación.]";
      const raw = await callVitaSeguimiento([{ role: "user", content: opener }]);
      const { clean, motivo, detalle } = parseEscalar(raw);
      setMessages([{ role: "assistant", content: clean }]);
      manejarEscalar(motivo, detalle, "(inicio de conversación)");
    } catch (e) { setChatError("No se pudo conectar. Reintenta."); }
    finally { setChatLoading(false); }
  };

  const sendChat = async (text) => {
    const content = (text ?? input).trim();
    if (!content || chatLoading) return;
    setChatError(null);
    const next = [...messages, { role: "user", content }];
    setMessages(next); setInput(""); setChatLoading(true);
    try {
      const raw = await callVitaSeguimiento(next);
      const { clean, motivo, detalle } = parseEscalar(raw);
      setMessages(m => [...m, { role: "assistant", content: clean }]);
      manejarEscalar(motivo, detalle, content);
    } catch (e) { setChatError("No se pudo conectar. Reintenta."); }
    finally { setChatLoading(false); }
  };

  if (stage === "chat") {
    return (
      <ChatShell>
        <div style={{background:"linear-gradient(135deg,"+P.sageDeep+","+P.sage+")", padding:"14px 16px", display:"flex", alignItems:"center", gap:11}}>
          <div style={{width:40, height:40, borderRadius:"50%", background:P.panel, display:"grid", placeItems:"center", fontSize:20}}>🌱</div>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:19, color:"#fff", lineHeight:1}}>Vita</div>
            <div style={{fontSize:11.5, color:P.sageSoft, marginTop:3}}>{chatLoading ? "escribiendo…" : "Acompañamiento · " + (data.nombreNino || "")}</div>
          </div>
        </div>
        <div ref={scrollRef} className="scroll" style={{flex:1, overflowY:"auto", padding:"16px 13px", display:"flex", flexDirection:"column", gap:10, background:"radial-gradient("+P.sageSoft+"55 1px,transparent 1px)", backgroundSize:"22px 22px"}}>
          {messages.map((m,i) => (
            <div key={i} className="rise" style={{alignSelf: m.role==="user"?"flex-end":"flex-start", maxWidth:"84%"}}>
              <div style={{background: m.role==="user"?P.user:"#fff", color:P.ink, padding:"10px 13px", borderRadius: m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px", fontSize:14.5, lineHeight:1.5, boxShadow:"0 1px 2px rgba(40,42,36,.10)", whiteSpace:"pre-wrap", border: m.role==="user"?"none":"1px solid "+P.line}}>{renderRich(m.content)}</div>
            </div>
          ))}
          {chatLoading && (<div style={{alignSelf:"flex-start", background:"#fff", padding:"12px 15px", borderRadius:"16px 16px 16px 4px", border:"1px solid "+P.line}}><span className="dot"/> <span className="dot"/> <span className="dot"/></div>)}
          {chatError && !chatLoading && (
            <div style={{alignSelf:"center", textAlign:"center", color:P.clay, fontSize:12.5, background:"#fff", padding:"10px 14px", borderRadius:12, border:"1px solid "+P.line, maxWidth:"92%"}}>
              {chatError}
              <div style={{marginTop:8}}><button onClick={() => messages.length===0 ? startChat() : sendChat(messages[messages.length-1].role==="user"?messages[messages.length-1].content:"")} style={{background:P.sage, border:"none", color:"#fff", borderRadius:999, padding:"7px 18px", fontSize:12.5, fontWeight:700, cursor:"pointer", fontFamily:"'Nunito',sans-serif"}}>Reintentar</button></div>
            </div>
          )}
        </div>
        <div style={{padding:"10px 12px", background:P.panel, borderTop:"1px solid "+P.line, display:"flex", gap:8, alignItems:"flex-end"}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}}} placeholder="Escribe aquí…" rows={1} style={{flex:1, resize:"none", border:"1px solid "+P.line, borderRadius:20, padding:"11px 15px", fontSize:14.5, fontFamily:"'Nunito',sans-serif", maxHeight:110, background:"#fff", color:P.ink, outline:"none"}}/>
          <button onClick={()=>sendChat()} disabled={chatLoading||!input.trim()} style={{width:46, height:46, borderRadius:"50%", border:"none", background: input.trim()?P.sage:P.line, color:"#fff", fontSize:19, cursor: input.trim()?"pointer":"default", flexShrink:0}}>➤</button>
        </div>
      </ChatShell>
    );
  }

  if (stage === "cargando") {
    return (
      <Shell>
        <div style={{textAlign:"center", padding:"60px 10px", color:P.muted}}>Cargando tu plan…</div>
      </Shell>
    );
  }

  if (stage === "no_disponible") {
    const waNum = "37281282920";
    const waMsg = encodeURIComponent("Hola, quería preguntar por el plan de mi hijo/a.");
    return (
      <Shell>
        <div style={{textAlign:"center", padding:"40px 20px"}}>
          <div style={{fontSize:44, marginBottom:14}}>🌱</div>
          <div style={{fontFamily:"'Fraunces',serif", fontSize:22, color:P.sageDeep, marginBottom:10}}>Todavía no está listo</div>
          <p style={{fontSize:14, color:P.muted, lineHeight:1.6, marginBottom:22}}>Este plan aún está en revisión, o el link no es válido. Si crees que es un error, escríbenos.</p>
          <a href={"https://wa.me/"+waNum+"?text="+waMsg} target="_blank" rel="noopener noreferrer" style={{display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8, background:P.sage, color:"#fff", fontWeight:800, fontSize:14.5, borderRadius:999, padding:"13px 24px", textDecoration:"none", boxShadow:"0 10px 24px rgba(90,122,92,.30)"}}>Escribirnos por WhatsApp</a>
        </div>
      </Shell>
    );
  }

  const habitos = (data.plan && data.plan.habitos) || [];

  return (
    <Shell>
      <div style={{display:"flex", flexDirection:"column", gap:6}}>
        <div style={{fontSize:11.5, fontWeight:800, letterSpacing:".09em", textTransform:"uppercase", color:P.sageDeep}}>Plan de bienestar</div>
        <h1 style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:"clamp(26px,7vw,32px)", lineHeight:1.1, margin:0, color:P.sageDeep}}>
          El plan de {data.nombreNino || "tu hijo/a"}
        </h1>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap"}}>
          <div style={{fontSize:13, color:P.muted}}>Revisado y aprobado por <b style={{color:P.ink}}>Peter Álvarez</b></div>
          <button onClick={() => descargarPdf(data.nombreNino, data.mensaje)} style={{display:"inline-flex", alignItems:"center", gap:6, background:"none", border:"1.5px solid "+P.line, borderRadius:999, padding:"7px 14px", fontSize:12.5, fontWeight:800, color:P.sageDeep, cursor:"pointer", fontFamily:"'Nunito',sans-serif"}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            Descargar PDF
          </button>
        </div>
      </div>

      {/* whiteSpace pre-wrap + renderRich (21 oct 2026): sin esto el padre veía
          el plan en un solo bloque corrido —el CSS colapsaba cada salto de
          línea, así que las viñetas por hora quedaban pegadas en un párrafo— y
          con los asteriscos de markdown crudos a la vista (**DIAGNÓSTICO
          BREVE** en vez de negrita). Encontrado abriendo un plan aprobado de
          verdad en el navegador, antes de mandarle el enlace a padres reales.
          renderRich ya existía y se usaba solo en las burbujas del chat. */}
      {data.mensaje && (
        <div style={{fontSize:14.5, lineHeight:1.6, background:P.panel, border:"1px solid "+P.line, borderRadius:18, padding:"16px 18px", whiteSpace:"pre-wrap"}}>
          {renderRich(data.mensaje)}
        </div>
      )}

      {retosFlag && (
        <div style={{display:"flex", flexDirection:"column", gap:12, background:P.panel, border:"1px solid "+P.line, borderRadius:18, padding:"16px 17px"}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:10}}>
            <div>
              <div style={{fontSize:14.5, fontWeight:800, color:P.ink}}>Retos de bienestar</div>
              <div style={{fontSize:12, color:P.muted, marginTop:2}}>Opcional · solo lo ves tú, no se comparte con el colegio</div>
            </div>
            <button onClick={toggleRetosOn} aria-checked={retosOn} style={{flexShrink:0, width:44, height:26, borderRadius:99, border:"1.5px solid "+(retosOn?P.sage:P.line), background: retosOn?P.sage:P.panelRaised, position:"relative", cursor:"pointer"}}>
              <span style={{position:"absolute", top:2, left: retosOn?20:2, width:19, height:19, borderRadius:"50%", background:"#fff", transition:"left .18s", boxShadow:"0 1px 2px rgba(40,42,36,.25)"}}/>
            </button>
          </div>

          {retosOn && (
            <div style={{display:"flex", flexDirection:"column", gap:10}}>
              {RETOS.map(r => {
                const actual = contarDias(retosLog, r.id, 0, 6);
                const anterior = contarDias(retosLog, r.id, 7, 13);
                const hoyHecho = !!((retosLog[r.id] || {})[todayKey()]);
                return (
                  <div key={r.id} style={{display:"flex", gap:12, alignItems:"flex-start", background: hoyHecho?P.sageSoft:P.panelRaised, border:"1px solid "+(hoyHecho?P.sage:P.line), borderRadius:14, padding:"12px 13px"}}>
                    <button onClick={() => toggleRetoHoy(r.id)} aria-checked={hoyHecho} style={{flexShrink:0, width:24, height:24, borderRadius:8, border:"1.5px solid "+(hoyHecho?P.sage:P.line), background: hoyHecho?P.sage:P.panelRaised, color: hoyHecho?"#fff":"transparent", cursor:"pointer", display:"grid", placeItems:"center", marginTop:1}}>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" width="13" height="13"><path d="M4 12l5 5L20 6"/></svg>
                    </button>
                    <div style={{flex:1, minWidth:0}}>
                      <p style={{fontSize:13.5, fontWeight:800, margin:"0 0 2px", color:P.ink}}>{r.titulo}</p>
                      <p style={{fontSize:12.5, lineHeight:1.5, color:P.muted, margin:"0 0 6px"}}>{r.texto}</p>
                      <p style={{fontSize:11.5, fontWeight:700, color:P.sageDeep, margin:0}}>Esta semana: {actual} de 7 · Semana pasada: {anterior} de 7</p>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      <button
        onClick={startChat}
        style={{display:"flex", alignItems:"center", justifyContent:"center", gap:8, background:P.sage, color:"#fff", fontWeight:800, fontSize:14.5, border:"none", borderRadius:999, padding:"14px 20px", cursor:"pointer", boxShadow:"0 10px 24px rgba(90,122,92,.30)"}}
      >
        Escribirle a Vita
      </button>

      <p style={{fontSize:11.5, textAlign:"center", color:P.muted, lineHeight:1.6}}>
        Esto acompaña y suma con su pediatra — no lo reemplaza.
      </p>
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
