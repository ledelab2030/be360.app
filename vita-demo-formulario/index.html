const BASE = `Eres Vita, acompañante de bienestar de be360.

# QUÉ HACES AQUÍ (y qué NO)
- SOLO capturas información sobre el hijo o hija de la persona con la que hablas, para el Formulario de Hábitos. NUNCA diagnosticas, NUNCA prescribes, NUNCA das ni sugieres una recomendación — ni una sola, ni de pasada, ni si te la piden directamente.
- Hablas SIEMPRE con el padre o la madre. El niño o adolescente nunca es tu interlocutor y nunca recibe indicaciones de ti.
- Rango de edad del hijo/a: 2 años en adelante, sin límite superior (decisión de Peter y Leonardo, 2 oct 2026 — un tope fijo excluía a estudiantes reales de colegio público en extraedad/CLEI, que en Colombia pueden seguir matriculados bien entrados los 20).
- Todo lo que captures lo revisa el equipo clínico antes de que a la familia le llegue cualquier cosa. Tú nunca eres la última palabra. Cuando le cuentes esto al padre/madre di siempre "el equipo" — nunca el nombre de Peter, salvo que te pregunten directamente quién está detrás (ver protocolo de seguridad).
- Si el padre menciona otro hijo/a (hermano/a) durante la conversación, NUNCA ofrezcas proactivamente "hacer el mismo recorrido" para ese otro niño/a — no sabes si ese hermano/a está habilitado para el programa, solo el equipo lo confirma. Si el padre PREGUNTA directamente si puede hacerlo también, respóndele con calidez que el equipo se lo confirma.

# TONO (de la guía de voz de Vita — seguirla al pie de la letra)
- Trato: tuteo, cercano.
- CERO emojis.
- 2 a 4 líneas por mensaje. Esto es un chat corto, no un informe.
- Una sola pregunta por mensaje.
- Sin listas ni viñetas dentro del chat.
- Sin juicio: nunca hagas sentir culpa al padre por nada de lo que cuente.
- Cierra cada intercambio con calidez, nunca evaluando lo que acaban de contarte.
- Nunca digas "sin medicamentos", "revertir", "curar" ni "epigenética". Nunca menciones IA, tecnología ni proveedores.

# CÓMO CAPTURAS (metodología del sprint — no aconsejar durante la captura)
Mientras recorres las áreas, SOLO escuchas y reconoces con calidez ("listo", "gracias, sigamos", "entiendo") — nunca corriges, nunca sugieres, nunca dices cosas como "eso no es lo ideal" o "deberías". Toda esa parte no existe en este chat: la hace el equipo después, aparte.

Recorre las áreas en este orden, 1-2 preguntas por mensaje, en tono de conversación (no interrogatorio):

0. CONTACTO: antes de empezar con el hijo/a, pregunta el nombre del padre/madre con quien hablas — en su propio mensaje, no junto con nada más: "Antes de empezar, ¿cómo te llamas?". Cuando responda, en tu siguiente mensaje agradécele por su nombre y, aparte, pregúntale a qué correo le pueden escribir con el plan cuando esté listo (cada pregunta una sola vez, no las repitas).
1. GENERAL: nombre del hijo/a, edad. Qué le gustaría lograr con el programa, y qué es lo que MÁS le preocupa hoy de su hijo/a (esto último es clave, pregúntalo con calma, dale espacio).
2. ORIGEN: parto natural o cesárea; cuánto tiempo de lactancia materna (o si no tomó).
3. SUEÑO Y MOVIMIENTO: a qué hora se duerme (cuando se apagan luces y pantallas) y a qué hora se levanta; cómo despierta (descansado / le cuesta / cansado); si se despierta en la noche; qué actividad física hace y cuántas veces por semana; si algo le duele al moverse. La hora de dormir es un dato duro (26 oct 2026, pedido de Peter) — si el padre responde algo vago ("temprano", "depende del día"), no sigas a la siguiente área todavía: pídele un aproximado concreto una vez más ("¿más o menos a las 8, a las 9?") antes de continuar.
4. SEÑALES: si nota alguna de estas señales con cierta frecuencia — menciona 4-5 a modo de ejemplo dentro de la pregunta, no la lista completa de golpe: dolor o ardor de estómago, dolores de cabeza frecuentes, inflamación o gases, estreñimiento, ansiedad, fatiga o cansancio, dificultad para concentrarse, sueño inquieto, piel irritada o brotes, infecciones frecuentes. Deja que el padre agregue lo que quiera.
5. DIAGNÓSTICOS Y ATENCIÓN MÉDICA: si el hijo/a tiene algún diagnóstico ya dado por un médico (asma, alergias, TDAH, etc. — da 2-3 ejemplos, no la lista completa); si toma alguna medicación o está en tratamiento; qué especialistas lo atienden. NO preguntes por citas próximas ni pidas autorización para coordinar con el médico — eso no aplica todavía.
6. EL DÍA EN ORDEN — es el corazón de la captura. Ya sabes a qué hora se despierta y a qué hora se duerme (lo preguntaste en el área 3) — NO lo vuelvas a preguntar aquí, solo reutilízalo. Reconstruye el resto del día de forma ESTRICTAMENTE CRONOLÓGICA, y para CADA momento (al levantarse, desayuno, media mañana/lonchera, almuerzo, media tarde, cena, antes de dormir) pide una hora aproximada — no la des por sentada ni la asumas: "¿como a qué hora desayuna?", "¿y la cena, más o menos a qué hora?". Esto no es opcional ni decorativo — el equipo clínico necesita las horas reales, sobre todo la de la cena, para poder trabajar con precisión. Si el padre no sabe la hora exacta de algún momento, está bien un aproximado ("como a las 7", "después del colegio") — lo que no debe pasar es que quede sin ninguna hora. La hora de la CENA en particular es un dato duro (26 oct 2026, pedido de Peter): si el padre no la da, insiste una vez más con una pregunta cerrada ("¿más o menos a las 6, a las 7?") antes de seguir con el resto del día — es el dato que más le importa al equipo clínico de todo lo que preguntas en esta área. En cada momento pregunta también qué come Y qué bebe — así la hidratación aparece sola en el relato, NUNCA preguntes directo "¿toma suficiente agua?". Pregunta también si varía el fin de semana.
   Para MEDIA MAÑANA/LONCHERA específicamente, pregunta además si lleva comida de casa o la compra en el colegio (cafetería/casino/tienda escolar) — esto es clínicamente relevante porque cambia qué tan controlable es por la familia: "¿la lonchera se la mandas de la casa, o la compra allá en el colegio?". Si compra en el colegio, pregunta qué suele comprar, aunque el padre no esté 100% seguro.
7. FIN DE SEMANA Y GUSTOS: qué suele comer los fines de semana (da 2-3 ejemplos: comida rápida, dulces, gaseosas); si algún alimento le cae mal o le produce gases; qué alimentos le gustan y valdría la pena conservar en su plan.
8. MENTE Y PANTALLAS: qué tipo de contenido consume (juegos, series, redes) y cuántas horas de pantalla al día; si usa pantallas la hora antes de dormir. Pregunta con suavidad si practica algo de relajación o respiración consciente — si el padre no entiende la pregunta o dice que no aplica, no insistas, anota "no aplica" y sigue.
9. EMOCIONES: qué emociones observa con alguna frecuencia en su hijo/a (da algunos ejemplos: alegría, ira o rabietas, ansiedad, frustración) — igual, si el padre prefiere describirlo como comportamiento ("se pone de mal genio") en vez de nombrar una emoción, está perfecto, anota eso.

# CIERRE (CAPTURE-ONLY)
Cuando ya cubriste las áreas, cierra con calidez: agradece, resume en 1-2 frases lo que entendiste del día de su hijo/a (sin evaluar, sin consejos), y explica que esa información queda registrada para que el equipo la revise y prepare el primer paso — que le van a escribir. NUNCA propongas ni insinúes una recomendación o próximo paso, en ningún momento. Invita a tocar el botón «Enviar a revisión» para mandar la información.

# PROTOCOLO DE SEGURIDAD (PRIORITARIO SOBRE TODO LO DEMÁS)
- Si el padre pregunta algo puntual tipo "¿debería quitarle el pan?" o "¿está bien que tome gaseosa?": responde con calidez que eso lo revisa el equipo junto con el resto de la información, y sigue con la siguiente pregunta del recorrido. NUNCA respondas la pregunta con un consejo, ni aquí ni en el cierre — tampoco si insisten pidiendo "algo general" en vez de algo específico: eso también es un consejo, no cede.
- Ante señales de posible trastorno de conducta alimentaria (bajo peso, restricción, atracones, miedo a engordar), salud mental (tristeza profunda, ansiedad intensa, mención de hacerse daño) o urgencia médica (dolor agudo, fiebre alta, pérdida de peso brusca): no sigas con el recorrido normal en esa área. Valida con calidez ("gracias por contarme, eso es importante"), dile que lo va a poner en manos del equipo con prioridad, y si suena a algo que no puede esperar dile con claridad que busque un médico o especialista de confianza hoy mismo. Anótalo en la señal correspondiente, y sigue con el resto del recorrido donde sí sea seguro. NO OLVIDES el paso siguiente: esto SIEMPRE requiere el marcador de escalamiento — es tan obligatorio como el bloque <dx>, nunca lo omitas por estar concentrada en responder con calidez. Ver el formato exacto en "MARCADOR DE ESCALAMIENTO" más abajo.
- Si preguntan quién está detrás: "be360 lo lidera Peter Álvarez, con un equipo de bienestar." Nada de tecnología ni proveedores. Si preguntan directo si eres una persona real, una IA o un robot: sé honesta, nunca lo niegues ni lo evadas — dile que eres una acompañante virtual, no una persona, sin usar las palabras "inteligencia artificial" ni "tecnología".
- Si el peso surge en la conversación, nunca lo trates como un objetivo a bajar ni hables de "dieta" o imagen corporal — solo anótalo como dato si el padre lo menciona espontáneamente.

# MARCADOR DE ESCALAMIENTO (aparte del bloque <dx> de abajo)
Cuando actives el protocolo de seguridad de arriba por un riesgo real (no por una simple pregunta de "¿le doy X?"), agrega TAMBIÉN, en su propia línea, uno de estos marcadores invisibles — nunca lo menciones ni lo expliques al padre, es solo para el sistema:
<escalar>riesgo_alimentario</escalar> — posible trastorno de conducta alimentaria
<escalar>riesgo_salud_mental</escalar> — señales de salud mental grave
<escalar>urgencia_medica</escalar> — urgencia médica aguda
Para todo lo demás (incluida una pregunta puntual sobre qué darle de comer), NO agregues ningún marcador de escalamiento — eso no es una señal de riesgo, es solo un padre preguntando.

# CAMBIO DE MODO (formulario directo)
Además de este chat, existe un formulario directo (no conversacional) con los mismos campos, para el padre que prefiera llenarlo él mismo en vez de conversar. Si el padre te pide explícitamente cambiar a eso — frases como "prefiero el formulario", "mejor lo lleno directo", "pásamelo directo", "quiero terminarlo yo", "esto es muy largo, dame el formulario" — NUNCA sigas preguntando como si no hubieras entendido. Responde en 1 línea confirmando cálidamente el cambio (algo como "Claro, ahí tienes lo que ya sabemos, completa el resto cuando quieras") y agrega, en su propia línea, el marcador invisible: <cambiar_modo>formulario</cambiar_modo>
No agregues este marcador en ningún otro caso — solo cuando el padre pida el cambio explícitamente.

# FORMATO DE SALIDA (CRÍTICO)
Responde SIEMPRE en dos, tres o cuatro partes:
1. Tu mensaje conversacional normal (según las reglas de tono de arriba).
2. Al final, en una línea aparte, un bloque oculto con lo capturado hasta ahora, exactamente así:
<dx>{"nombre_padre":"","email_padre":"","nombre_nino":"","edad":"","que_deseas_lograr":"","preocupacion_principal":"","origen":"","sueno_y_movimiento":"","senales_observables":"","diagnosticos_y_atencion_medica":"","cronologia_del_dia":"","finde_y_gustos":"","mente_y_pantallas":"","emociones":""}</dx>
Rellena solo lo que ya sepas; deja "" lo que falte. "email_padre" es el correo tal cual lo dieron — no lo inventes ni lo completes, anota lo que haya aunque parezca incompleto. "cronologia_del_dia" incluye TODA la cronología con horas + qué come/bebe en cada momento + hidratación, como un relato corrido. Valores breves, frases cortas. El bloque <dx> NUNCA se muestra, es solo para el sistema — no lo menciones ni lo describas.
3. SOLO si activaste el protocolo de seguridad, el marcador <escalar>...</escalar> de arriba, en su propia línea, después del bloque <dx>.
4. SOLO si el padre pidió cambiar al formulario directo, el marcador <cambiar_modo>formulario</cambiar_modo> de arriba, en su propia línea.`;

// Red de respaldo del escalamiento: en pruebas, el modelo a veces responde
// bien EN EL TEXTO (valida, dice que avisa al equipo con prioridad) pero se
// le olvida agregar el marcador <escalar> — un problema conocido de pedirle
// a un LLM que recuerde un formato técnico condicional en medio de una
// respuesta cargada emocionalmente. Esto escanea lo que escribe el padre
// directamente, SIN depender de que el modelo lo marque, para las señales
// más claras e inequívocas (no cubre todo — las señales más sutiles siguen
// dependiendo del criterio del modelo, ver PROTOCOLO DE SEGURIDAD arriba).
const RIESGO_PATTERNS = [
  { motivo:"riesgo_salud_mental", re:/suicid|quitarse la vida|matarse|no quiere vivir|autolesi[oó]n|hacerse da[ñn]o|cortarse/i },
  { motivo:"urgencia_medica", re:/convuls|no respira|inconsciente|desmay|sangrado (abundante|mucho)|fiebre muy alta|dolor (muy fuerte|insoportable)/i },
  { motivo:"riesgo_alimentario", re:/miedo a engordar|se (provoca|induce) (el )?v[oó]mito|se purga|esconde (la )?comida|comida escondida|dej[oó] de comer (casi )?(por completo|del todo)/i },
];
const detectarRiesgoTextual=(text)=>{
  if(!text) return null;
  for(const p of RIESGO_PATTERNS){ if(p.re.test(text)) return p.motivo; }
  return null;
};

// Cobertura de las 24h del día (10 ago 2026) — hallazgo de Leonardo: el campo
// cronologia_del_dia es un solo texto libre, así que un padre puede dejarlo
// con huecos sin darse cuenta — y eso es justo lo que puede generar rechazo
// de Peter al revisar. La solución NO reestructura el campo en 7 sub-campos
// (sería más engorroso de llenar); en su lugar, detecta por palabras clave
// si el relato menciona los 7 momentos clave del día, y si falta alguno,
// sendToReview() se detiene y el panel de revisión final (PanelRevisionFinal,
// más abajo) lo muestra junto con el correo — el padre elige completar o
// confirmar explícitamente que no sabe / no quiere compartir esos momentos
// todavía. Si confirma, el hueco queda ANOTADO en el
// mismo texto que ve Peter (nunca queda como un silencio ambiguo). Funciona
// igual para el modo chat (el modelo arma el texto) y el modo formulario (el
// padre lo escribe directo) — es el mismo campo, la misma verificación.
const PERIODOS_DIA = [
  // FIX (3 nov 2026, caso real de Valeria): "despertar" diptonga a
  // "despierta/despiertas/despierto" en presente (e→ie) — "despert" como
  // subcadena nunca calza con la forma conjugada que casi siempre usa el
  // relato ("se despierta a las..."), solo con el infinitivo o el gerundio
  // ("despertando"). Se agrega el radical diptongado.
  { label:"Al levantarse", re:/levant|despert|despiert/i },
  { label:"Desayuno", re:/desayun/i },
  // FIX (3 nov 2026, mismo día que el de abajo): un caso real decía "en el
  // descanso compra en la cafetería escolar..." — "descanso" es como
  // muchos colegios colombianos llaman al recreo de media mañana, y no
  // calzaba con ninguna de las palabras clave anteriores.
  { label:"Media mañana", re:/media ma[ñn]ana|lonchera|refrigerio|\bdescanso\b/i },
  { label:"Almuerzo", re:/almuerz/i },
  // FIX (3 nov 2026, encontrado probando con casos sintéticos): las frases
  // más naturales en español no calzaban con los patrones originales —
  // "media tarde" no cubría "en la tarde" ni "merienda" sueltos, y "antes de
  // (dormir|acostarse|la cama)" exigía la palabra pegada justo después de
  // "antes de", así que "antes de IRSE A dormir" o "antes de QUE SE acueste"
  // (conjugación con diptongo, "acostarse" no aparece como subcadena de
  // "acueste") contaban como "no mencionado" aunque el padre sí hubiera dado
  // la hora. Media tarde ahora acepta cualquier mención de "tarde" (no hay
  // otro período que use esa palabra, así que no choca con desayuno/almuerzo/
  // cena). Antes de dormir ahora tolera hasta 20 caracteres entre "antes de"
  // y el verbo, y cubre también la conjugación "acuest-".
  { label:"Media tarde", re:/\btarde\b|\bonces\b|\bmerienda\b/i },
  { label:"Cena", re:/\bcena\b|comida de la noche/i },
  // FIX (3 nov 2026, segunda vuelta sobre este mismo período — caso real de
  // Valeria): el relato ni siquiera usaba "antes de" — decía directo "9:00
  // PM se acuesta, concilia sueño hacia las 10:00 PM", así que exigir ese
  // prefijo literal seguía dejando afuera la forma más natural de contarlo.
  // Ahora "acostarse"/"la cama" cuentan solos, igual que los demás períodos
  // (palabra clave + hora cerca, sin exigir una frase completa alrededor).
  // Deliberadamente NO se agrega "dormir"/"duerme" sueltos: en niños
  // pequeños una siesta de mediodía ("duerme siesta de 1 a 3pm") no es el
  // momento de "antes de dormir" nocturno, y marcarla como cubierta sería un
  // falso positivo real, no solo teórico.
  { label:"Antes de dormir", re:/acostar\w*|acuest\w*|\bla cama\b|antes de[^.\n]{0,20}dormir\w*/i },
];

// NUEVO (8 sep 2026, pedido explícito de Peter en la reunión del 19 ago):
// "asegurar que se capturen todas las horas del día" — antes coberturaDia
// solo detectaba si el padre MENCIONABA el momento ("desayuno"), no si daba
// una hora real. Un padre podía escribir "desayuno cereal" sin decir a qué
// hora, y eso pasaba como "cubierto" — exactamente lo que Peter dice que le
// llega genérico y sin lo que necesita para alinear con la metodología SRB
// (el horario de la cena, en particular, es un dato duro: "detener la
// ingesta antes de las 6pm" solo se puede verificar si hay una hora real).
// Sigue sin partir el campo en 7 sub-campos rígidos (se evaluó antes y se
// descartó por más engorroso de llenar) — en su lugar, exige que exista un
// patrón de hora (12h, 24h, o "las X" en palabras) DENTRO de una ventana de
// texto alrededor de cada mención, no en cualquier parte del relato.
// FIX (26 oct 2026, encontrado probando el candado nuevo de hora de dormir/cena
// — ver faltanDatosDuros() más abajo): el patrón original exigía un dígito de
// minutos para reconocer una hora ("[0-5]\d?" no era opcional), así que una
// hora tan común como "9pm" o "a las 7pm" (sin espacio ni minutos) NUNCA
// calzaba — ni con meridiano pegado ni sin él. Mientras el chequeo era solo
// informativo (con botón de "enviar así") esto pasaba casi desapercibido; con
// el candado nuevo, que si bloquea el envío, un padre que SÍ dio la hora
// podía quedar atascado sin poder enviar. Ahora son tres alternativas: (1)
// hora + minutos opcionales + meridiano obligatorio — cubre "9pm", "9 pm",
// "9:00pm"; (2) hora:minutos con separador, sin meridiano — cubre "21:00",
// "6:45"; (3) "a la/a las" + número en palabra o dígito — igual que antes.
const TIME_PATTERN = /\b([01]?\d|2[0-3])(?:[:.,][0-5]\d)?\s*(?:am|pm|a\.?\s?m\.?|p\.?\s?m\.?)\b|\b([01]?\d|2[0-3])[:.,][0-5]\d\b|\b(?:a la|a las)\s+(?:una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|\d{1,2})\b/i;
const VENTANA_HORA = 45; // caracteres a cada lado de la mención — cubre "desayuno a las 7" y "a las 7 desayuna", no cualquier hora del relato
function tieneHoraCerca(texto, indexMatch){
  const inicio=Math.max(0,indexMatch-VENTANA_HORA);
  const fin=Math.min(texto.length,indexMatch+VENTANA_HORA);
  return TIME_PATTERN.test(texto.slice(inicio,fin));
}

// RESPALDO POR RANGO DE HORA (3 nov 2026, pedido explícito de Leonardo): cada
// palabra clave nueva que se agregaba arriba resolvía un caso real y abría la
// puerta al siguiente — "descanso", "la cama", "en la tarde"... No escala: el
// vocabulario cambia de familia a familia y, más adelante, de país a país.
// Caso que lo disparó (Martina): la cena nunca se nombró, el relato solo
// decía "6:45 PM: sopa de lentejas, arepita, agua" — ninguna palabra clave
// podía calzar porque no había ninguna que buscar.
// La idea: cuando NINGUNA palabra clave calza, en vez de dar el período por
// no mencionado, se revisa si el relato tiene AL MENOS una hora real dentro
// del rango típico de ese momento — si la tiene, se da por cubierto igual.
// La palabra clave sigue mandando cuando existe (es más precisa: ancla el
// momento exacto, no solo un rango) — esto es solo el plan B, nunca la
// reemplaza. Los rangos se solapan a propósito entre períodos vecinos (ej.
// una cena a las 9:45pm también cae en el rango de "antes de dormir") — no
// hace falta una asignación exclusiva, alcanza con que cada momento tenga
// ALGÚN dato cerca.
// "Cena" no tiene tope superior (pedido explícito de Leonardo: "cena es
// cualquier comida entre las 6 y el resto del día" — familias que cenan
// tarde no deberían quedar mal cubiertas por un límite arbitrario).
const RANGO_HORAS = {
  "Al levantarse": [4*60, 10*60],
  "Desayuno": [5*60, 10*60+30],
  "Media mañana": [8*60, 11*60+30],
  "Almuerzo": [11*60, 15*60+30],
  "Media tarde": [14*60+30, 18*60+30],
  "Cena": [18*60, 23*60+59],
  "Antes de dormir": [19*60, 23*60+59],
};
// Hora SUGERIDA para mostrarle al padre y que la confirme (3 nov 2026,
// pedido explícito de Leonardo: caso real de Josef, "media mañana" y
// "almuerzo" sí aparecían mencionados en la cronología pero sin hora
// exacta — en vez de dejarlo como un hueco genérico, "debería asumirse
// 9-10am y 3-4pm, y pedir confirmación al padre antes de enviar"). Es
// DISTINTA de RANGO_HORAS: esa es deliberadamente ancha (es el respaldo de
// coberturaDia(), sirve para no perder un dato real que esté en otra
// parte del rango); esta es angosta, pensada para mostrarse como pregunta
// de sí/no ("¿fue como a las 9-10am?"), solo para los momentos donde
// SÍ hay palabra clave pero no una hora pegada (motivo "sin_hora" — nunca
// se ofrece para "no_mencionado", ahí no hay nada que confirmar). No
// incluye "Al levantarse" porque casi nunca llega a "sin_hora": suele ser
// la hora ancla de la que parte el resto del relato.
const HORA_SUGERIDA = {
  "Desayuno": "7:00–8:00 am",
  "Media mañana": "9:00–10:00 am",
  "Almuerzo": "12:00–1:00 pm",
  "Media tarde": "3:00–4:00 pm",
  "Cena": "6:00–7:00 pm",
  "Antes de dormir": "8:00–9:00 pm",
};
// Convierte UN fragmento de texto que ya se sabe que contiene una hora (ej.
// "6:45 PM", "21:00") a minutos desde medianoche. Deliberadamente NO
// resuelve "a las 7" en palabras sin meridiano (alternativa 3 de
// TIME_PATTERN) — sin am/pm es ambiguo (¿7am o 7pm?), y esa forma es rara en
// estos relatos; se prefiere no adivinar a asignar mal un período.
function horaAMinutos(fragmento){
  let m = fragmento.match(/\b([01]?\d|2[0-3])(?:[:.,]([0-5]\d))?\s*(am|pm|a\.?\s?m\.?|p\.?\s?m\.?)\b/i);
  if (m) {
    let h = parseInt(m[1],10);
    const min = m[2] ? parseInt(m[2],10) : 0;
    const esPM = /p/i.test(m[3]);
    if (h === 12) h = esPM ? 12 : 0; else if (esPM) h += 12;
    return h*60+min;
  }
  m = fragmento.match(/\b([01]?\d|2[0-3])[:.,]([0-5]\d)\b/);
  if (m) return parseInt(m[1],10)*60+parseInt(m[2],10);
  return null;
}
// Todas las horas reales del relato (con meridiano o HH:MM), convertidas a
// minutos desde medianoche, para comparar contra RANGO_HORAS.
function extraerHorasDelTexto(texto){
  const re = /\b([01]?\d|2[0-3])(?:[:.,][0-5]\d)?\s*(?:am|pm|a\.?\s?m\.?|p\.?\s?m\.?)\b|\b([01]?\d|2[0-3])[:.,][0-5]\d\b/gi;
  const out = [];
  let m;
  while ((m = re.exec(texto)) !== null) {
    const min = horaAMinutos(m[0]);
    if (min !== null) out.push({ index: m.index, minutos: min });
  }
  return out;
}
const coberturaDia=(texto)=>{
  const t=texto||"";
  const faltantes=[];
  let cubiertos=0;
  const horasDelDia = extraerHorasDelTexto(t);
  for(const p of PERIODOS_DIA){
    // FIX (2 oct 2026, encontrado en vivo con Peter — caso Samuel): t.match(p.re) sin bandera
    // global solo devuelve la PRIMERA mención de la palabra clave. Un padre real mencionó
    // "almuerza" dos veces en el mismo relato (una genérica, otra con la hora real pegada) y el
    // chequeo solo miraba la primera, así que marcaba "sin hora" aunque la hora sí estuviera un
    // poco más abajo en el mismo texto. Ahora revisa TODAS las menciones — alcanza con que UNA
    // tenga una hora cerca.
    const reGlobal=new RegExp(p.re.source, p.re.flags.includes("g")?p.re.flags:p.re.flags+"g");
    const matches=[...t.matchAll(reGlobal)];
    if(matches.length && matches.some(m=>tieneHoraCerca(t, m.index))){ cubiertos++; continue; }
    // Plan B: ninguna palabra clave calzó con una hora cerca — ¿hay alguna
    // hora real del relato dentro del rango típico de este momento?
    const rango = RANGO_HORAS[p.label];
    if (rango && horasDelDia.some(h => h.minutos >= rango[0] && h.minutos <= rango[1])) { cubiertos++; continue; }
    faltantes.push({label:p.label, motivo: matches.length ? "sin_hora" : "no_mencionado"});
  }
  return { cubiertos, total:PERIODOS_DIA.length, faltantes };
};

// NUEVO (26 oct 2026, pedido explícito de Leonardo en reunión con Peter — minuta
// "Horario de Cena y Sueño"): la hora de dormir es, junto con la de la cena, el
// dato que hace falta para poder exigir la regla dura nueva de mínimo 3 horas
// entre la última comida y la hora de dormir (ver ADAPTACIONES_PEDIATRICAS en
// worker/vita-proxy.js). Hasta hoy, "sueno_y_movimiento" (área 3 del chat,
// donde se pregunta la hora de dormir) era un campo OPCIONAL entre otros 9, sin
// chequeo de que tuviera una hora real — un padre podía terminar y enviar sin
// que esa hora quedara nunca registrada. A diferencia de coberturaDia() (que
// es informativa, con un botón para enviar igual si falta algo), ESTO bloquea
// el envío de verdad: no hay botón de "enviar así" para la hora de dormir ni
// para la cena — ver faltanDatosDuros()/puedeEnviar() más abajo. Es la forma
// de mantener la experiencia conversacional sin convertirla en un cuestionario
// rígido: el chat sigue fluyendo libre, solo que no se puede cerrar el caso
// sin estos dos datos puntuales.
// FIX (3 nov 2026, caso real de Joaquín): "Va a la cama a las 8:00 PM" no
// calzaba con ninguna de las tres palabras — "la cama" como sustantivo es
// tan común como los verbos, y "acostar" (infinitivo/otras conjugaciones
// distintas de "acuesta") tampoco estaba cubierto. Mismas dos palabras que
// ya se agregaron a PERIODOS_DIA ("Antes de dormir") más abajo.
const RE_HORA_DORMIR = /duerme|acuesta|dormir|acostar|\bla cama\b/i;
const tieneHoraDormirReal = (texto) => {
  const t = texto || "";
  const reGlobal = new RegExp(RE_HORA_DORMIR.source, "gi");
  const matches = [...t.matchAll(reGlobal)];
  if (!matches.length) return false;
  return matches.some(m => tieneHoraCerca(t, m.index));
};
// Los dos únicos datos de hora que SÍ bloquean el envío (todo lo demás en
// PERIODOS_DIA sigue siendo informativo/bypasseable, igual que antes). "Cena"
// se reutiliza de coberturaDia(); "hora de dormir" vive en un campo separado
// (sueno_y_movimiento, área 3 del chat), no en cronologia_del_dia.
const faltanDatosDuros = (dx) => {
  const cenaFalta = coberturaDia(dx.cronologia_del_dia).faltantes.some(f => f.label === "Cena");
  const dormirFalta = !tieneHoraDormirReal(dx.sueno_y_movimiento);
  const labels = [];
  if (cenaFalta) labels.push("la hora de la cena");
  if (dormirFalta) labels.push("la hora en que se duerme");
  return { cenaFalta, dormirFalta, labels };
};

// "19:30" (valor nativo de <input type="time">) -> "7:30 PM" — se prefiere
// sobre dejar el 24h crudo porque toda la historia de ajustes de
// coberturaDia()/RE_HORA_DORMIR de arriba se probó contra relatos reales en
// formato con meridiano ("9pm", "a las 7"), no HH:MM de 24h.
function horaLegible(hhmm){
  if(!hhmm) return "";
  const [hStr,mStr] = hhmm.split(":");
  let h = parseInt(hStr,10);
  const esPM = h>=12;
  let h12 = h%12; if(h12===0) h12=12;
  return h12+":"+mStr+" "+(esPM?"PM":"AM");
}

function compilarOrigen(e){

  else if(e.origenLactancia==="menos_6") partes.push("Lactancia materna menos de 6 meses.");
  else if(e.origenLactancia==="6_a_12") partes.push("Lactancia materna entre 6 y 12 meses.");
  else if(e.origenLactancia==="mas_12") partes.push("Lactancia materna más de 12 meses.");

}

// Despertar/almuerzo/cena compilan a cronologia_del_dia — igual que
// coberturaDia() ya espera (ver PERIODOS_DIA arriba). La hora de dormir NO
// va acá: faltanDatosDuros() la busca en sueno_y_movimiento, un campo
// distinto — por eso vive en compilarDormir(), más abajo, separado.
// Compila un bloque de contenido de comida (grupos de chips + Otro +
// cantidad) a UNA frase — mismo texto narrativo que un padre habría escrito
// a mano, mismo contrato que el resto de compilarCronologia (10 nov 2026).
function compilarContenidoComida(e, etiqueta, grupos, claveOtro, claveCantidad, claveCantidadOtro){
  const items=[];
  grupos.forEach(g=>{
    const sel=(e[g.clave]||[]).filter(x=>x!=="Ninguna"&&x!=="Ninguno");
    if(sel.length) items.push(sel.join(", "));
  });
  if(e[claveOtro] && e[claveOtro].trim()) items.push(e[claveOtro].trim());
  if(!items.length) return "";
  let frase = etiqueta+": "+items.join("; ")+".";
  const cantidadLabel = { poca:"poca cantidad", normal:"una porción normal", bastante:"bastante cantidad" }[e[claveCantidad]];
  if(e[claveCantidadOtro] && e[claveCantidadOtro].trim()) frase += " Cantidad: "+e[claveCantidadOtro].trim()+".";
  else if(cantidadLabel) frase += " Cantidad: "+cantidadLabel+".";
  return frase;
}
function compilarCronologia(e){
  const partes=[];
  if(e.cronoDespierta) partes.push("Se levanta a las "+horaLegible(e.cronoDespierta)+".");
  // "Desayuna..." (7 nov 2026, auditoría de Gemini sobre el caso de Samuel):
  // antes faltaba un selector para esta hora, así que la ventana ACTUAL
  // siempre quedaba "no calculable" cuando el padre no la mencionaba en el
  // matiz libre. PERIODOS_DIA busca /desayun/i — "Desayuna" calza directo.
  // OJO: esta frase de la HORA tiene que quedar siempre, aparte del
  // contenido de abajo — coberturaDia() depende de encontrarla.
  if(e.cronoDesayuna) partes.push("Desayuna a las "+horaLegible(e.cronoDesayuna)+".");
  const contDesayuno = compilarContenidoComida(e,"Desayuno",GRUPOS_DESAYUNO,"cronoDesayunoOtro","cronoDesayunoCantidad","cronoDesayunoCantidadOtro");
  if(contDesayuno) partes.push(contDesayuno);
  if(e.cronoAlmuerza) partes.push("Almuerza a las "+horaLegible(e.cronoAlmuerza)+".");
  const contAlmuerzo = compilarContenidoComida(e,"Almuerzo",GRUPOS_ALMUERZO,"cronoAlmuerzoOtro","cronoAlmuerzoCantidad","cronoAlmuerzoCantidadOtro");
  if(contAlmuerzo) partes.push(contAlmuerzo);
  // "La cena termina..." a propósito, no "Termina de cenar...": PERIODOS_DIA
  // busca \bcena\b como palabra completa — "cenar" no calza (el límite de
  // palabra cae en medio, entre la "a" y la "r").
  if(e.cronoCena) partes.push("La cena termina a las "+horaLegible(e.cronoCena)+".");
  const contCena = compilarContenidoComida(e,"Cena",GRUPOS_CENA,"cronoCenaOtro","cronoCenaCantidad","cronoCenaCantidadOtro");
  if(contCena) partes.push(contCena);
  if(e.cronoFinde==="igual") partes.push("El fin de semana cena y duerme a la misma hora.");
  else if(e.cronoFinde==="varia_1_2") partes.push("El fin de semana varía 1 a 2 horas.");
  else if(e.cronoFinde==="muy_irregular") partes.push("El fin de semana es muy irregular.");
  if(e.cronoLonchera==="casa") partes.push("La lonchera es de casa.");
  else if(e.cronoLonchera==="colegio") partes.push("La lonchera la compra en el colegio.");
  else if(e.cronoLonchera==="mixto") partes.push("La lonchera es mixta, a veces de casa y a veces del colegio.");
  if(e.cronoLoncheraCasaChips && e.cronoLoncheraCasaChips.length) partes.push("De casa suele llevar: "+e.cronoLoncheraCasaChips.join(", ")+".");
  if(e.cronoLoncheraCafeteriaChips && e.cronoLoncheraCafeteriaChips.length) partes.push("De la cafetería del colegio suele comprar, o le gusta: "+e.cronoLoncheraCafeteriaChips.join(", ")+".");
  if(e.cronoLoncheraDetalle && e.cronoLoncheraDetalle.trim()) partes.push("Sobre la lonchera, además: "+e.cronoLoncheraDetalle.trim()+".");
  // Entrenamiento/deporte estructurado (7 nov 2026, auditoría de Gemini
  // sobre el caso de Samuel): antes esto solo existía si el padre lo
  // mencionaba en el matiz libre — el prompt ya tiene la regla nueva de
  // "nunca cena completa justo antes de entrenar" (ver ADAPTACIONES_PEDIATRICAS,
  // cambio v4.26), pero esa regla solo puede aplicarse si el horario llega
  // claro en la cronología.
  if(e.cronoEntrenaSiNo==="si" && e.cronoEntrenaDias && e.cronoEntrenaDias.length){
    const deporte = (e.cronoEntrenaDeporte&&e.cronoEntrenaDeporte.trim()) ? e.cronoEntrenaDeporte.trim() : "deporte";
    const dias = e.cronoEntrenaDias.join(" y ");
    const horario = (e.cronoEntrenaInicio && e.cronoEntrenaFin) ? (" de "+horaLegible(e.cronoEntrenaInicio)+" a "+horaLegible(e.cronoEntrenaFin)) : "";
    partes.push("Entrena "+deporte+" los "+dias+horario+".");
    // Hidratación durante el deporte (10 nov 2026, sesión de revisión de
    // casos reales con Peter): antes no se preguntaba, y el prompt ya tiene
    // la regla de reemplazar bebidas energizantes/deportivas comerciales por
    // suero casero (ver ADAPTACIONES_PEDIATRICAS) — pero esa regla solo
    // puede aplicarse de forma anclada si el formulario dice qué toma hoy.
    if(e.cronoEntrenaHidratacion==="suero") partes.push("Durante el entrenamiento toma suero casero.");
    else if(e.cronoEntrenaHidratacion==="agua") partes.push("Durante el entrenamiento toma agua sola.");
    else if(e.cronoEntrenaHidratacion==="deportiva") partes.push("Durante el entrenamiento toma bebidas deportivas comerciales (tipo Gatorade o Powerade).");
    else if(e.cronoEntrenaHidratacion==="energizante") partes.push("Durante el entrenamiento toma bebidas energizantes (tipo Red Bull o Monster).");
  }
  if(e.cronoMatiz && e.cronoMatiz.trim()) partes.push(e.cronoMatiz.trim());
  return partes.join(" ");
}
// Compila a sueno_y_movimiento (prefijo) — RE_HORA_DORMIR busca
// duerme/acuesta/dormir/acostar/"la cama" con una hora cerca; "acuesta"
// calza directo y la hora queda pegada.
function compilarDormir(e){
  if(!e.cronoDuerme) return "";
  return "Se acuesta a las "+horaLegible(e.cronoDuerme)+".";
}
// sueno_y_movimiento = la hora compilada + lo que el padre agregue a mano
// sobre cómo despierta, actividad física, dolor al moverse — nunca se
// pierde lo uno por lo otro.
function compilarSuenoYMovimiento(e){
  return [compilarDormir(e), (e.suenoManual||"").trim()].filter(Boolean).join(" ");
}

// opera sobre cualquier clave array de `e`, para no repetir el patrón de
// toggle (ya usado arriba para senalesChips/cronoEntrenaDias) una vez por
// cada grupo de contenido de comida.
const GrupoChipsMulti=({e,set,clave,titulo,opciones,P})=>{
  const toggle=(item)=>{
    const actual=e[clave]||[];
    const tiene=actual.includes(item);
    set({...e,[clave]: tiene?actual.filter(x=>x!==item):[...actual,item]});
  };
  return (
    <div>
      <div style={{fontSize:11,color:P.muted,marginBottom:4,fontWeight:700}}>{titulo}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

          <button key={o} type="button" onClick={()=>toggle(o)} style={chipBtnStyle((e[clave]||[]).includes(o),P)}>{o}</button>
        ))}
      </div>
    </div>
  );
};

  const partes=[];
  if(e.metasChips && e.metasChips.length) partes.push("Quiere lograr: "+e.metasChips.join(", ")+".");
  if(e.metasOtra && e.metasOtra.trim()) partes.push(e.metasOtra.trim());

}

  const partes=[];

  if(e.findeComidas && e.findeComidas.length) partes.push("Los fines de semana suele comer: "+e.findeComidas.join(", ")+".");

// Renderiza **negrita** como <strong>; conserva saltos de línea via white-space:pre-wrap.
const renderRich = (text) => (text||"").split(/(\*\*[^*]+\*\*)/g).map((part,i)=>
  part.startsWith("**")&&part.endsWith("**")
    ? <strong key={i} style={{fontWeight:800}}>{part.slice(2,-2)}</strong>

);

// Regex simple de formato de correo — no detecta typos de contenido (ej.
// "leonardodelahozb@gmail.com" en vez de la cuenta real), solo formato
// obviamente roto. El resto de la protección contra typos es mostrar el
// correo bien grande y editable antes de enviar, ver PanelRevisionFinal.
const formatoEmailValido=(email)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||"").trim());

// Panel de revisión final antes de enviar (10 ago 2026) — se usa tanto en
// modo formulario como en modo chat, por eso vive a nivel de módulo (mismo
// motivo que Shell). SIEMPRE se muestra antes de enviar de verdad (no solo
// si algo falta): el correo es el ÚNICO canal de entrega desde que se
// quitó WhatsApp — un typo silencioso significa que la familia nunca
// recibe su plan y nadie se entera. Por eso el correo queda editable acá
// mismo, grande y visible, en vez de enterrado en un campo más del
// formulario. Si además faltan momentos del día, se explica la
// consecuencia real (plan más general, sin culpar) y se puede continuar

// GUARDADO EN EL DISPOSITIVO (21 oct 2026, pedido de Leonardo) — el recorrido
// toma unos 20 minutos en el celular y hasta hoy no guardaba NADA: si el padre
// recargaba, cambiaba de app o el navegador descartaba la pestaña (cosa muy
// común en móvil), perdía todo y tenía que empezar de cero. Se guarda en el
// navegador del propio padre, nunca viaja a ningún lado, y se borra apenas el
// envío sale bien. Todo entre try/catch porque en navegación privada o con las
// cookies bloqueadas, localStorage lanza excepción al tocarlo.
//
// La clave es distinta en cada una de las dos páginas: ambas viven en
// be360.app y comparten localStorage, así que con una sola clave el borrador
// empezado en una reaparecería dentro de la otra.
const GUARDADO_KEY="vita_formulario_borrador";
const leerGuardado=()=>{ try{ const s=localStorage.getItem(GUARDADO_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } };
const borrarGuardado=()=>{ try{ localStorage.removeItem(GUARDADO_KEY); }catch(e){} };

function App(){
  const [stage,setStage]=useState(()=>{ const g=leerGuardado(); return (g&&g.stage)?g.stage:"welcome"; });
  const [messages,setMessages]=useState(()=>{ const g=leerGuardado(); return (g&&g.messages)?g.messages:[]; });
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [dx,setDx]=useState(()=>{ const g=leerGuardado(); return (g&&g.dx)?g.dx:emptyDx; });
  const [dxAlPausar,setDxAlPausar]=useState(null); // snapshot de dx al salir del chat, para detectar si el formulario cambió algo mientras tanto
  const [estructurado,setEstructurado]=useState(()=>({...emptyEstructurado, ...leerEstructurado()})); // chips/selectores de origen, señales y cronología — ver bloque arriba
  const [consentChecked,setConsentChecked]=useState(false); // checkbox de la pantalla de consentimiento
  const [consentInvestigacionChecked,setConsentInvestigacionChecked]=useState(false); // casilla SEPARADA y opcional (19 ago 2026) — investigación/mejora de otros planes, nunca condiciona el servicio
  // (pendingStage se quitó el 6 nov 2026 al fusionar consentimiento+intro — ver abajo)
  const [showDx,setShowDx]=useState(false);
  const [error,setError]=useState(null);
  const [exported,setExported]=useState(false);
  const [chatCopied,setChatCopied]=useState(false);
  const [sending,setSending]=useState(false);
  const [sendError,setSendError]=useState(null);
  const [mostrarRevisionFinal,setMostrarRevisionFinal]=useState(false); // panel de revisión (correo + cobertura del día) antes de enviar de verdad
  const [horasConfirmadas,setHorasConfirmadas]=useState({}); // 3 nov 2026: qué horas sugeridas confirmó el padre en PanelRevisionFinal
  // Formulario directo: una pantalla por sección en vez de un solo scroll
  // largo (12 nov 2026, pedido de Leonardo/Peter — mismo patrón que apps
  // como BEND). Índice sobre CAMPOS_VISIBLES (FIELDS sin "edad", que se
  // dibuja junto a nombre_nino en su misma pantalla, no por separado).
  const [pasoForm,setPasoForm]=useState(()=>{ const g=leerGuardado(); return (g&&typeof g.pasoForm==="number")?g.pasoForm:0; });
  const scrollRef=useRef(null);
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages,loading]);

  // Guarda el avance apenas cambia algo. No guarda en "welcome" (no hay nada
  // que guardar) ni en "sent" (ya se envió y el guardado se borra ahí mismo).
  useEffect(()=>{
    if(stage==="welcome"||stage==="sent") return;
    try{ localStorage.setItem(GUARDADO_KEY, JSON.stringify({stage,messages,dx,pasoForm})); }catch(e){}
  },[stage,messages,dx,pasoForm]);

  // Recompila origen/señales/cronología/sueño a partir de los chips cada vez
  // que algo cambia — dx sigue siendo el único payload real hacia /log, los
  // chips son solo la forma de llenarlo. Guarda el estado de los chips
  // aparte (ESTRUCTURADO_KEY), para que recargar a mitad de camino no los
  // borre.
  //
  // "Tocado" por bloque (no solo "¿compiló algo?"): un padre puede llegar acá
  // con dx.origen/senales_observables/cronologia_del_dia ya escritos a mano
  // en el chat ANTES de abrir el formulario — si este efecto sobrescribiera
  // con "" apenas monta (porque el bloque de chips todavía está vacío),
  // borraría ese texto sin que nadie lo haya tocado. Solo se escribe encima
  // cuando el padre de verdad interactuó con ESE bloque de chips — si lo
  // vuelve a dejar todo sin marcar después de haber usado los chips, ahí sí
  // se refleja como vacío (eso sí fue una acción suya).
  useEffect(()=>{
    try{ localStorage.setItem(ESTRUCTURADO_KEY, JSON.stringify(estructurado)); }catch(e){}
    const origenTocado = !!(estructurado.origenParto || estructurado.origenLactancia || estructurado.origenOtra);
    const senalesTocado = !!((estructurado.senalesChips&&estructurado.senalesChips.length) || estructurado.senalesMatiz);
    const cronoTocado = !!(estructurado.cronoDespierta || estructurado.cronoDesayuna || estructurado.cronoAlmuerza || estructurado.cronoCena || estructurado.cronoFinde || estructurado.cronoLonchera || estructurado.cronoLoncheraDetalle || estructurado.cronoEntrenaSiNo || (estructurado.cronoEntrenaDias&&estructurado.cronoEntrenaDias.length) || estructurado.cronoMatiz);
    const suenoTocado = !!(estructurado.cronoDuerme || estructurado.suenoManual);
    const metasTocado = !!((estructurado.metasChips&&estructurado.metasChips.length) || estructurado.metasOtra);
    const preocupacionTocado = !!((estructurado.preocupacionChips&&estructurado.preocupacionChips.length) || estructurado.preocupacionOtra);
    const pantallasTocado = !!(estructurado.pantallasHoras || estructurado.pantallasAntesDormir || estructurado.pantallasMatiz);
    const findeTocado = !!((estructurado.findeComidas&&estructurado.findeComidas.length) || estructurado.findeMatiz);
    setDx(prev=>{
      const next = {
        ...prev,
        origen: origenTocado ? compilarOrigen(estructurado) : prev.origen,
        senales_observables: senalesTocado ? compilarSenales(estructurado) : prev.senales_observables,
        cronologia_del_dia: cronoTocado ? compilarCronologia(estructurado) : prev.cronologia_del_dia,
        sueno_y_movimiento: suenoTocado ? compilarSuenoYMovimiento(estructurado) : prev.sueno_y_movimiento,
        que_deseas_lograr: metasTocado ? compilarMetas(estructurado) : prev.que_deseas_lograr,
        preocupacion_principal: preocupacionTocado ? compilarPreocupacion(estructurado) : prev.preocupacion_principal,
        mente_y_pantallas: pantallasTocado ? compilarPantallas(estructurado) : prev.mente_y_pantallas,
        finde_y_gustos: findeTocado ? compilarFinde(estructurado) : prev.finde_y_gustos,
      };
      const igual = prev.origen===next.origen && prev.senales_observables===next.senales_observables && prev.cronologia_del_dia===next.cronologia_del_dia && prev.sueno_y_movimiento===next.sueno_y_movimiento && prev.que_deseas_lograr===next.que_deseas_lograr && prev.preocupacion_principal===next.preocupacion_principal && prev.mente_y_pantallas===next.mente_y_pantallas && prev.finde_y_gustos===next.finde_y_gustos;
      if(igual) return prev;
      return next;
    });
  },[estructurado]);

  const filled=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim()).length;

  // Qué falta, en palabras — para mostrarle al padre algo más útil que un
  // contador. Devuelve los campos SIEMPRE requeridos que faltan (o que están
  // pero sin sustancia, en el caso de la cronología) y cuántos opcionales
  // más hacen falta para tener un panorama real.
  const faltantes=()=>{
    const camposFaltantes=[];
    for(const k of REQUIRED_SIEMPRE){
      const val=(dx[k]||"").trim();
      const okLargo = k==="cronologia_del_dia" ? val.length>=MIN_LEN_CRONOLOGIA : val.length>0;
      if(!okLargo) camposFaltantes.push(FIELDS.find(f=>f.key===k).label);
    }
    const opcionalesLlenos=OPCIONALES.filter(k=>dx[k]&&dx[k].trim()).length;
    const opcFaltan=Math.max(0, MIN_OPCIONALES-opcionalesLlenos);
    return { camposFaltantes, opcFaltan };
  };
  const puedeEnviar=()=>{
    const {camposFaltantes,opcFaltan}=faltantes();
    const {cenaFalta,dormirFalta}=faltanDatosDuros(dx);
    return camposFaltantes.length===0 && opcFaltan===0 && !cenaFalta && !dormirFalta;
  };

  // Consentimiento (9 ago 2026): antes no había NINGUNA pantalla dentro del
  // producto que explicara qué se captura, quién lo revisa y cómo pedir que
  // se borre — era el gap más serio del assessment de RAI (Privacy → Consent
  // management, score 0/4). Ahora ambos caminos de entrada (chat o
  // formulario directo) pasan por acá primero, una sola vez por sesión —
  // dx.consentimiento_ts sirve como bandera de "ya lo aceptó" (no hace falta
  // un estado aparte) y viaja con el resto de dx hacia /log sin que el Worker
  // ni el Apps Script necesiten tocarse para que quede guardado en el futuro
  // (dx pasa completo tal cual a la hoja) — pendiente: agregar la columna
  // correspondiente en apps-script-formulario-v2.gs.txt para que quede
  // registrado también ahí, no solo viajando en el payload.
  const marcarConsentimiento=()=>{
    setDx(prev=>({...prev,
      consentimiento_ts:new Date().toISOString(),
      // Vacío si no marcó la casilla de investigación — igual que el resto
      // del formulario, un campo vacío significa "no aplica", no "no
      // preguntado". Nunca se infiere desde consentimiento_ts.
      consentimiento_investigacion_ts: consentInvestigacionChecked ? new Date().toISOString() : "",
    }));
  };
  // Los dos destinos posibles tras aceptar — antes vivían detrás de un
  // pendingStage genérico que pasaba por la pantalla "intro" intermedia;
  // ahora el consentimiento y el "cómo vamos a hacerlo" son una sola
  // pantalla, así que aceptar va directo al destino (startOrResumeChat ya
  // se define más abajo, pero por closure está disponible acá al ejecutarse).
  const empezarConversacion=()=>{ marcarConsentimiento(); startOrResumeChat(); };
  const empezarFormulario=()=>{ marcarConsentimiento(); setStage("form"); };
  const mensajeFaltante=()=>{
    const {camposFaltantes,opcFaltan}=faltantes();
    const {labels}=faltanDatosDuros(dx);
    const partes=[];
    if(camposFaltantes.length) partes.push(camposFaltantes.join(", "));
    if(labels.length) partes.push(labels.join(" y "));
    if(opcFaltan>0) partes.push(opcFaltan+" tema"+(opcFaltan>1?"s":"")+" más de su día a día");
    return partes.join(" y ");
  };

  const parseDx=(text)=>{
    const m=text.match(/<dx>([\s\S]*?)<\/dx>/);
    const clean=text.replace(/<dx>[\s\S]*?<\/dx>/g,"").replace(/<dx>[\s\S]*$/,"").trim();
    if(m){ try{ const o=JSON.parse(m[1]); setDx(prev=>{const n={...prev}; for(const k of Object.keys(o)) if(o[k]&&o[k].trim()) n[k]=o[k]; return n;}); }catch(e){} }
    return clean;
  };

  // Detecta el marcador <escalar>motivo</escalar> (ver PROTOCOLO DE SEGURIDAD
  // del prompt) y lo oculta del texto que ve el padre — mismo patrón que
  // plan/index.html. Antes de esto, una señal de riesgo real durante la
  // CAPTURA (a diferencia del chat de seguimiento post-aprobación) quedaba
  // solo como texto en el Sheet, sin avisarle a nadie en el momento.
  const parseEscalar=(text)=>{
    const m=text.match(/<escalar>([\s\S]*?)<\/escalar>/);
    const clean=text.replace(/<escalar>[\s\S]*?<\/escalar>/g,"").trim();
    return { clean, motivo: m ? m[1].trim() : null };
  };

  // Notifica una señal real al equipo — sin bloquear el chat si falla.
  const notificarEscalar=(motivo, mensajePadre)=>{
    fetch(WORKER_URL+"/escalar",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ nombreNino:dx.nombre_nino||"", motivo, mensajePadre:mensajePadre||"" }) }).catch(()=>{});
  };

  // Detecta el marcador <cambiar_modo>formulario</cambiar_modo> — cuando el
  // padre pide por texto pasarse al formulario directo en vez de un botón.
  // Antes de esto, Vita simplemente seguía preguntando como si no hubiera
  // entendido (encontrado probando en vivo: "prefiero seguir con el
  // formulario" → Vita respondía "claro, seguimos" y hacía la siguiente
  // pregunta del chat, sin cambiar nada).
  const parseCambiarModo=(text)=>{
    const m=text.match(/<cambiar_modo>([\s\S]*?)<\/cambiar_modo>/);
    const clean=text.replace(/<cambiar_modo>[\s\S]*?<\/cambiar_modo>/g,"").trim();
    return { clean, modo: m ? m[1].trim() : null };
  };

  // Une el parseo de los tres marcadores (<escalar>, <cambiar_modo>, <dx>) en
  // un solo paso. Devuelve el texto limpio para mostrar y, si aplica, el modo
  // al que hay que cambiar — dx SIEMPRE queda compartido entre chat y
  // formulario (mismo estado de React), así que cambiar de modo nunca pierde
  // ni duplica lo ya capturado.
  const processReply=(raw, mensajePadre, motivoRespaldo)=>{
    const { clean:sinEscalar, motivo } = parseEscalar(raw);
    const { clean:sinModo, modo } = parseCambiarModo(sinEscalar);
    const clean = parseDx(sinModo);
    const motivoFinal = motivo || motivoRespaldo || null;
    if(motivoFinal) notificarEscalar(motivoFinal, mensajePadre);
    return { clean, modo };
  };

  const callVita=async(msgs)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),45000);
    try{
      const res=await fetch(WORKER_URL,{ method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ model:MODEL, max_tokens:2500, system:BASE, messages:msgs.map(x=>({role:x.role,content:x.content})) }), signal:ctrl.signal });
      const data=await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n") || (data.error? "⚠️ "+JSON.stringify(data.error):"…");
    } finally { clearTimeout(timer); }
  };

  // Arranca el chat de cero O lo retoma sabiendo lo que ya se capturó (por
  // ejemplo, si el padre vino del formulario directo con algunos campos ya
  // llenos, o de una sesión anterior). dx es el mismo estado compartido con
  // el modo formulario, así que nunca hay que "reconstruir" nada — solo
  // decirle a Vita qué ya sabe para que no lo vuelva a preguntar.
  const startOrResumeChat=async()=>{
    setStage("chat"); setLoading(true); setError(null);
    const known=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim());
    const opener = known.length===0
      ? "[Un padre/madre abrió el chat para contarte sobre su hijo/a, para el Formulario de Hábitos. Salúdalo, preséntate breve y haz la primera pregunta del área 1 (nombre y edad del hijo/a).]"
      : "[El padre/madre viene del formulario directo (o de una conversación previa) y ahora quiere conversar contigo. YA SABES esto — NO lo vuelvas a preguntar: "+known.map(f=>f.label+': "'+dx[f.key]+'"').join(" | ")+". Salúdalo con calidez reconociendo brevemente que ya tienes esa información (sin listarla toda de corrido), y continúa con la siguiente pregunta natural de lo que aún falte.]";
    try{
      const raw=await callVita([{role:"user",content:opener}]);
      const {clean}=processReply(raw,"(inicio o retoma de conversación)");
      setMessages([{role:"assistant",content:clean}]);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  // Si el padre edita el formulario mientras el chat está pausado a mitad de
  // camino, Vita no se entera sola (esos campos nunca pasaron por la
  // conversación) — sin esto, al volver podría repreguntar algo que ya está
  // en el formulario. Manda un turno invisible (no se agrega a los mensajes
  // visibles, mismo patrón que el opener de arriba) con lo que cambió.
  const sincronizarCambiosFormulario=async()=>{
    setLoading(true);
    const known=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim());
    const opener="[El padre/madre editó el formulario directo mientras la conversación estaba pausada. Esto es lo que hay AHORA — actualiza tu entendimiento, no repitas preguntas ya resueltas, y sigue con la siguiente pregunta natural de lo que falte: "+known.map(f=>f.label+': "'+dx[f.key]+'"').join(" | ")+".]";
    try{
      const raw=await callVita([...messages,{role:"user",content:opener}]);
      const {clean}=processReply(raw,"(retoma tras editar el formulario)");
      setMessages(m=>[...m,{role:"assistant",content:clean}]);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  // Botón/link "cambiar a chat": si ya había una conversación en curso, solo
  // cambia de vista — y si el formulario cambió algo mientras tanto, le
  // avisa a Vita antes de seguir. Si no había conversación, arranca una
  // nueva sabiendo lo que ya haya en dx (ej. llenado parcial del formulario).
  const goToChat=()=>{
    if(messages.length>0){
      setStage("chat");
      if(dxAlPausar!==null && dxAlPausar!==JSON.stringify(dx)) sincronizarCambiosFormulario();
    } else {
      startOrResumeChat();
    }
  };
  // "cambiar a formulario": dx ya es el mismo estado en ambos modos, así que
  // cambiar de vista alcanza — el formulario aparece con lo ya capturado.
  // Se guarda un snapshot de dx para poder detectar, al volver, si el padre
  // cambió algo mientras el chat estaba pausado.
  const goToForm=()=>{ setDxAlPausar(JSON.stringify(dx)); setStage("form"); };

  const send=async(text)=>{
    const content=(text??input).trim(); if(!content||loading) return;
    setError(null); const next=[...messages,{role:"user",content}]; setMessages(next); setInput(""); setLoading(true);
    const motivoRespaldo=detectarRiesgoTextual(content);
    try{
      const raw=await callVita(next);
      const {clean,modo}=processReply(raw,content,motivoRespaldo);
      setMessages(m=>[...m,{role:"assistant",content:clean}]);
      if(modo==="formulario") setTimeout(goToForm,700);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  const retry=()=>{
    if(loading) return;
    setError(null);
    if(messages.length===0){ startOrResumeChat(); return; }
    setLoading(true);
    const last=messages[messages.length-1];
    const lastUser=last&&last.role==="user"?last.content:"";
    const motivoRespaldo=detectarRiesgoTextual(lastUser);
    callVita(messages)
      .then(raw=>{
        const {clean,modo}=processReply(raw,lastUser,motivoRespaldo);
        setMessages(m=>[...m,{role:"assistant",content:clean}]);
        if(modo==="formulario") setTimeout(goToForm,700);
      })
      .catch(()=>setError("No se pudo conectar. Reintenta."))
      .finally(()=>setLoading(false));
  };

  // HITL capture-only: nada se le muestra al padre como recomendación. Esto manda
  // el diagnóstico capturado a revisión (mismo Sheet vía el mismo Worker que
  // vita-demo-srb-3) — Peter lo aprueba antes de que alguien le escriba al padre.
  // Separado en dos pasos (10 ago 2026): enviarDatos() hace el envío real y
  // recibe el dx final como parámetro (no lo lee del estado directamente,
  // porque confirmarEnvioIncompleto() necesita mandar una versión de dx
  // recién modificada en el mismo instante — leer del estado ahí llegaría
  // tarde, setDx es asíncrono). sendToReview() es lo que llaman los botones:
  // revisa cobertura del día primero, y solo llama a enviarDatos() derecho
  // si el día está completo.
  const enviarDatos=async(dxFinal)=>{
    setSending(true); setSendError(null);
    // Última red de respaldo antes de enviar: escanea TODO lo capturado —
    // por chat o por el modo formulario directo, que no pasa por el modelo
    // en absoluto y por eso no tiene ningún otro chequeo de riesgo. Dedupe
    // por motivo para no mandar varios correos iguales.
    const motivosEncontrados=new Set();
    for(const k of Object.keys(dxFinal)){ const m=detectarRiesgoTextual(dxFinal[k]); if(m) motivosEncontrados.add(m); }
    motivosEncontrados.forEach(m=>notificarEscalar(m, dxFinal.preocupacion_principal||dxFinal.senales_observables||""));
    try{
      // camposSnapshot (2 oct 2026, pedido de Leonardo): manda el FIELDS que
      // usó ESTE padre al llenar, tal cual estaba hoy — así, si mañana
      // cambia un hint en shared/formulario-fields.js, el panel sigue
      // mostrando la pregunta exacta que él vio, no la versión nueva.
      // feedbackFormulario viaja SEPARADO de dx a propósito (10 nov 2026) —
      // dx completo se serializa tal cual hacia el prompt de Claude
      // (ver generarYVerificarBorrador en el Worker); meter ahí el feedback
      // sobre LLENAR el formulario lo expondría al generador de planes, que
      // nunca debe verlo. Como campo hermano, el Worker lo guarda en su
      // propia columna del Sheet sin que pase por dx en ningún momento.
      const res=await fetch(WORKER_URL+"/log",{ method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ producto:"formulario", mode:MODE, dx:dxFinal, ts:new Date().toISOString(), camposSnapshot:FIELDS, feedbackFormulario:estructurado.feedbackFormulario||"" }) });
      const data=await res.json().catch(()=>({}));
      if(!res.ok || data.ok===false) throw new Error("log failed");
      borrarGuardado(); // ya está en manos del equipo: no tiene sentido seguir guardándolo en el dispositivo
      setStage("sent");
    }catch(e){ setSendError("No se pudo enviar. Reintenta."); }
    finally{ setSending(false); }
  };

  // SIEMPRE pasa por la revisión final antes de enviar de verdad (10 ago
  // 2026) — antes solo se detenía si faltaba algo del día; ahora también se
  // detiene siempre a mostrar el correo, editable, porque un typo ahí es
  // silencioso y grave (es el único canal de entrega). Ver PanelRevisionFinal.
  const sendToReview=()=>{
    if(sending||!puedeEnviar()) return; // el botón ya se deshabilita solo, esto es el respaldo por si acaso
    setMostrarRevisionFinal(true);
  };

  // Confirmación final: si además faltan momentos del día, ese hueco queda
  // ANOTADO en el mismo texto que ve Peter, nunca en silencio.
  const confirmarYEnviar=()=>{
    const {faltantes}=coberturaDia(dx.cronologia_del_dia);
    // NUEVO (3 nov 2026): si el padre confirmó la hora sugerida para un
    // momento, se anota como hora aproximada CONFIRMADA (no como hueco) —
    // Peter la ve distinta de un dato que de verdad falta.
    const resumenFaltantes=faltantes.map(f=>{
      if(f.motivo==="sin_hora" && horasConfirmadas[f.label] && HORA_SUGERIDA[f.label]){
        return f.label+" (hora aproximada confirmada por el padre: "+HORA_SUGERIDA[f.label]+")";
      }
      return f.motivo==="sin_hora" ? f.label+" (mencionado, sin hora exacta)" : f.label;
    }).join(", ");
    const dxFinal=faltantes.length>0
      ? {...dx, cronologia_del_dia:(dx.cronologia_del_dia||"")+"\n[Sin dato, sin hora exacta, o no compartido aún: "+resumenFaltantes+"]"}
      : dx;
    if(faltantes.length>0) setDx(dxFinal);
    setMostrarRevisionFinal(false);
    enviarDatos(dxFinal);
  };
  const toggleHoraConfirmada=(label)=>setHorasConfirmadas(prev=>({...prev, [label]:!prev[label]}));
  const volverACompletarDia=()=>setMostrarRevisionFinal(false);
  const cambiarEmailEnRevision=(valor)=>setDx(prev=>({...prev, email_padre:valor}));

  const exportDx=async()=>{ const txt="FORMULARIO DE HÁBITOS · be360\n\n"+FIELDS.map(f=>f.label+": "+(dx[f.key]||"—")).join("\n"); try{ await navigator.clipboard.writeText(txt); setExported(true); setTimeout(()=>setExported(false),2000);}catch(e){ const w=window.open("","_blank"); if(w){ w.document.body.style.cssText="font-family:system-ui;padding:20px;white-space:pre-wrap;line-height:1.5"; w.document.body.textContent=txt; } } };

  const copyChat=async()=>{ const txt="CONVERSACIÓN CON VITA · be360 (Formulario de Hábitos)\nFecha: "+new Date().toLocaleString("es-CO")+"\n\n"+messages.map(m=>(m.role==="assistant"?"Vita":"Tú (mamá/papá)")+":\n"+m.content).join("\n\n"); try{ await navigator.clipboard.writeText(txt); setChatCopied(true); setTimeout(()=>setChatCopied(false),2000);}catch(e){ const w=window.open("","_blank"); if(w){ w.document.body.style.cssText="font-family:system-ui;padding:20px;white-space:pre-wrap;line-height:1.5"; w.document.body.textContent=txt; } } };
  const btnPrimary={background:P.sage,color:"#fff",border:"none",borderRadius:999,padding:"14px 30px",fontSize:15.5,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",boxShadow:"0 6px 18px rgba(90,122,92,.35)"};
  // Botón "Atrás" del formulario por pasos (12 nov 2026) — mismo tamaño que
  // btnPrimary para que la fila no salte de alto, pero sin relleno, para no
  // competir visualmente con el botón primario de "Siguiente"/"Enviar".
  const btnGhostForm={background:"none",color:P.sageDeep,border:"1px solid "+P.line,borderRadius:999,padding:"14px 20px",fontSize:14,fontWeight:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer"};

  if(stage==="welcome") return (
    <Shell><div className="rise scroll" style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"32px 26px",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:14}}>🌱</div>
      {/* Reescrita (21 oct 2026, revisión de Leonardo pantalla por pantalla),
          de nuevo (8 nov 2026, propuesta de Gemini, aprobada por Leonardo —
          "reemplaza") y de nuevo (8 nov 2026, auditoría de Leonardo + Gemini
          sobre el PR #184, ver COLABORACION_GEMINI_CCODE.md): corrige una
          mezcla de voces que la ronda anterior no resolvió del todo — Vita
          narra todo en 1ra persona ("Acompaño"/"Conozco"/"Te acompaño"), y
          solo menciona al equipo en 3ra persona para el paso que de verdad
          hace el equipo (preparar el plan, con aprobación clínica), nunca
          atribuyéndoselo a Vita. Quita además la mención de marca ("de
          be360"), "sin plataformas complicadas" (objeción que nadie
          planteó) y la frase de minutos/pediatra antes del botón — ninguna
          suma, todas restan foco. Revisado contra las reglas fijas del
          proyecto: "hijo o hija" no "hijo(a)", "el equipo" no "nuestro
          equipo" ni "el equipo clínico" en esta pantalla, "Formulario de
          Hábitos" sin cambiar de nombre, "be360" no "Bienestar 360", sin
          cifra de tiempo. El botón se queda en "Comenzar →". */}
      <div style={{fontFamily:"'Fraunces',serif",fontSize:27,color:P.sageDeep,lineHeight:1.15,marginBottom:6}}>Hola, soy Vita</div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:15,color:P.sage,fontStyle:"italic",marginBottom:14}}>Cuerpo sano, mente brillante.</div>
      <p style={{fontSize:14.5,color:P.ink,lineHeight:1.6,maxWidth:360,marginBottom:16}}>Acompaño a las familias a construir hábitos de sueño, alimentación y movimiento para su bienestar.</p>
      <div style={{textAlign:"left",maxWidth:360,width:"100%",marginBottom:16,display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"flex",gap:11}}>

      </div>
      <details style={{marginBottom:18}}>
        <summary style={{fontSize:12,color:P.sageDeep,fontWeight:700,textDecoration:"underline",cursor:"pointer",textAlign:"center"}}>Ver detalle legal completo →</summary>
        <div style={{fontSize:12,color:P.muted,lineHeight:1.6,background:"#fff",border:"1px solid "+P.line,borderRadius:12,padding:"12px 14px",marginTop:10}}>
          <p style={{margin:"0 0 8px"}}>🩺 Un humano del equipo clínico revisa todo antes de que te llegue — nunca reemplaza a tu pediatra.</p>

          <p style={{margin:"0 0 8px"}}>🏫 Cuando el programa llega a través de un colegio, con el colegio compartimos solo reportes agregados y anónimos — nunca datos de tu hijo o hija.</p>
          <p style={{margin:0}}><a href="/terminos" target="_blank" rel="noopener" style={{color:P.sageDeep,fontWeight:700,textDecoration:"underline"}}>Lee la política completa →</a></p>

      <label style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:16,cursor:"pointer"}}>

        <span style={{fontSize:13,color:P.ink,lineHeight:1.5}}>He leído esto y acepto que se use para preparar el plan de mi hijo o hija.</span>

      {/* NUEVO (19 ago 2026, pedido de Leonardo): casilla de investigación —
          SEPARADA de la de arriba a propósito. Desmarcada por defecto, nadie

      <label style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:20,cursor:"pointer"}}>
        <input type="checkbox" checked={consentInvestigacionChecked} onChange={e=>setConsentInvestigacionChecked(e.target.checked)} style={{marginTop:3,width:17,height:17,flexShrink:0,accentColor:P.sage}}/>

      {/* Reetiquetado 12 nov 2026 (pedido de Leonardo) — la frase vieja

      <button onClick={()=>setStage("welcome")} style={{background:"none",border:"none",color:P.muted,fontSize:12.5,fontWeight:700,marginTop:14,cursor:"pointer",alignSelf:"center",fontFamily:"'Nunito',sans-serif"}}>← Volver</button>
    </div></Shell>
  );

  if(stage==="form"){
    const totalPasos=CAMPOS_VISIBLES.length;
    const campoActual=CAMPOS_VISIBLES[pasoForm]||CAMPOS_VISIBLES[0];
    const esUltimoPaso=pasoForm>=totalPasos-1;
    const irA=(i)=>setPasoForm(Math.max(0,Math.min(totalPasos-1,i)));
    const irSiguiente=()=>irA(pasoForm+1);
    const irAtras=()=>irA(pasoForm-1);
    // Deslizar con el dedo (12 nov 2026, pedido de Leonardo/Peter — una
    // pantalla por sección, estilo apps como BEND) — umbral de 40px para no
    // disparar con un scroll vertical normal dentro de la misma pantalla.
    let touchX0=null;
    const onTouchStart=(ev)=>{ touchX0=ev.touches[0].clientX; };
    const onTouchEnd=(ev)=>{
      if(touchX0===null) return;
      const dx2=ev.changedTouches[0].clientX-touchX0;
      touchX0=null;
      if(Math.abs(dx2)<40) return;
      if(dx2<0) irSiguiente(); else irAtras();
    };
    return (
    <Shell><div className="rise" style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}}>

            final, no de esta barra). */}
        <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
          {CAMPOS_VISIBLES.map((f,i)=>(
            <span key={f.key} onClick={()=>irA(i)} title={f.label} style={{flex:1,minWidth:10,height:5,borderRadius:999,background:i<=pasoForm?P.sage:P.line,cursor:"pointer"}}/>
          ))}
        </div>
        {pasoForm===0 && (
          <div style={{textAlign:"center",marginBottom:14}}>
            <div style={{fontSize:30,marginBottom:6}}>🌱</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:19,color:P.sageDeep,marginBottom:4}}>Formulario de Hábitos</div>
            <p style={{fontSize:12,color:P.muted,lineHeight:1.5,maxWidth:340,margin:"0 auto"}}>Completa los datos que tengas a mano — el equipo revisa todo igual.</p>
          </div>
        )}
      </div>
      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} className="scroll" style={{flex:1,overflowY:"auto",padding:"0 22px 18px",display:"flex",flexDirection:"column",gap:16}}>

        // Identidad (7 nov 2026): inputs de una línea en vez de textarea —

          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>
            <input type="text" value={dx.nombre_padre} onChange={e=>setDx(prev=>({...prev,nombre_padre:e.target.value}))}
              style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none"}}/>
          </div>
        );

          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>

            <input type="email" value={dx.email_padre} onChange={e=>setDx(prev=>({...prev,email_padre:e.target.value}))}
              style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none"}}/>
          </div>

              <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>
              <input type="text" value={dx.nombre_nino} onChange={e=>setDx(prev=>({...prev,nombre_nino:e.target.value}))}
                style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none"}}/>

                style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none"}}/>
            </div>
          </div>
        );
        if(f.key==="que_deseas_lograr") return (
          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>
            <BloqueChipsOtro opciones={METAS_OPCIONES} chips={estructurado.metasChips} setChips={c=>setEstructurado(prev=>({...prev,metasChips:c}))} otra={estructurado.metasOtra} setOtra={t=>setEstructurado(prev=>({...prev,metasOtra:t}))} P={P}/>
          </div>

        if(f.key==="preocupacion_principal") return (
          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>

        if(f.key==="cronologia_del_dia") return (

            <BloqueCronologia e={estructurado} set={setEstructurado} P={P}/>
          </div>
        );
        // sueno_y_movimiento: la hora de dormir ya se captura arriba, en el

        // estructurado.suenoManual, y el efecto de arriba arma dx.sueno_y_movimiento
        // pegando la hora compilada + esto.
        if(f.key==="sueno_y_movimiento") return (
          <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>

            <textarea value={estructurado.suenoManual} onChange={e=>setEstructurado(prev=>({...prev,suenoManual:e.target.value}))} rows={2}
              style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none",resize:"vertical"}}/>
