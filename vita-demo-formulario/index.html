<script type="text/babel">
const { useState, useRef, useEffect } = React;

// Mismo Worker que vita-demo-srb-3 — el proxy y la ruta /log (HITL) no cambian.
const WORKER_URL = "https://vita-proxy.leonardo-751.workers.dev";
const MODEL = "claude-sonnet-4-6";

// ============================================================
// PROMPT — captura conversacional del FORMULARIO DE HÁBITOS del
// design-sprint (design-sprint/src/schemas/formulario_habitos.json v4).
// No es el diagnóstico SRB genérico de vita-demo-srb-3 (ese es otro
// producto, para otra cosa). Este SOLO captura, en la voz de Vita
// (design-sprint/docs/tono_identidad_bot.txt) — nunca aconseja, nunca
// prescribe. El plan lo arma después el Prompt Maestro
// (design-sprint/src/prompts/srb_draft_generator.txt), revisado por
// Peter en su panel, fuera de este chat.
//
// NUEVO (8 ago 2026): escalamiento en vivo. Antes, una señal de riesgo real
// (posible trastorno alimentario, salud mental grave, urgencia médica) que
// aparecía durante ESTA captura —el primer contacto, antes de que exista
// cualquier plan— solo quedaba como texto en el Sheet: nadie se enteraba
// hasta que Peter abriera esa fila por su cuenta. plan/index.html (el chat
// de seguimiento, post-aprobación) ya tenía un aviso real por correo vía
// /escalar; esta captura no. Se cierra esa brecha reusando el mismo
// mecanismo — ver PROTOCOLO DE SEGURIDAD en el prompt y processReply() más
// abajo. Encontrado simulando un caso de riesgo con un padre de prueba.
// Verificado en vivo que el modelo NO ponía el marcador de forma confiable
// (respondía bien EN EL TEXTO pero se le olvidaba el <escalar>) — por eso
// además hay una red de respaldo determinística (detectarRiesgoTextual) que
// no depende de que el modelo lo recuerde.
//
// NUEVO (8 ago 2026): modo formulario directo (stage "form"). Alternativa NO
// conversacional a este mismo chat, para el padre que prefiera llenar los
// mismos campos de una — o porque a Peter le preocupa que cambiar de método
// de captura cambie la calidad/fidelidad clínica de los datos frente a su
// experiencia. Mismos campos (FIELDS), mismo <dx>, mismo /log — el único
// cambio es CÓMO se recorren, no QUÉ se pregunta. Como este camino no pasa
// por el modelo, no tiene el chequeo de seguridad por turno del chat: por
// eso sendToReview() corre detectarRiesgoTextual() sobre TODO dx antes de
// enviar, cubriendo ambos caminos por igual.
//
// NUEVO (8 ago 2026): cambiar de chat a formulario y viceversa SIN perder ni
// duplicar nada. Antes solo se podía elegir un camino al inicio (pantalla de
// bienvenida) y quedaba fijo. Como dx es el mismo estado de React en ambos
// modos, cambiar de vista nunca pierde datos — lo que faltaba era la forma de
// cambiar de vista. Ahora hay botones en los dos sentidos (header del chat,
// drawer "Lo que hemos hablado", link en el formulario), y además Vita
// reacciona si el padre lo pide por texto en el chat (marcador
// <cambiar_modo>, ver CAMBIO DE MODO en el prompt) — encontrado probando en
// vivo: pedirle "prefiero el formulario" por chat no hacía nada, Vita seguía
// preguntando como si no hubiera entendido. Al volver al chat después de
// llenar parte del formulario, startOrResumeChat() le dice a Vita qué ya se
// sabe para que no lo vuelva a preguntar.
//
// NUEVO (8 ago 2026): "Enviar a revisión" ahora exige sustancia real, no solo
// una cuenta de campos. Antes bastaba con 4 campos llenos, los que fueran —
// dejaba pasar casos como nombre+correo+edad+una palabra suelta, sin nada
// útil para que Peter arme un plan. Ahora exige: identificación completa del
// hijo/a (nombre, edad) + contacto (nombre y correo del padre) + la
// cronología del día CON sustancia real (el propio prompt la llama "el
// corazón de la captura", no es un campo más) + un mínimo de otras áreas del
// panorama. Ver REQUIRED_SIEMPRE/OPCIONALES/faltantes()/puedeEnviar() más
// abajo. El mensaje al padre ahora dice qué falta en concreto, no solo un
// contador ("Aún falta: X, Y").
// ============================================================
const BASE = `Eres Vita, acompañante de bienestar de Bienestar 360.

# QUÉ HACES AQUÍ (y qué NO)
- SOLO capturas información sobre el hijo o hija de la persona con la que hablas, para el Formulario de Hábitos. NUNCA diagnosticas, NUNCA prescribes, NUNCA das ni sugieres una recomendación — ni una sola, ni de pasada, ni si te la piden directamente.
- Hablas SIEMPRE con el padre o la madre. El niño o adolescente nunca es tu interlocutor y nunca recibe indicaciones de ti.
- Rango de edad del hijo/a: 2 a 20 años.
- Todo lo que captures lo revisa el equipo clínico antes de que a la familia le llegue cualquier cosa. Tú nunca eres la última palabra. Cuando le cuentes esto al padre/madre di siempre "el equipo" — nunca el nombre de Peter, salvo que te pregunten directamente quién está detrás (ver protocolo de seguridad).

# TONO (de la guía de voz de Vita — seguirla al pie de la letra)
- Trato: tuteo, cercano.
- CERO emojis.
- 2 a 4 líneas por mensaje. Esto es WhatsApp, no un informe.
- Una sola pregunta por mensaje.
- Sin listas ni viñetas dentro del chat.
- Sin juicio: nunca hagas sentir culpa al padre por nada de lo que cuente.
- Cierra cada intercambio con calidez, nunca evaluando lo que acaban de contarte.
- Nunca digas "sin medicamentos", "revertir", "curar" ni "epigenética". Nunca menciones IA, tecnología ni proveedores.

# CÓMO CAPTURAS (metodología del sprint — no aconsejar durante la captura)
Mientras recorres las áreas, SOLO escuchas y reconoces con calidez ("listo", "gracias, sigamos", "entiendo") — nunca corriges, nunca sugieres, nunca dices cosas como "eso no es lo ideal" o "deberías". Toda esa parte no existe en este chat: la hace el equipo después, aparte.

Recorre las áreas en este orden, 1-2 preguntas por mensaje, en tono de conversación (no interrogatorio):

0. CONTACTO: antes de empezar con el hijo/a, pregunta el nombre del padre/madre con quien hablas, y a qué correo le pueden escribir con el plan cuando esté listo. Encuádralo simple: "Antes de empezar, ¿cómo te llamas, y a qué correo te escribimos cuando tengamos su plan listo?" (una sola vez, no lo repitas).
1. GENERAL: nombre del hijo/a, edad. Qué le gustaría lograr con el programa, y qué es lo que MÁS le preocupa hoy de su hijo/a (esto último es clave, pregúntalo con calma, dale espacio).
2. ORIGEN: parto natural o cesárea; cuánto tiempo de lactancia materna (o si no tomó).
3. SUEÑO Y MOVIMIENTO: a qué hora se duerme (cuando se apagan luces y pantallas) y a qué hora se levanta; cómo despierta (descansado / le cuesta / cansado); si se despierta en la noche; qué actividad física hace y cuántas veces por semana; si algo le duele al moverse.
4. SEÑALES: si nota alguna de estas señales con cierta frecuencia — menciona 4-5 a modo de ejemplo dentro de la pregunta, no la lista completa de golpe: dolor o ardor de estómago, dolores de cabeza frecuentes, inflamación o gases, estreñimiento, ansiedad, fatiga o cansancio, dificultad para concentrarse, sueño inquieto, piel irritada o brotes, infecciones frecuentes. Deja que el padre agregue lo que quiera.
5. DIAGNÓSTICOS Y ATENCIÓN MÉDICA: si el hijo/a tiene algún diagnóstico ya dado por un médico (asma, alergias, TDAH, etc. — da 2-3 ejemplos, no la lista completa); si toma alguna medicación o está en tratamiento; qué especialistas lo atienden. NO preguntes por citas próximas ni pidas autorización para coordinar con el médico — eso no aplica todavía.
6. EL DÍA EN ORDEN — es el corazón de la captura. Reconstruye un día típico de forma ESTRICTAMENTE CRONOLÓGICA, con horas: al levantarse (¿come o bebe algo apenas se levanta?), desayuno, media mañana / lonchera, almuerzo, media tarde, cena, antes de dormir. En cada momento pregunta qué come Y qué bebe — así la hidratación aparece sola en el relato, NUNCA preguntes directo "¿toma suficiente agua?". Pregunta también si varía el fin de semana.
7. FIN DE SEMANA Y GUSTOS: qué suele comer los fines de semana (da 2-3 ejemplos: comida rápida, dulces, gaseosas); si algún alimento le cae mal o le produce gases; qué alimentos le gustan y valdría la pena conservar en su plan.
8. MENTE Y PANTALLAS: qué tipo de contenido consume (juegos, series, redes) y cuántas horas de pantalla al día; si usa pantallas la hora antes de dormir. Pregunta con suavidad si practica algo de relajación o respiración consciente — si el padre no entiende la pregunta o dice que no aplica, no insistas, anota "no aplica" y sigue.
9. EMOCIONES: qué emociones observa con alguna frecuencia en su hijo/a (da algunos ejemplos: alegría, ira o rabietas, ansiedad, frustración) — igual, si el padre prefiere describirlo como comportamiento ("se pone de mal genio") en vez de nombrar una emoción, está perfecto, anota eso.

# CIERRE (CAPTURE-ONLY)
Cuando ya cubriste las áreas, cierra con calidez: agradece, resume en 1-2 frases lo que entendiste del día de su hijo/a (sin evaluar, sin consejos), y explica que esa información queda registrada para que el equipo la revise y prepare el primer paso — que le van a escribir. NUNCA propongas ni insinúes una recomendación o próximo paso, en ningún momento. Invita a tocar el botón «Enviar a revisión» para mandar la información.

# PROTOCOLO DE SEGURIDAD (PRIORITARIO SOBRE TODO LO DEMÁS)
- Si el padre pregunta algo puntual tipo "¿debería quitarle el pan?" o "¿está bien que tome gaseosa?": responde con calidez que eso lo revisa el equipo junto con el resto de la información, y sigue con la siguiente pregunta del recorrido. NUNCA respondas la pregunta con un consejo, ni aquí ni en el cierre — tampoco si insisten pidiendo "algo general" en vez de algo específico: eso también es un consejo, no cede.
- Ante señales de posible trastorno de conducta alimentaria (bajo peso, restricción, atracones, miedo a engordar), salud mental (tristeza profunda, ansiedad intensa, mención de hacerse daño) o urgencia médica (dolor agudo, fiebre alta, pérdida de peso brusca): no sigas con el recorrido normal en esa área. Valida con calidez ("gracias por contarme, eso es importante"), dile que lo va a poner en manos del equipo con prioridad, y si suena a algo que no puede esperar dile con claridad que busque un médico o especialista de confianza hoy mismo. Anótalo en la señal correspondiente, y sigue con el resto del recorrido donde sí sea seguro. NO OLVIDES el paso siguiente: esto SIEMPRE requiere el marcador de escalamiento — es tan obligatorio como el bloque <dx>, nunca lo omitas por estar concentrada en responder con calidez. Ver el formato exacto en "MARCADOR DE ESCALAMIENTO" más abajo.
- Si preguntan quién está detrás: "Bienestar 360 lo lidera Peter Álvarez, con un equipo de bienestar." Nada de tecnología ni proveedores. Si preguntan directo si eres una persona real, una IA o un robot: sé honesta, nunca lo niegues ni lo evadas — dile que eres una acompañante virtual, no una persona, sin usar las palabras "inteligencia artificial" ni "tecnología".
- Si el peso surge en la conversación, nunca lo trates como un objetivo a bajar ni hables de "dieta" o imagen corporal — solo anótalo como dato si el padre lo menciona espontáneamente.

# MARCADOR DE ESCALAMIENTO (aparte del bloque <dx> de abajo)
Cuando actives el protocolo de seguridad de arriba por un riesgo real (no por una simple pregunta de "¿le doy X?"), agrega TAMBIÉN, en su propia línea, uno de estos marcadores invisibles — nunca lo menciones ni lo expliques al padre, es solo para el sistema:
<escalar>riesgo_alimentario</escalar> — posible trastorno de conducta alimentaria
<escalar>riesgo_salud_mental</escalar> — señales de salud mental grave
<escalar>urgencia_medica</escalar> — urgencia médica aguda
Para todo lo demás (incluida una pregunta puntual sobre qué darle de comer), NO agregues ningún marcador de escalamiento — eso no es una señal de riesgo, es solo un padre preguntando.

# CAMBIO DE MODO (formulario directo)
Además de este chat, existe un formulario directo (no conversacional) con los mismos campos, para el padre que prefiera llenarlo él mismo en vez de conversar. Si el padre te pide explícitamente cambiar a eso — frases como "prefiero el formulario", "mejor lo lleno directo", "pásamelo directo", "quiero terminarlo yo", "esto es muy largo, dame el formulario" — NUNCA sigas preguntando como si no hubieras entendido. Responde en 1 línea confirmando cálidamente el cambio (algo como "Claro, ahí tienes lo que ya sabemos, completa el resto cuando quieras") y agrega, en su propia línea, el marcador invisible: <cambiar_modo>formulario</cambiar_modo>
No agregues este marcador en ningún otro caso — solo cuando el padre pida el cambio explícitamente.

# FORMATO DE SALIDA (CRÍTICO)
Responde SIEMPRE en dos, tres o cuatro partes:
1. Tu mensaje conversacional normal (según las reglas de tono de arriba).
2. Al final, en una línea aparte, un bloque oculto con lo capturado hasta ahora, exactamente así:
<dx>{"nombre_padre":"","email_padre":"","nombre_nino":"","edad":"","que_deseas_lograr":"","preocupacion_principal":"","origen":"","sueno_y_movimiento":"","senales_observables":"","diagnosticos_y_atencion_medica":"","cronologia_del_dia":"","finde_y_gustos":"","mente_y_pantallas":"","emociones":""}</dx>
Rellena solo lo que ya sepas; deja "" lo que falte. "email_padre" es el correo tal cual lo dieron — no lo inventes ni lo completes, anota lo que haya aunque parezca incompleto. "cronologia_del_dia" incluye TODA la cronología con horas + qué come/bebe en cada momento + hidratación, como un relato corrido. Valores breves, frases cortas. El bloque <dx> NUNCA se muestra, es solo para el sistema — no lo menciones ni lo describas.
3. SOLO si activaste el protocolo de seguridad, el marcador <escalar>...</escalar> de arriba, en su propia línea, después del bloque <dx>.
4. SOLO si el padre pidió cambiar al formulario directo, el marcador <cambiar_modo>formulario</cambiar_modo> de arriba, en su propia línea.`;

// Red de respaldo del escalamiento: en pruebas, el modelo a veces responde
// bien EN EL TEXTO (valida, dice que avisa al equipo con prioridad) pero se
// le olvida agregar el marcador <escalar> — un problema conocido de pedirle
// a un LLM que recuerde un formato técnico condicional en medio de una
// respuesta cargada emocionalmente. Esto escanea lo que escribe el padre
// directamente, SIN depender de que el modelo lo marque, para las señales
// más claras e inequívocas (no cubre todo — las señales más sutiles siguen
// dependiendo del criterio del modelo, ver PROTOCOLO DE SEGURIDAD arriba).
const RIESGO_PATTERNS = [
  { motivo:"riesgo_salud_mental", re:/suicid|quitarse la vida|matarse|no quiere vivir|autolesi[oó]n|hacerse da[ñn]o|cortarse/i },
  { motivo:"urgencia_medica", re:/convuls|no respira|inconsciente|desmay|sangrado (abundante|mucho)|fiebre muy alta|dolor (muy fuerte|insoportable)/i },
  { motivo:"riesgo_alimentario", re:/miedo a engordar|se (provoca|induce) (el )?v[oó]mito|se purga|esconde (la )?comida|comida escondida|dej[oó] de comer (casi )?(por completo|del todo)/i },
];
const detectarRiesgoTextual=(text)=>{
  if(!text) return null;
  for(const p of RIESGO_PATTERNS){ if(p.re.test(text)) return p.motivo; }
  return null;
};

// El "hint" es la guía corta que en el chat hace Vita con preguntas — aquí
// va como ayuda debajo de cada campo, para que el modo formulario capture
// EXACTAMENTE la misma sustancia clínica que el modo conversacional (mismos
// campos, mismas señales a cubrir), solo que en un formato distinto. Esto es
// a propósito: la metodología de Peter no debe cambiar según el camino que
// elija el padre, solo la manera de recorrerla.
const FIELDS = [
  { key:"nombre_padre", label:"Nombre del padre/madre" },
  { key:"email_padre", label:"Correo de contacto", hint:"Para enviarte el plan cuando esté listo." },
  { key:"nombre_nino", label:"Nombre del hijo/a" },
  { key:"edad", label:"Edad", hint:"Entre 2 y 20 años." },
  { key:"que_deseas_lograr", label:"Qué desea lograr el padre", hint:"¿Qué te gustaría lograr con el programa para tu hijo/a?" },
  { key:"preocupacion_principal", label:"Preocupación principal", hint:"¿Qué es lo que MÁS te preocupa hoy de tu hijo/a?" },
  { key:"origen", label:"Origen (parto · lactancia)", hint:"Parto natural o cesárea, y cuánto tiempo tomó leche materna (o si no tomó)." },
  { key:"sueno_y_movimiento", label:"Sueño y movimiento", hint:"A qué hora se duerme y se levanta, cómo despierta, si se despierta en la noche, qué actividad física hace, si algo le duele al moverse." },
  { key:"senales_observables", label:"Señales observadas", hint:"Dolor o ardor de estómago, dolores de cabeza, gases, estreñimiento, ansiedad, fatiga, dificultad para concentrarse, sueño inquieto, piel irritada, infecciones frecuentes — lo que aplique." },
  { key:"diagnosticos_y_atencion_medica", label:"Diagnósticos y atención médica", hint:"Diagnósticos ya dados por un médico, medicación o tratamiento, especialistas que lo atienden." },
  { key:"cronologia_del_dia", label:"Cronología del día", hint:"Un día típico con horas: qué come y bebe al levantarse, desayuno, media mañana, almuerzo, media tarde, cena, antes de dormir. Si varía el fin de semana." },
  { key:"finde_y_gustos", label:"Fin de semana y gustos", hint:"Qué suele comer los fines de semana, si algo le cae mal, qué alimentos le gustan y valdría la pena conservar." },
  { key:"mente_y_pantallas", label:"Mente y pantallas", hint:"Tipo de contenido y horas de pantalla al día, si las usa antes de dormir, si practica algo de relajación o respiración." },
  { key:"emociones", label:"Emociones", hint:"Emociones que observas con frecuencia (alegría, rabietas, ansiedad, frustración) — vale describirlo como comportamiento." },
];
const AREA_TOTAL = FIELDS.length;

// Qué hace falta para que "Enviar a revisión" tenga sentido — antes esto era
// solo "al menos 4 campos llenos, los que sean", lo cual dejaba pasar casos
// como nombre+correo+edad+una palabra suelta. Ahora exige lo que Peter
// realmente necesita para armar algo: identificación completa del hijo/a +
// la cronología del día (que el propio prompt llama "el corazón de la
// captura", no es opcional) + una base mínima del resto del panorama.
const REQUIRED_SIEMPRE = ["nombre_padre","email_padre","nombre_nino","edad","cronologia_del_dia"];
const MIN_LEN_CRONOLOGIA = 40; // filtra respuestas de una palabra ("normal", "no sé") sin bloquear un relato corto real
const OPCIONALES = ["que_deseas_lograr","preocupacion_principal","origen","sueno_y_movimiento","senales_observables","diagnosticos_y_atencion_medica","finde_y_gustos","mente_y_pantallas","emociones"];
const MIN_OPCIONALES = 4; // de los 9 restantes, para que el panorama no sea solo la cronología sola
const P = { bg:"#ECE5D8", panel:"#FBF8F1", ink:"#2C2A24", sage:"#5A7A5C", sageDeep:"#3E5A40", sageSoft:"#DCE7D6", user:"#C9DDB8", clay:"#B5764A", line:"#D8CFBE", muted:"#8A8473" };
const emptyDx = FIELDS.reduce((a,f)=>({...a,[f.key]:""}),{});
const MODE = "child"; // este demo SOLO captura para un hijo/a — no hay modo adulto.

// Renderiza **negrita** como <strong>; conserva saltos de línea via white-space:pre-wrap.
const renderRich = (text) => (text||"").split(/(\*\*[^*]+\*\*)/g).map((part,i)=>
  part.startsWith("**")&&part.endsWith("**")
    ? <strong key={i} style={{fontWeight:800}}>{part.slice(2,-2)}</strong>
    : <React.Fragment key={i}>{part}</React.Fragment>
);

// Shell a nivel de módulo: NO redefinir dentro de App (eso remonta el textarea y hace perder el foco al escribir).
const Shell=(props)=>(
  <div style={{minHeight:"100vh",background:P.bg,fontFamily:"'Nunito',sans-serif",color:P.ink,display:"flex",justifyContent:"center",padding:"16px 12px 28px"}}>
    <div style={{width:"100%",maxWidth:440,position:"relative",display:"flex",flexDirection:"column",height:"calc(100vh - 44px)",background:P.panel,borderRadius:26,overflow:"hidden",boxShadow:"0 24px 60px rgba(40,42,36,.18)",border:"1px solid "+P.line}}>{props.children}</div>
  </div>
);

function App(){
  const [stage,setStage]=useState("welcome");
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [dx,setDx]=useState(emptyDx);
  const [dxAlPausar,setDxAlPausar]=useState(null); // snapshot de dx al salir del chat, para detectar si el formulario cambió algo mientras tanto
  const [showDx,setShowDx]=useState(false);
  const [error,setError]=useState(null);
  const [exported,setExported]=useState(false);
  const [chatCopied,setChatCopied]=useState(false);
  const [sending,setSending]=useState(false);
  const [sendError,setSendError]=useState(null);
  const scrollRef=useRef(null);
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages,loading]);
  const filled=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim()).length;

  // Qué falta, en palabras — para mostrarle al padre algo más útil que un
  // contador. Devuelve los campos SIEMPRE requeridos que faltan (o que están
  // pero sin sustancia, en el caso de la cronología) y cuántos opcionales
  // más hacen falta para tener un panorama real.
  const faltantes=()=>{
    const camposFaltantes=[];
    for(const k of REQUIRED_SIEMPRE){
      const val=(dx[k]||"").trim();
      const okLargo = k==="cronologia_del_dia" ? val.length>=MIN_LEN_CRONOLOGIA : val.length>0;
      if(!okLargo) camposFaltantes.push(FIELDS.find(f=>f.key===k).label);
    }
    const opcionalesLlenos=OPCIONALES.filter(k=>dx[k]&&dx[k].trim()).length;
    const opcFaltan=Math.max(0, MIN_OPCIONALES-opcionalesLlenos);
    return { camposFaltantes, opcFaltan };
  };
  const puedeEnviar=()=>{ const {camposFaltantes,opcFaltan}=faltantes(); return camposFaltantes.length===0 && opcFaltan===0; };
  const mensajeFaltante=()=>{
    const {camposFaltantes,opcFaltan}=faltantes();
    const partes=[];
    if(camposFaltantes.length) partes.push(camposFaltantes.join(", "));
    if(opcFaltan>0) partes.push(opcFaltan+" tema"+(opcFaltan>1?"s":"")+" más de su día a día");
    return partes.join(" y ");
  };

  const parseDx=(text)=>{
    const m=text.match(/<dx>([\s\S]*?)<\/dx>/);
    const clean=text.replace(/<dx>[\s\S]*?<\/dx>/g,"").replace(/<dx>[\s\S]*$/,"").trim();
    if(m){ try{ const o=JSON.parse(m[1]); setDx(prev=>{const n={...prev}; for(const k of Object.keys(o)) if(o[k]&&o[k].trim()) n[k]=o[k]; return n;}); }catch(e){} }
    return clean;
  };

  // Detecta el marcador <escalar>motivo</escalar> (ver PROTOCOLO DE SEGURIDAD
  // del prompt) y lo oculta del texto que ve el padre — mismo patrón que
  // plan/index.html. Antes de esto, una señal de riesgo real durante la
  // CAPTURA (a diferencia del chat de seguimiento post-aprobación) quedaba
  // solo como texto en el Sheet, sin avisarle a nadie en el momento.
  const parseEscalar=(text)=>{
    const m=text.match(/<escalar>([\s\S]*?)<\/escalar>/);
    const clean=text.replace(/<escalar>[\s\S]*?<\/escalar>/g,"").trim();
    return { clean, motivo: m ? m[1].trim() : null };
  };

  // Notifica una señal real al equipo — sin bloquear el chat si falla.
  const notificarEscalar=(motivo, mensajePadre)=>{
    fetch(WORKER_URL+"/escalar",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ nombreNino:dx.nombre_nino||"", motivo, mensajePadre:mensajePadre||"" }) }).catch(()=>{});
  };

  // Detecta el marcador <cambiar_modo>formulario</cambiar_modo> — cuando el
  // padre pide por texto pasarse al formulario directo en vez de un botón.
  // Antes de esto, Vita simplemente seguía preguntando como si no hubiera
  // entendido (encontrado probando en vivo: "prefiero seguir con el
  // formulario" → Vita respondía "claro, seguimos" y hacía la siguiente
  // pregunta del chat, sin cambiar nada).
  const parseCambiarModo=(text)=>{
    const m=text.match(/<cambiar_modo>([\s\S]*?)<\/cambiar_modo>/);
    const clean=text.replace(/<cambiar_modo>[\s\S]*?<\/cambiar_modo>/g,"").trim();
    return { clean, modo: m ? m[1].trim() : null };
  };

  // Une el parseo de los tres marcadores (<escalar>, <cambiar_modo>, <dx>) en
  // un solo paso. Devuelve el texto limpio para mostrar y, si aplica, el modo
  // al que hay que cambiar — dx SIEMPRE queda compartido entre chat y
  // formulario (mismo estado de React), así que cambiar de modo nunca pierde
  // ni duplica lo ya capturado.
  const processReply=(raw, mensajePadre, motivoRespaldo)=>{
    const { clean:sinEscalar, motivo } = parseEscalar(raw);
    const { clean:sinModo, modo } = parseCambiarModo(sinEscalar);
    const clean = parseDx(sinModo);
    const motivoFinal = motivo || motivoRespaldo || null;
    if(motivoFinal) notificarEscalar(motivoFinal, mensajePadre);
    return { clean, modo };
  };

  const callVita=async(msgs)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),45000);
    try{
      const res=await fetch(WORKER_URL,{ method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ model:MODEL, max_tokens:2500, system:BASE, messages:msgs.map(x=>({role:x.role,content:x.content})) }), signal:ctrl.signal });
      const data=await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n") || (data.error? "⚠️ "+JSON.stringify(data.error):"…");
    } finally { clearTimeout(timer); }
  };

  // Arranca el chat de cero O lo retoma sabiendo lo que ya se capturó (por
  // ejemplo, si el padre vino del formulario directo con algunos campos ya
  // llenos, o de una sesión anterior). dx es el mismo estado compartido con
  // el modo formulario, así que nunca hay que "reconstruir" nada — solo
  // decirle a Vita qué ya sabe para que no lo vuelva a preguntar.
  const startOrResumeChat=async()=>{
    setStage("chat"); setLoading(true); setError(null);
    const known=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim());
    const opener = known.length===0
      ? "[Un padre/madre abrió el chat para contarte sobre su hijo/a, para el Formulario de Hábitos. Salúdalo, preséntate breve y haz la primera pregunta del área 1 (nombre y edad del hijo/a).]"
      : "[El padre/madre viene del formulario directo (o de una conversación previa) y ahora quiere conversar contigo. YA SABES esto — NO lo vuelvas a preguntar: "+known.map(f=>f.label+': "'+dx[f.key]+'"').join(" | ")+". Salúdalo con calidez reconociendo brevemente que ya tienes esa información (sin listarla toda de corrido), y continúa con la siguiente pregunta natural de lo que aún falte.]";
    try{
      const raw=await callVita([{role:"user",content:opener}]);
      const {clean}=processReply(raw,"(inicio o retoma de conversación)");
      setMessages([{role:"assistant",content:clean}]);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  // Si el padre edita el formulario mientras el chat está pausado a mitad de
  // camino, Vita no se entera sola (esos campos nunca pasaron por la
  // conversación) — sin esto, al volver podría repreguntar algo que ya está
  // en el formulario. Manda un turno invisible (no se agrega a los mensajes
  // visibles, mismo patrón que el opener de arriba) con lo que cambió.
  const sincronizarCambiosFormulario=async()=>{
    setLoading(true);
    const known=FIELDS.filter(f=>dx[f.key]&&dx[f.key].trim());
    const opener="[El padre/madre editó el formulario directo mientras la conversación estaba pausada. Esto es lo que hay AHORA — actualiza tu entendimiento, no repitas preguntas ya resueltas, y sigue con la siguiente pregunta natural de lo que falte: "+known.map(f=>f.label+': "'+dx[f.key]+'"').join(" | ")+".]";
    try{
      const raw=await callVita([...messages,{role:"user",content:opener}]);
      const {clean}=processReply(raw,"(retoma tras editar el formulario)");
      setMessages(m=>[...m,{role:"assistant",content:clean}]);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  // Botón/link "cambiar a chat": si ya había una conversación en curso, solo
  // cambia de vista — y si el formulario cambió algo mientras tanto, le
  // avisa a Vita antes de seguir. Si no había conversación, arranca una
  // nueva sabiendo lo que ya haya en dx (ej. llenado parcial del formulario).
  const goToChat=()=>{
    if(messages.length>0){
      setStage("chat");
      if(dxAlPausar!==null && dxAlPausar!==JSON.stringify(dx)) sincronizarCambiosFormulario();
    } else {
      startOrResumeChat();
    }
  };
  // "cambiar a formulario": dx ya es el mismo estado en ambos modos, así que
  // cambiar de vista alcanza — el formulario aparece con lo ya capturado.
  // Se guarda un snapshot de dx para poder detectar, al volver, si el padre
  // cambió algo mientras el chat estaba pausado.
  const goToForm=()=>{ setDxAlPausar(JSON.stringify(dx)); setStage("form"); };

  const send=async(text)=>{
    const content=(text??input).trim(); if(!content||loading) return;
    setError(null); const next=[...messages,{role:"user",content}]; setMessages(next); setInput(""); setLoading(true);
    const motivoRespaldo=detectarRiesgoTextual(content);
    try{
      const raw=await callVita(next);
      const {clean,modo}=processReply(raw,content,motivoRespaldo);
      setMessages(m=>[...m,{role:"assistant",content:clean}]);
      if(modo==="formulario") setTimeout(goToForm,700);
    }
    catch(e){ setError("No se pudo conectar. Reintenta."); } finally{ setLoading(false); }
  };

  const retry=()=>{
    if(loading) return;
    setError(null);
    if(messages.length===0){ startOrResumeChat(); return; }
    setLoading(true);
    const last=messages[messages.length-1];
    const lastUser=last&&last.role==="user"?last.content:"";
    const motivoRespaldo=detectarRiesgoTextual(lastUser);
    callVita(messages)
      .then(raw=>{
        const {clean,modo}=processReply(raw,lastUser,motivoRespaldo);
        setMessages(m=>[...m,{role:"assistant",content:clean}]);
        if(modo==="formulario") setTimeout(goToForm,700);
      })
      .catch(()=>setError("No se pudo conectar. Reintenta."))
      .finally(()=>setLoading(false));
  };

  // HITL capture-only: nada se le muestra al padre como recomendación. Esto manda
  // el diagnóstico capturado a revisión (mismo Sheet vía el mismo Worker que
  // vita-demo-srb-3) — Peter lo aprueba antes de que alguien le escriba al padre.
  const sendToReview=async()=>{
    if(sending||!puedeEnviar()) return; // el botón ya se deshabilita solo, esto es el respaldo por si acaso
    setSending(true); setSendError(null);
    // Última red de respaldo antes de enviar: escanea TODO lo capturado —
    // por chat o por el modo formulario directo, que no pasa por el modelo
    // en absoluto y por eso no tiene ningún otro chequeo de riesgo. Dedupe
    // por motivo para no mandar varios correos iguales.
    const motivosEncontrados=new Set();
    for(const k of Object.keys(dx)){ const m=detectarRiesgoTextual(dx[k]); if(m) motivosEncontrados.add(m); }
    motivosEncontrados.forEach(m=>notificarEscalar(m, dx.preocupacion_principal||dx.senales_observables||""));
    try{
      const res=await fetch(WORKER_URL+"/log",{ method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ producto:"formulario", mode:MODE, dx, ts:new Date().toISOString() }) });
      const data=await res.json().catch(()=>({}));
      if(!res.ok || data.ok===false) throw new Error("log failed");
      setStage("sent");
    }catch(e){ setSendError("No se pudo enviar. Reintenta."); }
    finally{ setSending(false); }
  };

  const exportDx=async()=>{ const txt="FORMULARIO DE HÁBITOS · Bienestar 360\n\n"+FIELDS.map(f=>f.label+": "+(dx[f.key]||"—")).join("\n"); try{ await navigator.clipboard.writeText(txt); setExported(true); setTimeout(()=>setExported(false),2000);}catch(e){ const w=window.open("","_blank"); if(w){ w.document.body.style.cssText="font-family:system-ui;padding:20px;white-space:pre-wrap;line-height:1.5"; w.document.body.textContent=txt; } } };

  const copyChat=async()=>{ const txt="CONVERSACIÓN CON VITA · Bienestar 360 (Formulario de Hábitos)\nFecha: "+new Date().toLocaleString("es-CO")+"\n\n"+messages.map(m=>(m.role==="assistant"?"Vita":"Tú (mamá/papá)")+":\n"+m.content).join("\n\n"); try{ await navigator.clipboard.writeText(txt); setChatCopied(true); setTimeout(()=>setChatCopied(false),2000);}catch(e){ const w=window.open("","_blank"); if(w){ w.document.body.style.cssText="font-family:system-ui;padding:20px;white-space:pre-wrap;line-height:1.5"; w.document.body.textContent=txt; } } };
  const btnPrimary={background:P.sage,color:"#fff",border:"none",borderRadius:999,padding:"14px 30px",fontSize:15.5,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",boxShadow:"0 6px 18px rgba(90,122,92,.35)"};

  if(stage==="welcome") return (
    <Shell><div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"32px 26px",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:14}}>🌱</div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:27,color:P.sageDeep,lineHeight:1.15,marginBottom:14}}>Hola, soy Vita</div>
      <p style={{fontSize:15,color:P.ink,lineHeight:1.6,maxWidth:360,marginBottom:8}}>Cuéntame del día a día de tu hijo o hija — cómo come, duerme y se mueve.</p>
      <p style={{fontSize:13.5,color:P.muted,lineHeight:1.6,maxWidth:360,marginBottom:24}}>Al final, tu información queda registrada para que la revisemos y preparemos el primer paso.</p>
      <button onClick={()=>setStage("intro")} style={btnPrimary}>Comenzar →</button>
      <button onClick={()=>setStage("form")} style={{background:"none",border:"none",color:P.sageDeep,fontSize:12.5,fontWeight:700,marginTop:16,cursor:"pointer",textDecoration:"underline",fontFamily:"'Nunito',sans-serif"}}>Prefiero llenar el formulario directo →</button>
      <p style={{fontSize:11.5,color:P.muted,marginTop:18,maxWidth:320}}>Esto acompaña y suma con su pediatra — no lo reemplaza.</p>
    </div></Shell>
  );

  if(stage==="form") return (
    <Shell><div className="rise scroll" style={{flex:1,overflowY:"auto",padding:"26px 22px 18px",display:"flex",flexDirection:"column",gap:16}}>
      <div style={{textAlign:"center",marginBottom:2}}>
        <div style={{fontSize:36,marginBottom:8}}>🌱</div>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:21,color:P.sageDeep,marginBottom:6}}>Formulario de Hábitos</div>
        <p style={{fontSize:12.5,color:P.muted,lineHeight:1.5,maxWidth:340,margin:"0 auto"}}>Llena lo que sepas — no hace falta que sea perfecto ni completo, el equipo lo revisa igual. Si prefieres, también puedes <span onClick={goToChat} style={{color:P.sageDeep,fontWeight:700,textDecoration:"underline",cursor:"pointer"}}>conversar con Vita</span> — lo que ya llenaste aquí no se pierde.</p>
      </div>
      {FIELDS.map(f=>(
        <div key={f.key} style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:13,fontWeight:800,color:P.sageDeep}}>{f.label}</label>
          {f.hint && <div style={{fontSize:11.5,color:P.muted,lineHeight:1.4}}>{f.hint}</div>}
          <textarea value={dx[f.key]} onChange={e=>setDx(prev=>({...prev,[f.key]:e.target.value}))} rows={f.key==="cronologia_del_dia"?4:(f.key==="nombre_padre"||f.key==="email_padre"||f.key==="nombre_nino"||f.key==="edad"?1:2)} style={{border:"1px solid "+P.line,borderRadius:12,padding:"9px 11px",fontSize:13.5,fontFamily:"'Nunito',sans-serif",background:"#fff",color:P.ink,outline:"none",resize:"vertical"}}/>
        </div>
      ))}
      <button onClick={sendToReview} disabled={!puedeEnviar()||sending} style={{...btnPrimary,alignSelf:"center",marginTop:6,opacity:(!puedeEnviar()||sending)?.55:1,cursor:(!puedeEnviar()||sending)?"default":"pointer"}}>{sending?"Enviando…":"Enviar a revisión →"}</button>
      {!puedeEnviar() && <p style={{fontSize:11.5,color:P.muted,textAlign:"center"}}>Aún falta: {mensajeFaltante()}.</p>}
      {sendError && <p style={{fontSize:12.5,color:P.clay,textAlign:"center"}}>{sendError}</p>}
      <p style={{fontSize:11,color:P.muted,textAlign:"center",lineHeight:1.5,marginTop:2}}>Esto acompaña y suma con su pediatra — no lo reemplaza.</p>
    </div></Shell>
  );

  if(stage==="sent") return (
    <Shell><div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"32px 26px",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:14}}>🌱</div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:25,color:P.sageDeep,lineHeight:1.2,marginBottom:14}}>Listo, ya quedó registrado</div>
      <p style={{fontSize:15,color:P.ink,lineHeight:1.6,maxWidth:360,marginBottom:10}}>La información de {dx.nombre_nino?dx.nombre_nino:"tu hijo/a"} queda en manos del equipo. La revisamos y preparamos el primer paso — te contactamos pronto.</p>
      <p style={{fontSize:13,color:P.muted,lineHeight:1.6,maxWidth:340}}>Esto acompaña y suma con su pediatra — no lo reemplaza.</p>
    </div></Shell>
  );

  if(stage==="intro") return (
    <Shell><div className="rise scroll" style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",justifyContent:"center",padding:"30px 26px"}}>
      <div style={{fontSize:40,marginBottom:12,textAlign:"center"}}>🌱</div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:23,color:P.sageDeep,lineHeight:1.2,marginBottom:16,textAlign:"center"}}>Cómo vamos a hacerlo</div>
      <p style={{fontSize:14.5,color:P.ink,lineHeight:1.65,marginBottom:14}}>La atención, el ánimo y la energía de un niño se apoyan mucho en los hábitos del hogar: lo que come y bebe, a qué hora, cuánto se mueve y cómo duerme. Tú eres el puente.</p>
      <div style={{background:P.sageSoft,borderRadius:16,padding:"16px",marginBottom:18}}>
        <div style={{display:"flex",gap:11,marginBottom:12}}><div style={{fontSize:18,flexShrink:0}}>🕊️</div><div style={{fontSize:13.5,color:P.ink,lineHeight:1.5}}>Reconstruimos un día normal de tu hijo/a, desde que despierta hasta que se duerme. Con calma, sin juzgar.</div></div>
        <div style={{display:"flex",gap:11,marginBottom:12}}><div style={{fontSize:18,flexShrink:0}}>💬</div><div style={{fontSize:13.5,color:P.ink,lineHeight:1.5}}>Es una conversación tranquila, sin afán — puede tomar entre 20 y 30 minutos.</div></div>
        <div style={{display:"flex",gap:11}}><div style={{fontSize:18,flexShrink:0}}>🌿</div><div style={{fontSize:13.5,color:P.ink,lineHeight:1.5}}>Al final, tu información queda registrada — la revisamos y te contactamos con el primer paso.</div></div>
      </div>
      <button onClick={startOrResumeChat} style={{...btnPrimary,alignSelf:"center"}}>Empezar la conversación →</button>
    </div></Shell>
  );

  return (
    <Shell>
      <div style={{background:"linear-gradient(135deg,"+P.sageDeep+","+P.sage+")",padding:"14px 16px",display:"flex",alignItems:"center",gap:11}}>
        <div style={{width:40,height:40,borderRadius:"50%",background:P.panel,display:"grid",placeItems:"center",fontSize:20}}>🌱</div>
        <div style={{flex:1}}><div style={{fontFamily:"'Fraunces',serif",fontWeight:600,fontSize:19,color:"#fff",lineHeight:1}}>Vita</div><div style={{fontSize:11.5,color:P.sageSoft,marginTop:3}}>{loading?"escribiendo…":(dx.nombre_nino?("Sobre "+dx.nombre_nino):"Conociéndolos")}</div></div>
        <button onClick={copyChat} title="Copiar conversación" style={{background:"rgba(255,255,255,.18)",border:"none",color:"#fff",borderRadius:999,width:34,height:34,fontSize:15,cursor:"pointer",flexShrink:0}}>{chatCopied?"✓":"📋"}</button><button onClick={goToForm} title="Cambiar al formulario directo" style={{background:"rgba(255,255,255,.18)",border:"none",color:"#fff",borderRadius:999,width:34,height:34,fontSize:15,cursor:"pointer",flexShrink:0}}>📝</button><button onClick={()=>setShowDx(true)} style={{background:"rgba(255,255,255,.18)",border:"none",color:"#fff",borderRadius:999,padding:"7px 13px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>Lo que llevamos · {filled}/{AREA_TOTAL}</button>
      </div>
      {filled>=3 && (
        <div style={{padding:"9px 14px",background:P.sageSoft,borderBottom:"1px solid "+P.line,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{fontSize:12,color:P.sageDeep,lineHeight:1.4}}>{puedeEnviar()?"Cuando termines de contarme, envía tu información para que el equipo la revise.":"Aún falta: "+mensajeFaltante()+"."}</div>
          <button onClick={sendToReview} disabled={sending||!puedeEnviar()} style={{background:P.sage,color:"#fff",border:"none",borderRadius:999,padding:"8px 14px",fontSize:12.5,fontWeight:800,cursor:(sending||!puedeEnviar())?"default":"pointer",fontFamily:"'Nunito',sans-serif",flexShrink:0,opacity:(sending||!puedeEnviar())?.55:1}}>{sending?"Enviando…":"Enviar a revisión →"}</button>
        </div>
      )}
      <div ref={scrollRef} className="scroll" style={{flex:1,overflowY:"auto",padding:"16px 13px",display:"flex",flexDirection:"column",gap:10,background:"radial-gradient("+P.sageSoft+"55 1px,transparent 1px)",backgroundSize:"22px 22px"}}>
        {messages.map((m,i)=>(<div key={i} className="rise" style={{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"84%"}}><div style={{background:m.role==="user"?P.user:"#fff",color:P.ink,padding:"10px 13px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",fontSize:14.5,lineHeight:1.5,boxShadow:"0 1px 2px rgba(40,42,36,.10)",whiteSpace:"pre-wrap",border:m.role==="user"?"none":"1px solid "+P.line}}>{renderRich(m.content)}</div></div>))}
        {loading&&(<div style={{alignSelf:"flex-start",background:"#fff",padding:"12px 15px",borderRadius:"16px 16px 16px 4px",border:"1px solid "+P.line}}><span className="dot"/> <span className="dot"/> <span className="dot"/></div>)}
        {error&&!loading&&(<div style={{alignSelf:"center",textAlign:"center",color:P.clay,fontSize:12.5,background:"#fff",padding:"10px 14px",borderRadius:12,border:"1px solid "+P.line,maxWidth:"92%"}}>{error}<div style={{marginTop:8}}><button onClick={retry} style={{background:P.sage,border:"none",color:"#fff",borderRadius:999,padding:"7px 18px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>Reintentar</button></div><div style={{marginTop:7,fontSize:11,color:P.muted,lineHeight:1.4}}>Si sigue fallando, abre el enlace en tu navegador (Chrome o Safari), no dentro de otra app.</div></div>)}
        {sendError&&(<div style={{alignSelf:"center",textAlign:"center",color:P.clay,fontSize:12.5,background:"#fff",padding:"10px 14px",borderRadius:12,border:"1px solid "+P.line,maxWidth:"92%"}}>{sendError}<div style={{marginTop:8}}><button onClick={sendToReview} style={{background:P.sage,border:"none",color:"#fff",borderRadius:999,padding:"7px 18px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>Reintentar envío</button></div></div>)}
      </div>
      <div style={{padding:"10px 12px",background:P.panel,borderTop:"1px solid "+P.line,display:"flex",gap:8,alignItems:"flex-end"}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Escribe aquí…" rows={1} style={{flex:1,resize:"none",border:"1px solid "+P.line,borderRadius:20,padding:"11px 15px",fontSize:14.5,fontFamily:"'Nunito',sans-serif",maxHeight:110,background:"#fff",color:P.ink,outline:"none"}}/>
        <button onClick={()=>send()} disabled={loading||!input.trim()} style={{width:46,height:46,borderRadius:"50%",border:"none",background:input.trim()?P.sage:P.line,color:"#fff",fontSize:19,cursor:input.trim()?"pointer":"default",flexShrink:0}}>➤</button>
      </div>
      {showDx&&(<div onClick={()=>setShowDx(false)} style={{position:"absolute",inset:0,background:"rgba(40,42,36,.45)",display:"flex",justifyContent:"flex-end",zIndex:10}}>
        <div onClick={e=>e.stopPropagation()} style={{width:"86%",maxWidth:360,background:P.panel,height:"100%",display:"flex",flexDirection:"column",boxShadow:"-10px 0 40px rgba(0,0,0,.25)"}}>
          <div style={{background:P.sageDeep,padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:"#fff"}}>Lo que hemos hablado</div><div style={{fontSize:12,color:P.sageSoft,marginTop:2}}>{filled} de {AREA_TOTAL} temas registrados</div></div><button onClick={()=>setShowDx(false)} style={{background:"rgba(255,255,255,.16)",border:"none",color:"#fff",width:32,height:32,borderRadius:"50%",fontSize:16,cursor:"pointer"}}>✕</button></div>
          <div className="scroll" style={{flex:1,overflowY:"auto",padding:14}}>
            {FIELDS.map(f=>{const val=dx[f.key];const has=val&&val.trim();return(<div key={f.key} style={{marginBottom:10,background:"#fff",border:"1px solid "+(has?P.sage:P.line),borderRadius:12,padding:"10px 12px"}}><div style={{fontSize:11.5,fontWeight:800,color:has?P.sageDeep:P.muted,textTransform:"uppercase",letterSpacing:.4,marginBottom:has?4:0}}>{f.label}</div>{has&&<div style={{fontSize:13.5,color:P.ink,lineHeight:1.45}}>{val}</div>}</div>);})}
          </div>
          <div style={{padding:12,borderTop:"1px solid "+P.line,display:"flex",flexDirection:"column",gap:8}}>
            <button onClick={()=>{setShowDx(false);goToForm();}} style={{background:P.sageDeep,color:"#fff",border:"none",borderRadius:12,padding:"11px",fontSize:13.5,fontWeight:800,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>Terminarlo en el formulario directo →</button>
            <button onClick={exportDx} style={{background:exported?P.sage:P.clay,color:"#fff",border:"none",borderRadius:12,padding:"11px",fontSize:13.5,fontWeight:800,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>{exported?"✓ Copiado":"Copiar mi resumen"}</button>
          </div>
        </div>
      </div>)}
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
