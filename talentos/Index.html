<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Bienestar 360 · Para tu familia</title>
  <meta name="description" content="Acompañamiento de bienestar familiar — cuerpo sano, mente brillante para tu hijo y tu hogar.">

  <!-- Open Graph para preview si comparten el link -->
  <meta property="og:title" content="Bienestar 360 · Para tu familia">
  <meta property="og:description" content="Cuerpo sano, mente brillante — para tu hijo y tu hogar.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://be360.app/talentos">

  <style>
    :root {
      --navy: #1F3A5F;
      --green: #4A8B3D;
      --light-blue: #7AB5D9;
      --gray-text: #6B6B6B;
      --bg: #FAFAFA;
      --bg-soft: #F4F6F8;
      --ink: #1A1A1A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* HERO */
    .hero {
      padding: 56px 0 40px;
      text-align: center;
    }

    .logo {
      max-width: 260px;
      height: auto;
      margin-bottom: 32px;
    }

    .welcome-pill {
      display: inline-block;
      background: #E9F1F8;
      color: var(--navy);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    h1 .accent { color: var(--green); }

    .subtitle {
      font-size: clamp(17px, 2.4vw, 20px);
      color: var(--gray-text);
      max-width: 560px;
      margin: 0 auto 36px;
    }

    .btn {
      display: inline-block;
      background: var(--navy);
      color: white;
      padding: 16px 36px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(31,58,95,0.18);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(31,58,95,0.25);
    }

    .btn-secondary {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--navy);
      box-shadow: none;
      margin-left: 8px;
    }

    /* SECTIONS */
    section {
      padding: 48px 0;
    }

    .section-bg {
      background: var(--bg-soft);
    }

    h2 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 28px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    /* QUÉ HACEMOS — viñetas */
    .features {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 8px;
    }

    @media (min-width: 640px) {
      .features { grid-template-columns: 1fr 1fr; }
    }

    .feature {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #E7E9EC;
    }

    .feature-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #E9F1F8;
      color: var(--navy);
      font-size: 22px;
      margin-bottom: 14px;
    }

    .feature h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .feature p {
      font-size: 15px;
      color: var(--gray-text);
      line-height: 1.55;
    }

    /* PARA QUIÉN */
    .audience {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .audience-list {
      list-style: none;
      margin-top: 8px;
      font-size: 17px;
      color: var(--ink);
    }

    .audience-list li {
      padding: 12px 0;
      border-bottom: 1px solid #E7E9EC;
    }

    .audience-list li:last-child { border-bottom: none; }

    .audience-list li::before {
      content: "⚽ ";
      margin-right: 6px;
    }

    /* QUIÉNES SOMOS */
    .team {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 8px;
    }

    @media (min-width: 640px) {
      .team { grid-template-columns: 1fr 1fr; }
    }

    .person {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #E7E9EC;
    }

    .person h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .person .role {
      font-size: 14px;
      color: var(--green);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .person p {
      font-size: 15px;
      color: var(--gray-text);
    }

    /* FINAL CTA */
    .final-cta {
      text-align: center;
      padding: 56px 0 32px;
    }

    .final-cta h2 { margin-bottom: 14px; }

    .final-cta p {
      color: var(--gray-text);
      margin-bottom: 28px;
      font-size: 17px;
    }

    /* DISCLAIMER */
    .disclaimer {
      font-size: 13px;
      color: var(--gray-text);
      text-align: center;
      padding: 16px 24px 24px;
      max-width: 560px;
      margin: 0 auto;
      font-style: italic;
    }

    /* FOOTER */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.85);
      text-align: center;
      padding: 32px 24px;
      font-size: 14px;
    }

    footer a {
      color: var(--light-blue);
      text-decoration: none;
    }

    footer .footer-links {
      margin-bottom: 8px;
    }

    footer .footer-links a {
      margin: 0 10px;
    }
  </style>
</head>
