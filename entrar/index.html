<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>be360 · Recuperar acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Vanilla JS a propósito, mismo criterio que verificar/index.html — es un
     formulario de una sola pregunta, no necesita React ni Babel-standalone.
     Mismo sistema visual que el resto del producto (paleta sage/cream,
     tipografías Fraunces/Nunito) para que se sienta parte de lo mismo. */
  html,body{margin:0;height:100%}
  *{box-sizing:border-box}
  body{background:#ECE5D8;font-family:'Nunito',sans-serif;color:#2C2A24;display:flex;justify-content:center;padding:16px 12px 28px;min-height:100vh}
  .shell{width:100%;max-width:440px;background:#FBF8F1;border-radius:26px;box-shadow:0 24px 60px rgba(40,42,36,.18);border:1px solid #D8CFBE;padding:32px 26px;text-align:center;align-self:center}
  .emoji{font-size:48px;margin-bottom:14px}
  h1{font-family:'Fraunces',serif;font-size:24px;color:#3E5A40;margin:0 0 14px;line-height:1.2}
  p{font-size:14.5px;line-height:1.6;color:#2C2A24;margin:0 0 10px}
  .muted{font-size:12.5px;color:#8A8473;line-height:1.6}
  input{width:100%;border:1px solid #D8CFBE;border-radius:12px;padding:12px 14px;font-size:16px;font-family:'Nunito',sans-serif;background:#fff;color:#2C2A24;outline:none;margin:18px 0 6px;text-align:center}
  button{background:#5A7A5C;color:#fff;border:none;border-radius:999px;padding:14px 30px;font-size:15.5px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(90,122,92,.35)}
  button:disabled{opacity:.55;cursor:default}
  .error{font-size:13px;color:#B5764A;margin-top:10px;line-height:1.5}
  .ok{font-size:15px;color:#3E5A40;line-height:1.6}
</style>
</head>
<body>
<div class="shell" id="app">
  <div class="emoji">🌱</div>
  <div id="content"></div>
</div>
<script>
const WORKER_URL = "https://vita-proxy.leonardo-751.workers.dev";
const content = document.getElementById("content");

function render(html) { content.innerHTML = html; }

function renderForm(errorMsg) {
  render(
    '<h1>¿Perdiste tu link?</h1>' +
    '<p>Escribe el correo con el que registraste a tu hijo/a y te mandamos de nuevo el acceso a su plan.</p>' +
    '<input id="correo" type="email" placeholder="tu@correo.com" autocomplete="email" autocapitalize="none" />' +
    (errorMsg ? '<div class="error">' + errorMsg + '</div>' : '') +
    '<div style="margin-top:16px"><button id="btn-enviar">Enviarme el link →</button></div>' +
    '<p class="muted" style="margin-top:18px">¿Sigue sin llegar? Escríbenos a <a href="mailto:leonardo@ledelab.group" style="color:#5A7A5C">leonardo@ledelab.group</a>.</p>'
  );
  const btn = document.getElementById("btn-enviar");
  const input = document.getElementById("correo");
  input.focus();
  const enviar = () => solicitar(input.value);
  btn.addEventListener("click", enviar);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });
}

// Mensaje SIEMPRE igual, exista o no ese correo en el sistema — ver la nota
// junto a solicitarAcceso() en el Apps Script. Nunca le decimos al que
// pregunta si un correo específico tiene o no un caso real, para que esta
// pantalla no sirva para enumerar correos.
function renderExito() {
  render(
    '<h1>Revisa tu correo</h1>' +
    '<p class="ok">Si ese correo tiene un plan aprobado con nosotros, en unos minutos te llega un mensaje con el link de acceso.</p>' +
    '<p class="muted" style="margin-top:16px">¿No te llega? Revisa spam o escríbenos a <a href="mailto:leonardo@ledelab.group" style="color:#5A7A5C">leonardo@ledelab.group</a>.</p>'
  );
}

async function solicitar(correo) {
  const valor = (correo || "").trim();
  if (!valor || !valor.includes("@")) { renderForm("Escribe un correo válido."); return; }
  const btn = document.getElementById("btn-enviar");
  if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  try {
    const res = await fetch(WORKER_URL + "/solicitar-acceso", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: valor }),
    });
    const data = await res.json().catch(() => ({}));
    if (data && data.ok) { renderExito(); return; }
    renderForm(data && data.error ? data.error : "No se pudo enviar. Intenta de nuevo.");
  } catch (e) {
    renderForm("No se pudo conectar. Revisa tu conexión e intenta de nuevo.");
  }
}

renderForm();
</script>
</body>
</html>
