name = "vita-proxy"
main = "vita-proxy.js"
compatibility_date = "2026-08-01"

account_id = "7518a7101f0bd1493e00c166a256b31b"
preview_urls = false

# Restaura lo que ya estaba configurado en el dashboard (el primer deploy vía
# wrangler lo apagó por no estar declarado aquí — ver commit que agregó esto).
[observability]
enabled = true

# Rate limiting (9 ago 2026) — binding creado desde el dashboard de
# Cloudflare (namespace "vita_rate_limit"). Declarado aquí por la MISMA
# razón que [observability] arriba: wrangler.toml es la fuente de verdad en
# cada deploy — si esto no estuviera declarado, el próximo `wrangler deploy`
# borraría el binding sin avisar. Ver checkRateLimit() en vita-proxy.js.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1f6ffb40f0d8437faca2c57c5981323e"

# Secrets (no van en este archivo, se cargan con `wrangler secret put <nombre>`):
#   wrangler secret put ANTHROPIC_API_KEY      (ya debería existir si se importa el worker actual)
#   wrangler secret put SHEET_WEBHOOK_URL
#   wrangler secret put SHEET_WEBHOOK_SECRET
