name = "vita-proxy"
main = "vita-proxy.js"
compatibility_date = "2026-08-01"

account_id = "7518a7101f0bd1493e00c166a256b31b"
preview_urls = false

# Restaura lo que ya estaba configurado en el dashboard (el primer deploy vía
# wrangler lo apagó por no estar declarado aquí — ver commit que agregó esto).
[observability]
enabled = true

# Rate limiting (9 ago 2026) — Durable Object, NO KV. El primer intento con
# el namespace de KV "vita_rate_limit" (creado desde el dashboard) se probó
# en vivo y el contador nunca se disparó tras 73 peticiones seguidas — KV es
# "eventually consistent" a propósito, no sirve para un contador que cambia
# en cada petición. Reemplazado por la clase RateLimiter (ver vita-proxy.js),
# que sí da consistencia real: Cloudflare procesa las peticiones a la misma
# instancia (misma IP) una por una. El namespace "vita_rate_limit" queda sin
# usar — no hace daño dejarlo, se puede borrar a mano desde el dashboard si
# se quiere ordenar.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Secrets (no van en este archivo, se cargan con `wrangler secret put <nombre>`):
#   wrangler secret put ANTHROPIC_API_KEY      (ya debería existir si se importa el worker actual)
#   wrangler secret put SHEET_WEBHOOK_URL
#   wrangler secret put SHEET_WEBHOOK_SECRET
