/* ===== Estado + motor ===== */
let L = detectLang();
let segIdx = null, ansKey = null, current = "welcome";

function detectLang(){
  var n = (navigator.language||"es").slice(0,2).toLowerCase();
  return (["es","en","et","fr"].indexOf(n)>=0) ? n : "es";
}
function $(id){return document.getElementById(id);}
function setProgress(screen){
  var map={welcome:8,hero:20,segment:42,question:66,result:90,contact:100};
  $("bar").style.width=(map[screen]||8)+"%";
}
function go(screen){
  current=screen;
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  $("s-"+screen).classList.add("active");
  setProgress(screen);
  $("sticky").style.display=(screen==="result"||screen==="question")?"block":"none";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* render estático según idioma */

  var u=UI[L];

  $("hEyebrow").textContent=u.heroEyebrow; $("hH1").textContent=u.heroH1; $("hLead").textContent=u.heroLead;
  $("hTag2").textContent=u.heroTag; $("startBtn").textContent=u.startBtn; $("hFoot").textContent=u.heroFoot;

  $("resEyebrow").textContent=u.resEyebrow; $("rDiagLabel").textContent=u.diagLabel; $("rRecoLabel").textContent=u.recoLabel;
  $("rAgenda").textContent=u.ctaAgenda; $("rListoMas").textContent=u.listoMas;
  $("rProgram2").textContent=u.program2; $("rSolo").textContent=u.solo; $("rNote").textContent=u.note;
  $("cEyebrow").textContent=u.cEyebrow; $("cTitle").textContent=u.cTitle; $("cLead").textContent=u.cLead;
  $("cAgenda").textContent=u.ctaAgenda; $("cGuardarTxt").textContent=u.guardar; $("cMailTxt").textContent=u.email;
  $("cFoot").innerHTML="<b>Leonardo De la Hoz Borrego</b> · jAvIer Institute · be360 · LedeLab";
  $("stickyBtn").textContent=u.sticky;
  // agenda links
  var ah=dest("agenda",u.agendaSubject,u.agendaBody);

  // contacto
  $("cMail").href=LINKS.email;

  try{var blob=new Blob([VCARD],{type:"text/vcard"});$("cContact").href=URL.createObjectURL(blob);$("cContact").setAttribute("download","Leonardo-De-la-Hoz.vcf");}catch(e){}

function renderSegments(){
  var wrap=$("segmentOpts"); wrap.innerHTML="";
  SEG[L].forEach(function(seg,i){
    var b=document.createElement("button"); b.className="opt";
    b.innerHTML='<span class="ico">'+seg.ico+'</span><span class="txt"><span class="ot">'+seg.t+'</span><span class="od">'+seg.d+'</span></span>';
    b.addEventListener("click",function(){segIdx=i; renderQuestion(); go("question");});
    wrap.appendChild(b);
  });
}
function renderQuestion(){
  var seg=SEG[L][segIdx];
  $("qTitle").textContent=seg.q.title; $("qLead").textContent=seg.q.lead;
  var wrap=$("questionOpts"); wrap.innerHTML="";
  seg.q.opts.forEach(function(o){
    var b=document.createElement("button"); b.className="opt";
    b.innerHTML='<span class="ico">'+o.ico+'</span><span class="txt"><span class="ot">'+o.t+'</span><span class="od">'+o.d+'</span></span>';
    b.addEventListener("click",function(){ansKey=o.k; renderResult(); go("result");});
    wrap.appendChild(b);
  });
}
function progLink(p){
  if(p.key==="be360site") return LINKS.be360;
  return dest(p.key, UI[L].mailLead+p.name, UI[L].mailBody);
}
function renderResult(){
  var seg=SEG[L][segIdx], u=UI[L];
  var title=(typeof seg.title==="string")?seg.title:seg.title[ansKey];
  $("rTitle").textContent=title;
  $("rDiag").innerHTML=seg.diag[ansKey];
  var p=seg.prog.list[ seg.prog[ansKey] ];
  $("rProgName").textContent=p.name; $("rProgDesc").textContent=p.desc;
  var link=progLink(p);
  $("rProgLink").textContent=p.cta; $("rProgLink").href=link;
  $("rProgram2").textContent=p.cta.replace(" →",""); $("rProgram2").href=link;
}

/* selector y bienvenida */
function buildLangbar(){
  var bar=$("langbar"); bar.innerHTML="";
  ["es","en","et","fr"].forEach(function(l){
    var b=document.createElement("button"); b.textContent=l.toUpperCase();
    if(l===L) b.className="on";
    b.addEventListener("click",function(){setLang(l);});
    bar.appendChild(b);
  });
}
function buildWelcome(){
  var w=$("wLangs"); w.innerHTML="";
  ["es","en","et","fr"].forEach(function(l){
    var b=document.createElement("button"); b.className="wlang"+(l===L?" detected":"");
    b.innerHTML='<span class="fl">'+FLAGS[l]+'</span> '+LANGNAMES[l];
    b.addEventListener("click",function(){setLang(l); go("hero");});
    w.appendChild(b);
  });
}
function setLang(l){
  L=l;
  document.documentElement.lang=l;
  renderStatic(); renderSegments(); buildLangbar(); buildWelcome();
  if(current==="question") renderQuestion();
  if(current==="result") renderResult();
}

/* navegación de botones data-go (sin onclick inline) */
document.querySelectorAll("[data-go]").forEach(function(el){
  el.addEventListener("click",function(){go(this.getAttribute("data-go"));});
});

/* init */
document.documentElement.lang=L;
renderStatic(); renderSegments(); buildLangbar(); buildWelcome();
setProgress("welcome");
